<script>
(function(){
  /* 流式布局紧凑化 */
  function fit(){
    var h=document.documentElement.clientHeight||window.innerHeight;
    document.body.classList.toggle('compact',h<1000);
    document.body.classList.toggle('tiny',h<720);
  }
  window.addEventListener('resize',fit);
  if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
  fit();

  /* 统一提示：只在出错 / 操作被拦住时才在页眉弹一条，普通反馈静默。
     2026-11-15 用户口径「随便点一下就提示没意义，只有错误的时候提示不行吗」：
     点一下分镜弹「第 N 段 · 素材名 · 秒数」属于噪音，工具栏里本来就有段信息。
     判定 = 调用方 say(msg,true)，或文本命中 SAY_ERR；命中即染红。
     静默时不动当前正在显示的错误提示，避免把上一条错误提前关掉。
     临时排查可恢复全部提示：localStorage.setItem('riffcut.say.verbose','1')。 */
  var toast=document.getElementById('toast'),tm;
  var SAY_ERR=/失败|出错|报错|错误|异常|超时|读不到|不能|无法|不可用|不支持|没连上|连不上|未响应|没起来|拒绝|中止|中断|无效|找不到|不存在|请先|先选|先说|太短|没听清|没权限|没有权限|禁用|缺少|不足|超限|HTTP\s*\d|fetch|ffmpeg|ffprobe|Error|Exception|Failed|Cannot|Could not|denied|NotAllowed|refused|timeout/i;
  function sayIsError(s,bad){return !!bad||SAY_ERR.test(s)}
  /* 第三个参数 force：用户主动点了按钮、必须有结果反馈的操作传 true。
     ★ 2026-11-20 用户报「点测试没有提示」。根因就是下面那句静默过滤：
     测试成功的文案是「✓ 连接正常：收到」，不含任何错误关键词 → err=false →
     被 `if(!err&&!verbose)return` 直接吞掉。于是失败能看到、成功反而没反应，
     用户以为按钮坏了。按钮类操作的成功/进行中提示必须显式放行。 */
  window.say=function(m,bad,force){
    if(!toast)return;
    var s=String(m==null?'':m);
    var err=sayIsError(s,bad);
    /* 系统性故障（服务连不上 / FFmpeg 起不来）只留页眉那条常驻告警 */
    if(window.sysAlert&&/失败|没连上|连不上|未响应|超时|fetch|HTTP\s*\d|ffmpeg|ffprobe/i.test(s)
       &&(window.sysAlert.has('service')||window.sysAlert.has('ffmpeg')))return;
    var verbose=false;
    try{verbose=localStorage.getItem('riffcut.say.verbose')==='1'}catch(e){}
    if(!err&&!verbose&&!force)return;   /* 信息性反馈：不弹，也不动上一条提示 */
    toast.textContent=s;
    toast.title=s;   /* 单行省略后，鼠标悬停仍能读到全文 */
    /* 页眉正中已被系统级告警占着 → 这条落到页眉下方一行，别和红条叠在一起 */
    var sa=document.getElementById('sysAlert');
    toast.classList.toggle('with-alert',!!(sa&&!sa.hidden));
    toast.classList.toggle('bad',err);
    toast.classList.add('on');clearTimeout(tm);
    var ms=Math.min(7000,Math.max(2000,s.length*120));
    tm=setTimeout(function(){toast.classList.remove('on')},ms);
  };

  /* ── 系统级告警（页眉正中，红色呼吸脉冲）────────
     用法：
       sysAlert.set('ffmpeg', '剪辑导出不可用：FFmpeg 没起来', {
         detail:  '因为 …<br>可以这样修 …',      // 「怎么处理」里给真人看的话
         retry:   function(){ return Promise },  // 可选：点「重新检测」跑一次，resolve(true) 自动撤掉告警
         retryText:'重新检测'
       })
       sysAlert.clear('ffmpeg')   // 只撤自己那条，别的故障不受影响
     为什么不用 say()：普通提示 2 秒就没了，用户看不到，等真点导出才失败。
     这类故障关系到「软件能不能干活」，必须一直挂在眼皮底下，不修好不走。
     点 × 只是收成一颗红点（问题仍在），不会真消失。 */
  window.sysAlert=(function(){
    var el=document.getElementById('sysAlert'),tx=document.getElementById('sysAlertTx'),
        bMore=document.getElementById('sysAlertMore'),bX=document.getElementById('sysAlertX');
    if(!el)return {set:function(){},clear:function(){},has:function(){return false}};
    var issues={},order=[],mini=false,busy=false;

    function head(){
      for(var i=0;i<order.length;i++){ if(issues[order[i]])return issues[order[i]] }
      return null;
    }
    function render(){
      var it=head();
      if(!it){
        el.hidden=true;el.classList.remove('mini');
        document.body.classList.remove('has-sysalert');mini=false;
        dragGuardSoon();return;
      }
      el.hidden=false;
      if(tx)tx.textContent=it.text||'';
      el.classList.toggle('mini',mini);
      document.body.classList.add('has-sysalert');
      if(bMore)bMore.textContent=it.retry?(it.retryText||'重新检测'):'怎么处理';
      dragGuardSoon();
    }
    /* ── 拖拽条避让 ──
       原生壳在窗口顶部铺了一条透明拖拽条接管窗口拖动。告警条恰好长在它正中间，
       于是点「重新检测」「×」全被拖拽条吃掉，按钮永远没反应。
       把告警条的实际矩形报给原生，拖拽条绕开这块区域。 */
    function syncDragGuard(){
      try{
        var mh=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.dragGuard;
        if(!mh)return;
        /* ★ 2026-11-18：原来只报「系统告警条」一块 rect，
           页眉里其它可点的东西（品牌字标、AI 导演、Beta、清空对话、通知铃、客户名）
           全都落在原生那条透明拖拽条底下 —— 点不动。
           现在把页眉里所有可交互元素的矩形一起报上去，原生逐块放行。
           只要页眉在顶部 52px 内，就都归它管。 */
        var rects=[];
        try{
          var tb=document.querySelector('.titlebar');
          if(tb){
            var tbR=tb.getBoundingClientRect();
            /* ★ 报页眉里所有可见子元素，不只是 button。
               「RiffCut 影创」字标是个 img、「当前客户：未选择」是个 span，
               它们不是按钮，但双击字标会缩放窗口、点客户名没反应 ——
               所以这里按元素逐个报，原生那块放行。
               去掉子元素后只留叶子节点，免得同一个区域报一堆重叠矩形。 */
            var els=tb.querySelectorAll('button,a,input,select,textarea,img,span,i,div');
            for(var i=0;i<els.length;i++){
              var e=els[i];
              if(!e||!e.getBoundingClientRect)continue;
              var r=e.getBoundingClientRect();
              if(!r.width||!r.height)continue;
              /* 只要它跟页眉有交叠（页眉元素可能溢出页眉一点）就报 */
              if(r.bottom<=tbR.top||r.top>=tbR.bottom)continue;
              /* 叶子节点才报：里面还有子元素的（div.lights / div.tb-brand）
                 会跟子元素重复，矩形叠着没意义。
                 例外：button 一定要报 —— 通知铃是个 button，里面套着 svg，
                 按叶子规则会被滤掉，铃铛就点不到了。 */
              var isBtn=(e.tagName==='BUTTON');
              var hasChild=false;
              for(var c=0;c<e.children.length;c++){
                var cr=e.children[c].getBoundingClientRect();
                if(cr.width&&cr.height){hasChild=true;break}
              }
              if(hasChild&&!isBtn)continue;
              rects.push({x:r.left,y:r.top,w:r.width,h:r.height});
            }
            /* 告警条是 div 不是按钮，单独报 */
            if(el&&!el.hidden){
              var ar=el.getBoundingClientRect();
              if(ar.width&&ar.height)rects.push({x:ar.left,y:ar.top,w:ar.width,h:ar.height});
            }
          }
        }catch(e2){}
        mh.postMessage({rects:rects});
      }catch(e){}
    }
    function dragGuardSoon(){
      if(window.requestAnimationFrame)requestAnimationFrame(syncDragGuard);
      else setTimeout(syncDragGuard,16);
    }
    window.addEventListener('resize',dragGuardSoon);
    /* ★ 页面刚打开时也要报一次。
       以前只在「告警条状态变了」和「窗口 resize」时报 —— 首次打开时原生那边
       一个避让区都没有，页眉里的按钮全被透明拖拽条盖住。
       另外页眉内容会变（客户名写上、通知铃出现），过一会儿再补报一次。 */
    dragGuardSoon();
    setTimeout(dragGuardSoon,400);
    setTimeout(dragGuardSoon,1500);
    if(window.MutationObserver){
      try{
        var tb=document.querySelector('.titlebar');
        if(tb)new MutationObserver(function(){dragGuardSoon()})
                 .observe(tb,{childList:true,subtree:true,attributes:true,attributeFilter:['class','hidden','style']});
      }catch(e){}
    }
    function detailHtml(it){
      var h='<div style="line-height:1.75">'+(it.detail||it.text||'')+'</div>';
      h+='<div style="margin-top:12px;padding:10px 12px;border-radius:8px;background:#FFF6F5;'
        +'border:1px solid #F3CCC8;color:#A3251B;font-size:12px">'
        +'这条提示会一直挂在页眉中间，直到问题解决。'
        +'<br>需要人工处理时，可以先把这条收成红点（不挡视线，但仍然在）。</div>';
      return h;
    }
    /* 一键修：点「重新检测」直接跑，不再先弹一个「确定吗」的框多一次点击。
       跑的时候按钮变成「检测中…」防连点；修好了就撤告警并提示一句。 */
    function runRetry(it){
      if(!it||!it.retry){openDetail();return}
      if(busy)return;busy=true;
      var label=it.retryText||'重新检测';
      if(bMore){bMore.textContent='检测中…';bMore.disabled=true}
      Promise.resolve().then(it.retry).then(function(okNow){
        busy=false;
        if(bMore){bMore.disabled=false;bMore.textContent=label}
        if(okNow){window.sysAlert.clear(it.key);if(window.say)say('已修好，可以正常使用了')}
        else if(window.say)say('还是不行，点告警条看具体原因');
      }).catch(function(e){
        busy=false;
        if(bMore){bMore.disabled=false;bMore.textContent=label}
        if(window.say)say((e&&e.message)||'检测失败');
      });
    }
    function openDetail(){
      var it=head(); if(!it)return;
      if(typeof window.confirmAction!=='function'){
        // 极端情况（脚本没就绪）：退回最朴素的方式，别把用户挡在门外
        if(window.say)window.say(it.text);
        return;
      }
      var btnText=it.retry?(it.retryText||'重新检测'):'知道了';
      window.confirmAction({
        title:it.title||'需要处理的问题',
        html:detailHtml(it),
        okText:btnText,
        onOk:function(){
          if(!it.retry){ window.sysAlert.clear(it.key); return }
          runRetry(it);
        },
      });
    }

    if(bMore)bMore.addEventListener('click',function(e){
      e.stopPropagation();
      var it=head();if(!it)return;
      if(it.retry)runRetry(it); else openDetail();
    });
    if(bX)bX.addEventListener('click',function(e){
      e.stopPropagation();
      if(busy)return;
      /* × 只是收成页眉上的一颗红点：问题没解决就不能让它彻底消失，
         用户想再管的时候点那颗红点就展开回来了。 */
      mini=true;render();
    });
    el.addEventListener('click',function(){
      if(el.classList.contains('mini')){mini=false;render();return}
      openDetail();
    });

    return {
      set:function(key,text,opt){
        opt=opt||{};
        key=key||'sys';
        var isNew=!issues[key];          // 必须是「新问题」才自动展开
        if(isNew)order.push(key);
        issues[key]={key:key,text:text,detail:opt.detail||'',title:opt.title||'',
                     retry:opt.retry||null,retryText:opt.retryText||''};
        /* 新冒出来的问题自动展开，别让它悄悄躺在红点里；
           但后台每几秒会复查同一件事再 set 一次，这时候不能把用户刚收起的
           红点又弹开 —— 那样点 × 等于没点（实测就是这个毛病）。 */
        if(isNew)mini=false;
        render();
        return key;
      },
      clear:function(key){
        if(key){ if(issues[key]){delete issues[key];order=order.filter(function(k){return k!==key})} }
        else { issues={};order=[] }
        render();
      },
      has:function(key){ return key?!!issues[key]:!!head() },
      open:openDetail
    };
  })();

  /* ── 后台任务进度条（右下角）──
     为什么要有：读文件夹 / 建索引可能几十秒。以前的做法是把页面上的按钮 disabled 掉，
     用户看到一屏灰按钮，还以为软件死了。现在改成：活都在后台跑，这里只报进度，
     页面上任何按钮照旧可点，切客户、切页面、搜素材都不受影响。 */
  window.taskUI=(function(){
    var box=document.getElementById('gTask'),ttl=document.getElementById('gTaskT'),
        sub=document.getElementById('gTaskS'),tmEl=document.getElementById('gTaskTime'),
        t0=0,tick=null,n=0;
    return {
      start:function(title,stage){
        n++;t0=Date.now();
        if(ttl)ttl.textContent=title||'后台处理中…';
        if(sub)sub.textContent=stage||'正在处理…';
        if(tmEl)tmEl.textContent='0.0s';
        if(box)box.classList.add('on');
        if(!tick)tick=setInterval(function(){
          if(tmEl)tmEl.textContent=((Date.now()-t0)/1000).toFixed(1)+'s';
        },200);
      },
      title:function(s){if(s&&ttl)ttl.textContent=s},
      stage:function(s){if(s&&sub&&sub.textContent!==s)sub.textContent=s},
      done:function(){
        n=Math.max(0,n-1);if(n>0)return;
        if(tick){clearInterval(tick);tick=null}
        if(box)box.classList.remove('on');
        if(tmEl)tmEl.textContent='0.0s';
      },
      busy:function(){return n>0}
    };
  })();

  /* ── 重要通知：只有后台长任务（出片 / 素材分析等）完成或失败才进来 ──
     顶部通知按钮左边只显示最后一条，铃铛点开能看历史；点选项、保存设置等不打扰 */
  var NOTICES=[];
  try{NOTICES=JSON.parse(localStorage.getItem('riffcut.notices')||'[]')}catch(e){NOTICES=[]}
  function saveNotices(){try{localStorage.setItem('riffcut.notices',JSON.stringify(NOTICES.slice(0,30)))}catch(e){}}
  function nEsc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
  function renderNotices(){
    var pill=document.getElementById('tbNotice'),list=document.getElementById('noticeList'),
        bell=document.getElementById('tbBell'),last=NOTICES[0];
    if(pill){
      pill.classList.toggle('on',!!last);
      pill.classList.toggle('bad',!!(last&&last.bad));
      pill.querySelector('.tx').textContent=last?last.msg:'';
      pill.title=last?last.msg:'';
    }
    if(bell)bell.classList.toggle('unread',NOTICES.length>0&&!bell.dataset.seen);
    if(list)list.innerHTML=NOTICES.length?NOTICES.map(function(n){
      return '<div class="notice-row'+(n.bad?' bad':'')+'"><i></i><span>'+nEsc(n.msg)+
             '</span><span class="t">'+nEsc(n.t)+'</span></div>';
    }).join(''):'<div class="notice-empty">还没有重要通知。<br>出片、素材分析等后台任务完成后会出现在这里。</div>';
  }
  window.notice=function(msg,ok){
    NOTICES.unshift({msg:String(msg||''),bad:ok===false,
                     t:new Date().toTimeString().slice(0,5)});
    NOTICES=NOTICES.slice(0,30);saveNotices();
    var bell=document.getElementById('tbBell');if(bell)bell.dataset.seen='';
    renderNotices();
  };
  var bellBtn=document.getElementById('tbBell'),pop=document.getElementById('noticePop');
  if(bellBtn)bellBtn.addEventListener('click',function(e){
    e.stopPropagation();
    if(pop)pop.classList.toggle('on');
    bellBtn.dataset.seen='1';renderNotices();
  });
  document.addEventListener('click',function(e){
    if(pop&&pop.classList.contains('on')&&!pop.contains(e.target)&&e.target!==bellBtn)
      pop.classList.remove('on');
  });
  var nc=document.getElementById('noticeClear');
  if(nc)nc.addEventListener('click',function(e){
    e.stopPropagation();NOTICES=[];saveNotices();renderNotices();
  });
  renderNotices();

  /* 侧栏折叠：收起后只留图标，选择记在本机 */
  var sideBtn=document.getElementById('sideToggle');
  function applySide(c){
    document.body.classList.toggle('side-collapsed',c);
    if(sideBtn){var t=c?'展开侧栏':'收起侧栏';sideBtn.title=t;sideBtn.setAttribute('aria-label',t);sideBtn.setAttribute('data-tip',t)}
  }
  try{applySide(localStorage.getItem('riffcut.side.collapsed')==='1')}catch(e){}

  /* 剪辑页的「自动收起侧栏 + 左边缘悬浮」已去掉。
     原因：主栏现在只有 4 项 + 一个「更多」，本来就窄，自动折叠省不出多少空间，
     反而每次进剪辑页侧栏就消失、鼠标离不开左边缘就一直展开，很折腾。
     需要窄屏时用户自己点顶部那个折叠按钮（.side-toggle）就够了。 */
  if(sideBtn)sideBtn.addEventListener('click',function(){
    var c=!document.body.classList.contains('side-collapsed');
    applySide(c);
    try{localStorage.setItem('riffcut.side.collapsed',c?'1':'0')}catch(e){}
    window.say(c?'侧栏已收起，点箭头可展开':'侧栏已展开');
  });

  /* ══ 本机服务 API（真实功能都走这里） ══ */
  window.RiffCut={settings:{},models:[],chat_models:[],library:{items:[]},tasks:[],projects:[],
                 skills:[],voices:[],customers:[],customer:'影创',currentModelId:'',plan:null};
  var __apiReal=function(path,data,extra){
    /* extra.signal 传 AbortController.signal：点「停止方块」时前端立刻断线，不再干等 */
    extra=extra||{};
    var h=data===undefined?{}:{'Content-Type':'application/json'};
    /* 本机请求凭据：服务在首页 <head> 注入，window.api 统一带上，
       挡住本机其它进程/网页直接调 /api/*。关掉 require_token 后服务端不再校验。 */
    if(window.__RiffCut_TOKEN__)h['X-RiffCut-Token']=window.__RiffCut_TOKEN__;
    var o={method:data===undefined?'GET':'POST',headers:h};
    if(data!==undefined)o.body=JSON.stringify(data);
    if(extra.signal)o.signal=extra.signal;
    /* 服务本身连不上 / 报 5xx：这不是「这次操作没成功」，是软件现在干不了活。
       以前这种错只在页面底部闪一行字，用户以为点一下重试就好。现在一律挂页眉正中，
       带红色呼吸脉冲、带「马上重连」，修好自己撤掉。 */
    function serverDown(e){
      if(window.showServiceDown)window.showServiceDown(e);
    }
    return fetch(path,o).catch(function(e){
      if(e&&e.name==='AbortError')throw e;          /* 用户自己点了停止，不算故障 */
      serverDown(e);throw e;
    }).then(function(r){
      if(r.status>=500){var e2=new Error('本机服务出错（HTTP '+r.status+'）');serverDown(e2);throw e2}
      /* 请求能拿到响应就说明服务活着 —— 把「本机服务没连上」那条红条撤掉。
         以前只有 bootOnce 成功时才 clear，而 bootOnce 只在失败重试链里跑：
         一次偶发 500（比如模板要现场下东西超时）挂上红条，之后所有请求都正常，
         红条却一直留在页眉上，用户以为软件坏了不敢用。 */
      if(window.sysAlert)window.sysAlert.clear('service');
      return r.json();
    }).then(function(j){
      if(!j.ok){
        var e=new Error(j.error||'这一步没跑成');
        /* 接口报的错如果指向 ffmpeg，说明不是这一次操作的问题，是整条剪辑链路坏了：
           顺手复查一次，页眉告警自己就挂上去，用户不用等下一次点导出再撞一次。 */
         if(window.checkFfmpeg&&/ffmpeg|ffprobe/i.test(e.message)){
           window.checkFfmpeg({ok:false,ffmpeg:e.message,path:''});
         } else {
           window.say(e.message);
         }
         throw e;
      }
      return j.data;
    });
  };
  /* 真身装好，把片段里排队的那批调用放出去（排队壳在 body 的 pages 容器上方） */
  if(window.__apiFlush)window.__apiFlush(__apiReal); else window.api=__apiReal;

  window.pollTask=function(tid,onDone){
    var stopped=false,failures=0,timer=0;
    function schedule(){
      if(!stopped)timer=setTimeout(tick,Math.min(5000,900+failures*300));
    }
    function tick(){
      window.api('/api/tasks',{action:'list'}).then(function(list){
        failures=0;
        window.RiffCut.tasks=list;
        document.dispatchEvent(new CustomEvent('taskchange',{detail:{tasks:list}}));
        var t=null;list.forEach(function(x){if(x.id===tid)t=x});
        if(t&&(t.state==='已完成'||t.state==='失败'||t.state==='已取消')){
          stopped=true;clearTimeout(timer);
          if(t.state==='已完成'){
            window.notice('✓ '+t.name+' 完成',true);
            if(onDone)onDone(t.result,t);
          } else if(t.state==='失败')window.notice('✗ '+t.name+'：'+(t.error||'失败'),false);
          return;
        }
        schedule();
      }).catch(function(){
        /* 网络抖动不丢任务终态；退避重试，长任务也没有九分钟上限。 */
        failures++;schedule();
      });
    }
    tick();
    return function(){stopped=true;clearTimeout(timer)};
  };
  /* 选一次就记住：设置（服务端）是权威，localStorage 只是同一次运行里的快照。
     以前只写 localStorage —— App 用 file:// 载入页面，重启后 localStorage 是空的，
     于是每次都退回 is_default 那个「后来添加的模型」。 */
  window.useChatModel=function(id){
    id=String(id||'');
    (window.RiffCut||{}).currentModelId=id;
    try{localStorage.setItem('riffcut.currentModel',id)}catch(e){}
    return window.api('/api/models',{action:'use',id:id}).then(function(r){
      if(r&&r.ok===false)throw new Error((r&&r.error)||'没能记住这个模型');
      return r;
    });
  };
  /* ── 启动自检 ──────────────────────────
     以前这两个检查都只 say 一句：底部黑条 2 秒没了，用户以为软件正常，
     等真点导出才发现不能用。现在统一挂到页眉正中的红色呼吸告警上，
     并且能自动重连、能点「重新检测」，好了自己撤掉。 */
  var BOOT_TRY=0,READY_FIRED=false;
  function ffmpegProblem(ff){
    ff=ff||{};
    if(ff.ok)return null;
    var why=ff.ffmpeg?('当前拿到的答复：'+String(ff.ffmpeg).slice(0,120)):('程序路径：'+(ff.path||'未找到'));
    return {
      key:'ffmpeg',
      text:'剪辑导出不可用：FFmpeg 没起来',
      title:'FFmpeg 没起来',
      detail:'没有它，出片、转码、抽帧、合成配音这些活全都做不了。<br><br>'+why
        +'<br><br>一般是三种原因：<br>'
        +'① 软件内自带的 ffmpeg 被系统拦下了（换机器、拷贝安装最常见）；<br>'
        +'② 装在了「下载」目录里，被系统的隔离策略挡住；<br>'
        +'③ 文件被杀毒软件删了。<br><br>'
        +'先点下面的「重新检测」。还不行就把 RiffCut 影创 整个应用拖到「应用程序」文件夹再打开一次。'
    };
  }
  /* 启动时先让软件「自己修」，别一上来就吓人：
     4 秒宽限期内不报警，这期间复查一次（会自动重签修复）。修不好才挂页眉告警。
     用户的规矩：能自己修当然更好；报出来之后，点「修复」必须真能修好才算数。 */
  var FF_G={pending:false,settled:false};   // pending=正在等自愈；settled=已经报过，别再等
  window.checkFfmpeg=function(ff,opt){
    opt=opt||{};
    var p=ffmpegProblem(ff);
    if(!p){
      FF_G.pending=false;FF_G.settled=false;
      if(window.sysAlert)window.sysAlert.clear('ffmpeg');
      return true;
    }
    if(!window.sysAlert)return false;
    /* 宽限期内（4 秒）谁再调都只是继续等，不许提前报警 ——
       启动时 shell 和首页会各查一次，第二下就把宽限期绕过去了（实测）。
       只有复查也修不好（opt.now）或者已经报过（settled）才真的挂页眉。 */
    if(!opt.now&&!FF_G.settled){
      if(!FF_G.pending){
        FF_G.pending=true;
        setTimeout(function(){
          window.api('/api/ffmpeg',{heal:1}).then(function(r){
            var d=(r&&r.data)||r||{};
            if(d.ok){ window.checkFfmpeg(d); return }
            window.checkFfmpeg(d,{now:true});   // 自己修不好，这才报
          }).catch(function(){ /* 服务没起来由 showServiceDown 那条管，这里不重复报 */ });
        },4000);
      }
      return false;
    }
    FF_G.pending=false;FF_G.settled=true;
    window.sysAlert.set(p.key,p.text,{
      title:p.title,detail:p.detail,retryText:'重新检测',
      retry:function(){
        return window.api('/api/ffmpeg',{heal:1}).then(function(r){
          var d=(r&&r.data)||r||{};
          var ok=!!d.ok;
          if(ok){ if(window.sysAlert)window.sysAlert.clear('ffmpeg') }
          else { window.checkFfmpeg(d,{now:true}) }
          return ok;
        });
      }
    });
    return false;
  };
  window.showServiceDown=showServiceDown;
  function showServiceDown(e){
    if(!window.sysAlert){ window.say('本机服务没起来，界面为只读预览（请重新打开应用）'); return }
    /* 已经挂在页眉上了就别每 3 秒重设一次：重设会把用户收起的红点又弹开 */
    if(window.sysAlert.has('service'))return;
    window.sysAlert.set('service','本机服务没连上，软件现在只能看不能用',{
      title:'本机服务没连上',
      detail:'界面的每个按钮都要经过本机服务，它没起来就只能看、不能干活。'
        +'<br><br>软件会在后台每 3 秒自动重连一次，连上就自动恢复，不用你管。'
        +'<br><br>超过半分钟还不行，把 RiffCut 影创 退出（⌘Q）再打开一次。'
        +((e&&e.message)?('<br><br><span style="color:#8A92A2">技术细节：'+e.message+'</span>'):''),
      retryText:'马上重连',
      retry:function(){
        return window.api('/api/bootstrap').then(function(){ bootOnce(); return true })
          .catch(function(){ return false });
      }
    });
  }
  function bootOnce(){
    return window.api('/api/bootstrap').then(function(d){
    window.RiffCut=d;
    if(window.sysAlert)window.sysAlert.clear('service');
    window.checkFfmpeg(d.ffmpeg);
    var remembered='';try{remembered=localStorage.getItem('riffcut.currentModel')||''}catch(e){}
    var list=d.chat_models||[];
    /* 优先级：设置里记着的「上次手动选的」> 浏览器里的旧快照 > 默认模型 > is_default > 第一个可用。
       第一档是这次新加的：用户在首页下拉里选过，就一直用它，除非他自己再换。 */
    var want=d.current_model||remembered;
    var hit=list.filter(function(m){return m.id===want})[0]
      || list.filter(function(m){return m.id===d.default_model})[0]
      || list.filter(function(m){return m.is_default})[0]
      || list[0];
    window.RiffCut.currentModelId=(hit||{}).id||'';
    window.RiffCut.defaultModelId=d.default_model||'';
    /* 只在第一次成功时派事件；重连成功只补数据，不重跑各页初始化 */
    if(!READY_FIRED){READY_FIRED=true;
      document.dispatchEvent(new CustomEvent('riffcut-ready',{detail:d}))}
    return true;
    }).catch(function(e){
      showServiceDown(e);
      /* 自动重连：服务是被 App 拉起来的，慢一两秒很正常；
         连上就把告警撤掉，用户什么都不用做。 */
      if(BOOT_TRY<12){BOOT_TRY++;setTimeout(bootOnce,3000)}
      return false;
    });
  }
  bootOnce();

  /* 页面切换：左侧固定项真正切屏 */
  var pages=document.querySelectorAll('.page');

  window.goPage=function(name){
    // 浮层里内嵌着某个页面时，点侧栏就等于「先退出内嵌、再切页」，
    // 否则那个页面被留在浮层里，主区切过去是空的。
    if(document.getElementById('setMask')?.classList.contains('on')){
      document.getElementById('setClose')?.click();
    }
    var ok=false;
    pages.forEach(function(p){var on=p.dataset.page===name;p.classList.toggle('on',on);if(on)ok=true;});
    // 高亮交给侧栏模块（钉哪几项是可变的，所以不能在这里写死 querySelectorAll('.nav a')）
    var _hit = window.__markNav ? window.__markNav(name) : false;
    // 没钉到侧栏上的模块（配音·语音 / 热点雷达 …）跳过去时侧栏没有对应行，
    // 就把高亮落在「更多」上，否则侧栏会出现「哪一项都没亮」的空白态。
    var _set = document.getElementById('sideSet');
    if(_set)_set.classList.toggle('on',!_hit);
    var _sub = document.getElementById('sideSetSub');
    if(_sub)_sub.textContent = (!_hit && window.__SET_NAME && window.__SET_NAME[name]) || '';
    if(ok){
      var t=(window.__SET_NAME&&window.__SET_NAME[name])||name;
      say('已切到「'+t+'」');
    }
    return ok;
  };

  /* ── 侧栏：固定项 + 「更多」浮层 + 会话列表 ──────────────
     三块共用一套模块表 MODS，避免「浮层里有、侧栏里没有」这种对不上的情况。

     固定项是可自定义的：上方那排不是写死的四项，用户钉了谁就是谁，
     存在 localStorage('riffcut.nav.pinned')，重开还是他自己的排列。
     默认钉 home/edit/assets/publish —— 做一条片真正会走到的顺序。 */
  (function(){
    var MODS={
      home:     {t:'首页',    ic:'i-home',     d:'一句话说需求，AI 直接接着干。做片的主入口，也是所有对话开始的地方。'},
      edit:     {t:'专业剪辑', ic:'i-clap',     d:'轨道式剪辑台：素材、模板、字幕、配音四条轨，装模板和出片都在这里。'},
      assets:   {t:'素材库',   ic:'i-folder',   d:'按客户归类的图片、视频、音频、Logo。剪片时从这里往里拖。'},
      publish:  {t:'发布中心', ic:'i-send',     d:'成片按平台导出、写标题标签、排发布时间。发出去之后的回执也在这里。'},
      voice:    {t:'配音·语音', ic:'i-mic',      d:'选音色、调语速、试听，把文案直接转成配音轨。本地模型离线可用，不用等云端排队。'},
      hotspot:  {t:'热点雷达', ic:'i-chart',    d:'按平台和赛道拉当天话题榜，挑一条就能丢给 AI 写口播。选题不用自己想。'},
      tasks:    {t:'任务中心', ic:'i-task',     d:'渲染、转码、批量处理都在这里排队。合上页面也会继续跑，回来能看到进度和产物。'},
      skill:    {t:'技能中心', ic:'i-cube',     d:'软件的技能清单：每个技能是一段可复用的流程，装了什么就能直接调。'},
      kb:       {t:'知识库',   ic:'i-book',     d:'你自己的规则和经验库。问什么先查这里，查到就照它做，不用每次重讲一遍。'},
      /* 品牌资产以前挂在「客户与素材库」页的页签里，那页改成纯素材库后
         这个页面就没有入口了 —— 12 个 data-page 里有 brand，MODS 里却没有，
         等于整页消失（2026-11-18 逐个点浮层时才发现）。 */
      brand:    {t:'品牌资产', ic:'i-image',      d:'按客户存的 Logo、配色、片头片尾、口号。出片时自动套用，不用每次重设。'},
      models:   {t:'模型管理', ic:'i-sliders',  d:'配置文本、视觉、语音各路模型的地址和密钥。本地模型和云端都能挂。'},
      settings: {t:'系统设置', ic:'i-gear',     d:'账号、存储位置、默认画幅、快捷键、权限这一类软件本身的设置。'},
      /* 插件市场装的是 DSH 生态里别人做的扩展（6100+ 个），和「技能中心」
         那 41 条我们自己写的流程是两回事，所以单独一项。 */
      plugins:  {t:'插件市场', ic:'i-grid',     d:'DSH 生态的扩展插件：装了就有新能力。装完重启软件生效。'},
      /* 「内核能力」是给用户核对用的：工具 / 技能 / 档位一次列全，
         点一下能把工具名复制到对话里。不放进默认钉的 4 项（默认是主路径）。 */
      abilities:{t:'内核能力', ic:'i-cube',     d:'软件到底能干什么：90 个工具、41 条技能、当前档位，一处看全。'},
      /* 把 DSH 内核「本来就有、但用户看不见」的东西翻开：
         任务与子智能体 —— 内核能并行开多个自己。
         原「会话历史」一项已删（2026-11-19）：首页左侧会话列表已覆盖对话回看，
         这项重复且入口靠 nesting 显示不全。页面文件保留，只是不再列表/钉选。 */
      agents:   {t:'任务与智能体', ic:'i-grid', d:'内核能同时开多个子智能体并行干活。这里看它们跑到哪了。'}
    };
    var DEF=['home','edit','assets','publish'];
    var KEY='riffcut.nav.pinned';
    var MAX=6;                       // 主栏最多 6 项：再多侧栏就成竖排长列表了
    var SET_NAME={};
    Object.keys(MODS).forEach(function(k){SET_NAME[k]=MODS[k].t});
    window.__SET_NAME=SET_NAME;

    var navList=document.getElementById('navList');
    var op=document.getElementById('sideSet');
    var mask=document.getElementById('setMask'),list=document.getElementById('setList'),
        body=document.getElementById('setBody'),bt=document.getElementById('setTitle'),
        bd=document.getElementById('setDesc'),cl=document.getElementById('setClose');
    var embBar=document.getElementById('setEmbBar'),embName=document.getElementById('setEmbName'),
        stage=document.getElementById('setStage'),back=document.getElementById('setBack');
    if(!navList||!op||!mask)return;

    /* ── 钉了哪些：读写 localStorage ──
       只存 key 数组；不认识的 key 直接丢掉（模块改名/删掉后老配置不会留一堆幽灵项）。 */
    var pinned=DEF.slice();
    /* 钉的项存服务端（/api/ui），不再存 localStorage：
       端口每次启动都变，localStorage 按 origin 隔离，换端口 = 换存储空间，
       用户钉好的导航一重启就回到默认 —— 这是实测报过的 bug。
       本地 localStorage 只当「这一进程内的缓存」，下次启动仍以服务端为准。 */
    function normalizePinned(raw){
      if(!Array.isArray(raw))return DEF.slice();
      raw=raw.filter(function(k){return MODS[k]});
      return (raw.length?raw:DEF.slice()).slice(0,MAX);
    }
    function loadPinned(){
      try{
        var cached=JSON.parse(localStorage.getItem(KEY)||'null');
        if(Array.isArray(cached))pinned=normalizePinned(cached);
      }catch(e){}
      try{
        api('/api/ui',{action:'get'}).then(function(d){
          var v=d&&d.pinned;
          if(Array.isArray(v)){
            pinned=normalizePinned(v);
            try{localStorage.setItem(KEY,JSON.stringify(pinned))}catch(e){}
            paintNav();
          }
        }).catch(function(){});
      }catch(e){}
    }
    function savePinned(){
      try{localStorage.setItem(KEY,JSON.stringify(pinned))}catch(e){}
      try{api('/api/ui',{action:'set',patch:{pinned:pinned}}).catch(function(){})}catch(e){}
    }

    /* ── 画上方固定项 ──
       用 <a> 保持和原来一样的结构与样式（.nav a.on 那套高亮完全复用），
       不新造类名 —— 否则折叠态、ed-zone 那几条 body 级规则都要跟着再写一遍。 */
    function paintNav(){
      navList.innerHTML='';
      pinned.forEach(function(k){
        var m=MODS[k];
        var a=document.createElement('a');
        a.href='#'; a.dataset.page=k;
        a.innerHTML='<svg class="ic"><use href="#'+m.ic+'"/></svg>'+m.t;
        a.addEventListener('click',function(e){e.preventDefault();window.goPage(k)});
        navList.appendChild(a);
      });
      var cur=document.querySelector('.pages > .page.on');
      if(cur)markNav(cur.dataset.page);
    }
    function markNav(name){
      var hl=(name==='brand')?'assets':name;
      var hit=false;
      navList.querySelectorAll('a').forEach(function(a){
        var on=a.dataset.page===hl; a.classList.toggle('on',on); if(on)hit=true;
      });
      return hit;
    }

    /* 浮层里不列的页面：首页和专业剪辑。
       这两页在浮层窄框里渲染不全（剪辑台尤其会挤成乱码/竖排），
       它们本来就默认钉在侧栏、也有各自完整页面，不需要在浮层里再开一遍。
       只从「更多」列表隐藏，MODS / 侧栏 / goPage 全部照旧，入口不受影响。
       以后还有别的页面在浮层里显示不全，往这个表加 key 即可。 */
    var MORE_HIDE={home:1,edit:1};

    /* ── 浮层左列：全部模块（减去 MORE_HIDE） + 图钉 ──
       一行两个点击目标：名称区在浮层里直接打开该页面，图钉区只切换钉不钉。
       不用整行 <button>（嵌套按钮非法），所以用 div 包两个 button。 */
    function paintList(){
      list.innerHTML='';
      Object.keys(MODS).forEach(function(k){
        if(MORE_HIDE[k])return;                 /* 浮层不列这两页，侧栏照常进 */
        var m=MODS[k], on=pinned.indexOf(k)>=0;
        var row=document.createElement('div');
        row.className='set-item'+(on?' on':'');
        row.dataset.k=k;
        var full=(!on&&pinned.length>=MAX);
        row.innerHTML=
          '<button class="set-go" type="button">'+
            '<svg class="ic"><use href="#'+m.ic+'"/></svg><span>'+m.t+'</span></button>'+
          '<button class="set-pin'+(on?' on':'')+(full?' full':'')+'" type="button" '+
            'title="'+(full?'上面最多钉 '+MAX+' 项，先取消一个再钉':'钉到侧栏上面')+'">'+
            '<svg viewBox="0 0 24 24" fill="none">'+
              '<path d="M9.5 3.5h5l-.6 5.2 3.1 3.1H6.9l3.1-3.1z" '+
                'stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>'+
              '<path d="M12 11.8V20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>'+
            '</svg></button>';
        list.appendChild(row);
      });
    }

    function showInfo(k){
      var m=MODS[k]||{t:k,d:''};
      bt.textContent=m.t; bd.textContent=m.d;
      list.querySelectorAll('.set-item').forEach(function(r){
        r.classList.toggle('cur',r.dataset.k===k)});
    }

    /* ── 内嵌：把那个页面真的挂进来 ──
       为什么不复制 HTML：每个页面里都绑着自己的 JS 状态（选中素材、播放进度、
       表单草稿、已加载的轨道数据）。复制一份等于两套状态并存，改一边另一边不动。
       所以直接把 .page 节点搬过来，关浮层时原样搬回去 —— 它从头到尾只有一个实例。

       搬的时机也要注意：先搬进可见容器再让它 on，否则页面里那些靠 getBoundingClientRect
       算的尺寸（画布、时间轴像素宽）会拿到 0，进去就是空白。 */
    var embKey='', embNode=null, embHome=null, embNext=null;
    function embed(k){
      var pg=document.querySelector('.pages > .page[data-page="'+k+'"]');
      if(!pg)return false;
      if(embNode)unembed(true);
      embKey=k; embNode=pg;
      embHome=pg.parentNode; embNext=pg.nextSibling;
      body.classList.add('is-embed');
      stage.classList.add('on');
      stage.appendChild(pg);          // 先入场
      embBar.classList.add('on');
      embName.textContent=(MODS[k]&&MODS[k].t)||k;
      // 入场后再点亮，页面里的尺寸计算才有真实宽高
      requestAnimationFrame(function(){
        pg.classList.add('on');
        document.dispatchEvent(new CustomEvent('riffcut-embed-open',{detail:{page:k}}));
      });
      return true;
    }
    function unembed(silent){
      if(!embNode)return;
      var pg=embNode, k=embKey;
      pg.classList.remove('on');
      // 搬回原位（用 nextSibling 保住原来的 DOM 顺序，某些页面靠顺序取同级）
      if(embHome)embHome.insertBefore(pg,embNext||null);
      embNode=null; embKey=''; embHome=null; embNext=null;
      stage.classList.remove('on');
      embBar.classList.remove('on');
      body.classList.remove('is-embed');
      if(!silent)document.dispatchEvent(new CustomEvent('riffcut-embed-close',{detail:{page:k}}));
    }

    function openMask(){
      paintList();
      var cur=document.querySelector('.pages > .page.on');
      var k=cur&&MODS[cur.dataset.page]?cur.dataset.page:'';
      /* 当前页若是浮层隐藏的那两页（或没当前页），默认落到列表第一项，
         别让说明区显示一个列表里根本没有的条目。 */
      if(!k||MORE_HIDE[k]){
        var first=list.querySelector('.set-item');
        k=first?first.dataset.k:'';
      }
      if(k)showInfo(k);
      mask.classList.add('on');
    }
    function closeMask(){
      unembed();
      mask.classList.remove('on');
    }

    op.addEventListener('click',function(e){e.preventDefault();openMask()});

    list.addEventListener('click',function(e){
      // 图钉：只切换钉不钉，不动右边
      var pin=e.target.closest('.set-pin');
      if(pin){
        var row=pin.closest('.set-item'), k=row.dataset.k;
        var i=pinned.indexOf(k);
        if(i>=0){
          pinned.splice(i,1);
          if(!pinned.length)pinned=[k];     // 至少留一项，否则侧栏头上空一排像坏了
        }else{
          if(pinned.length>=MAX){say('侧栏最多钉 '+MAX+' 项，先取消一个');return}
          pinned.push(k);
        }
        savePinned(); paintNav(); paintList(); showInfo(k);
        say(pinned.indexOf(k)>=0?('已把「'+MODS[k].t+'」钉到侧栏'):('已从侧栏移除「'+MODS[k].t+'」'));
        return;
      }
      // 名称：在浮层里直接打开这一页，不跳转、不离开浮层
      var go=e.target.closest('.set-go');
      if(!go)return;
      var k2=go.closest('.set-item').dataset.k;
      showInfo(k2);
      embed(k2);
    });
    list.addEventListener('mouseover',function(e){
      var row=e.target.closest('.set-item'); if(!row)return;
      if(!embNode&&row.dataset.k)showInfo(row.dataset.k);   // 内嵌时不要被 hover 冲掉说明区
    });

    back.addEventListener('click',function(){unembed()});
    cl.addEventListener('click',closeMask);
    mask.addEventListener('click',function(e){if(e.target===mask)closeMask()});
    document.addEventListener('keydown',function(e){
      if(e.key!=='Escape'||!mask.classList.contains('on'))return;
      // Esc 先退内嵌，再按一次才关浮层 —— 否则一按就把整个浮层带走了
      if(embNode)unembed(); else closeMask();
    });
    window.__openSettings=openMask;

    /* ── 会话列表（照 DSH：常驻、可滚动、标题是主角）──
       数据来自 /api/conversations?action=list，后端已按客户分组。
       侧栏窄，不显示分组标题；切客户在顶栏那条，不在这里。 */
    var scList=document.getElementById('scList');
    var scSearch=document.getElementById('scSearch');
    var scInput=document.getElementById('scSearchInput');
    var scSearchBtn=document.getElementById('scSearchBtn');
    var scFilterBtn=document.getElementById('scFilterBtn');
    var scNewBtn=document.getElementById('scNewBtn');
    var scArchBtn=document.getElementById('scArchBtn');
    var archView=false;      // true=看归档，false=看正常列表
    var CONV_ALL=[], CUR_CID='', onlyFilled=false;
    /* ── 会话列表的三档设置（照 DSH）──
       group: ws=按工作区分组 / flat=单列表
       sort : manual=手动排序（置顶优先、其余保持后端顺序）/ updated=最近更新
       view : hide=隐藏已归档 / all=全部 / only=仅已归档
       这三档存在服务端（/api/ui 的 conv_pref），跟 pinned 一样 —— 端口一变
       localStorage 就换库，存在本地的设置一重启就回默认。 */
    var CPREF={group:'ws',sort:'updated',view:'hide'};
    var COLLAPSED={};    /* 哪些工作区被折叠了，存服务端 */

    function fmtWhen(ts){
      if(!ts)return '';
      var d=new Date(String(ts).replace(' ','T'));
      if(isNaN(d))return '';
      var now=new Date(), diff=(now-d)/1000;
      if(diff<60)return '刚刚';
      if(diff<3600)return Math.floor(diff/60)+' 分钟前';
      if(d.toDateString()===now.toDateString())
        return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      if(diff<86400*2)return '昨天';
      if(diff<86400*7)return Math.floor(diff/86400)+' 天前';
      return (d.getMonth()+1)+'/'+d.getDate();
    }
    /* 把会话按「工作区」分组。工作区就是客户 —— 后端 conversation_groups 本来就是
       按客户分的，这里沿用同一口径，不另造一层概念。
       为什么要在侧栏做分组：DSH 的侧栏是「工作区 → 会话」两层，我们之前抄了外观
       却没抄这层结构，会话平铺一长串，用户找三天前那条只能靠搜。 */
    function groupOf(c){
      var n=c.workspace||c.customer||'默认';
      return String(n||'默认');
    }
    function sortIn(a,b){
      /* 置顶优先，两种排序都成立 —— 只按时间排会把刚钉的那条被新消息挤到下面，
         用户看着就像「置顶没生效」。 */
      if(!!b.pinned_at!==!!a.pinned_at) return b.pinned_at?1:-1;
      if(CPREF.sort==='updated')
        return String(b.updated||'').localeCompare(String(a.updated||''));
      /* 手动排序：其余保持后端给的顺序（后端已按置顶+更新时间排） */
      return 0;
    }
    function paintConv(){
      if(!scList)return;
      var q=(scInput&&scInput.value||'').trim().toLowerCase();
      var arr=CONV_ALL.filter(function(c){
        if(onlyFilled && !(c.msg_count>0))return false;
        if(q && String(c.title||'').toLowerCase().indexOf(q)<0)return false;
        return true;
      }).slice().sort(sortIn);
      scList.innerHTML='';
      if(arr.length && CPREF.group==='ws'){
        var order=[], bucket={};
        arr.forEach(function(c){
          var g=groupOf(c);
          if(!bucket[g]){bucket[g]=[];order.push(g)}
          bucket[g].push(c);
        });
        order.forEach(function(g){
          var wrap=document.createElement('div');
          var shut=!!COLLAPSED[g];
          wrap.className='sc-grp'+(shut?' closed':'');
          /* 分组标题用文件夹图标而不是三角箭头 —— 这里装的是「工作区」，
             文件夹是它的实体形状；展开/收起靠图标本身的开合区分，不再另加箭头。 */
          wrap.innerHTML='<button class="sc-gt'+(shut?' closed':'')+'" data-g="'+esc(g)+'">'+
            '<svg class="ws" viewBox="0 0 24 24" fill="none">'+
              '<path d="M3.6 7.4A1.6 1.6 0 0 1 5.2 5.8h3.4l1.7 2h8.5a1.6 1.6 0 0 1 1.6 1.6v7.8a1.6 1.6 0 0 1-1.6 1.6H5.2a1.6 1.6 0 0 1-1.6-1.6z" '+
                'stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>'+
              (shut?'':'<path class="op" d="M3.6 11h16.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>')+
            '</svg>'+
            '<span class="nm2">'+esc(g)+'</span><span class="n2">'+bucket[g].length+'</span></button>'+
            '<div class="bd"></div>';
          var bd=wrap.querySelector('.bd');
          bucket[g].forEach(function(c){bd.appendChild(convItem(c))});
          scList.appendChild(wrap);
        });
        return;
      }
      if(!arr.length){
        // 空态必须说清「为什么空」和「怎么办」：库里本来就没几条，空列表很像加载失败
        var e=document.createElement('div');
        e.className=(CONV_ALL.length?'sc-none':'sc-empty');
        e.innerHTML=CONV_ALL.length
          ? '没有匹配的会话'
          : '<b>还没有会话</b>在首页输入框里说一句，这里就会多一条。';
        scList.appendChild(e);
        return;
      }
      arr.forEach(function(c){ scList.appendChild(convItem(c)); });
    }
    /* 单条会话：分组里和无分组列表里用的是同一个函数，
       否则两处各写一遍，改一次样式要改两处（以前就是这么漏的）。 */
    function convItem(c){
        var b=document.createElement('button');
        b.className='sc-item'+(c.id===CUR_CID?' on':'')+(archView?' arch':'')+(c.pinned_at?' tp':'');
        b.dataset.cid=c.id;
        /* 时间放标题右边同一行（原来另起一行，两行字占掉侧栏太多高度）。
           删除/置顶/导出收进标题后的「⋯」，不再挤在行内。 */
        b.innerHTML='<span class="row">'+
            '<b>'+esc(c.title||'未命名对话')+'</b>'+
            '<span class="when">'+fmtWhen(c.updated)+'</span>'+
            /* 图钉放标题后面、紧挨时间左侧；斜插的实心钉，灰色 ——
               线框竖钉在 12px 以下会被看成一个小圆点，认不出是图钉。 */
            (c.pinned_at?'<svg class="pin" viewBox="0 0 24 24" aria-label="已置顶">'+
              '<path d="M15.1 2.9a1 1 0 0 1 1.4 0l4.6 4.6a1 1 0 0 1-1.2 1.6l-3.2 3.2-2.1 4.3a1 1 0 0 1-1.5.3L10 15.4l-4.3 4.3a1 1 0 0 1-1.4-1.4L8.6 14l-2.7-2.7a1 1 0 0 1 .3-1.5l4.3-2.1 3.2-3.2a1 1 0 0 1 1.4-1.6z" '+
                'fill="currentColor"/></svg>':'')+
            '<button class="more" title="更多操作"><svg viewBox="0 0 24 24" fill="none">'+
              '<circle cx="5" cy="12" r="1.6" fill="currentColor"/>'+
              '<circle cx="12" cy="12" r="1.6" fill="currentColor"/>'+
              '<circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></button>'+
          '</span>';
        return b;
    }
    function esc(s){return String(s).replace(/[&<>"]/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

    /* 后端 list 有两种返回形态，必须都认：
       - 新后端（lib/convo.js）直接给扁平数组 [{id,title,customer,msg_count,...}]
       - 旧后端给 {groups:[{convs:[...]}]}（按客户分组）
       以前只读 d.groups，扁平数组时 CONV_ALL 永远为空 —— 侧栏一直显示「还没有会话」，
       其实库里几十条。这里统一收拢成扁平数组，分组交给前端 groupOf() 做。 */
    function pickConvs(d){
      if(!d)return [];
      if(Array.isArray(d))return d;
      if(Array.isArray(d.items))return d.items;
      if(Array.isArray(d.groups)){
        var out=[];
        d.groups.forEach(function(g){(g.convs||[]).forEach(function(c){out.push(c)})});
        return out;
      }
      return [];
    }
    function loadConv(){
      if(!window.api||!scList)return;
      api('/api/conversations',archView?{action:'list',archived:1}:{action:'list'}).then(function(d){
        CONV_ALL=pickConvs(d);
        CONV_ALL.sort(function(a,b){
          return String(b.updated||'').localeCompare(String(a.updated||''))});
        paintConv();
      }).catch(function(e){
        if(scList)scList.innerHTML='<div class="sc-none">会话读取失败</div>';
      });
    }

    /* 「全部」视图：正常 + 归档两份都要，合流后统一按 CPREF 排序分组。 */
    function loadConvAll(){
      if(!window.api||!scList)return;
      var one=function(p){return window.api('/api/conversations',p).catch(function(){return null})};
      Promise.all([one({action:'list'}),
                   one({action:'list',archived:1})]).then(function(rs){
        CONV_ALL=[];
        rs.forEach(function(d){ pickConvs(d).forEach(function(c){CONV_ALL.push(c)}) });
        CONV_ALL.sort(function(a,b){return String(b.updated||'').localeCompare(String(a.updated||''))});
        paintConv();
      });
    }

    if(scList){
      scList.addEventListener('click',function(e){
        var moreBtn=e.target.closest('.more');
        var item0=e.target.closest('.sc-item');
        if(moreBtn&&item0){
          e.stopPropagation();
          openConvMenu(item0,moreBtn);
          return;
        }
        var del=e.target.closest('.del');
        var exp=e.target.closest('.exp');
        var item=e.target.closest('.sc-item');
        if(!item)return;
        var cid=item.dataset.cid;
        /* 导出：AI 导演页删了以后这一项没地方可放，挂到会话条目上更顺手
           —— 想导出哪条就在哪条上点，不用先切过去再找按钮。 */
        if(exp){
          e.stopPropagation();
          api('/api/conversations',{action:'export',id:cid}).then(function(d){
            say(d&&d.path?('已导出到 '+d.path):'已导出对话记录');
          }).catch(function(){say('导出失败')});
          return;
        }
        if(del){
          e.stopPropagation();
          var t=(CONV_ALL.filter(function(c){return c.id===cid})[0]||{}).title||'这条会话';
          window.__confirmAsk&&window.__confirmAsk('删除「'+t+'」？',function(){
            api('/api/conversations',{action:'delete',id:cid})
              .then(function(){loadConv()}).catch(function(){say('删除失败')});
          },{danger:true,ok:'删除'});
          return;
        }
        if(archView){
          /* 归档视图里单击不切会话：这条不在正常列表里，切过去首页会以为它没了 */
          return;
        }
        CUR_CID=cid; paintConv();
        window.goPage('home');   // 首页是唯一有完整对话框的地方，点会话先回去再载入
        document.dispatchEvent(new CustomEvent('riffcut-open-conv',{detail:{id:cid}}));
      });
    }
    /* ── 会话「⋯」菜单：置顶 / 重命名 / 导出 / 删除 ──
       挂在 body 上而不是条目里 —— 条目本身 overflow:hidden，
       放进去会被裁掉，而且滚动时会跟着跑。 */
    var convMenu=null;
    function closeConvMenu(){
      if(convMenu&&convMenu.parentNode)convMenu.parentNode.removeChild(convMenu);
      convMenu=null;
    }
    function openConvMenu(item,btn){
      closeConvMenu();
      var cid=item.dataset.cid;
      var c=(CONV_ALL.filter(function(x){return x.id===cid})[0]||{});
      var m=document.createElement('div');
      m.className='conv-menu';
      if(archView){
        m.innerHTML=
          '<button data-a="unarch"><svg viewBox="0 0 24 24" fill="none"><path d="M12 19V6m0 0-4.4 4.4M12 6l4.4 4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>恢复到列表</button>'+
          '<button data-a="del" class="danger"><svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M10 7V5h4v2M8 7l.7 12h6.6L16 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>彻底删除</button>';
      }else{
      m.innerHTML=
        '<button data-a="top"><svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5m0 0-5 5m5-5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
          (c.pinned_at?'取消置顶':'置顶')+'</button>'+
        '<button data-a="rename"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4l10-10-4-4L4 16v4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>重命名</button>'+
        '<button data-a="export"><svg viewBox="0 0 24 24" fill="none"><path d="M12 4v10m0 0 3.4-3.4M12 14l-3.4-3.4M5 17.5V19h14v-1.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>导出记录</button>'+
        '<button data-a="archive"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8h16v11H4V8zm1-3h14v3H5V5zm5 6h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>归档</button>'+
        '<button data-a="del" class="danger"><svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M10 7V5h4v2M8 7l.7 12h6.6L16 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>删除</button>';
      }
      document.body.appendChild(m);
      convMenu=m;
      m.classList.add('on');
      btn.classList.add('on');
      var r=btn.getBoundingClientRect(), mw=Math.round(m.getBoundingClientRect().width),
          mh=Math.round(m.getBoundingClientRect().height);
      /* 左边超出就贴左边，下边超出就往上翻 */
      var L=Math.max(8,Math.min(r.right-mw,window.innerWidth-mw-8));
      var T=(r.bottom+mh+10>window.innerHeight)?(r.top-mh-4):(r.bottom+4);
      m.style.left=L+'px'; m.style.top=Math.max(8,T)+'px';

      m.addEventListener('click',function(ev){
        var b2=ev.target.closest('button'); if(!b2)return;
        var a=b2.dataset.a;
        closeConvMenu(); btn.classList.remove('on');
        if(a==='del'){
          var t=c.title||'这条会话';
          /* 这处要带一点排版（红字警告 + 换行），所以走 opt.html 通道，
             但标题 t 是用户可改的数据，必须在这里自己 esc ——
             __confirmAsk 只对纯文本参数做转义，不会动 opt.html。 */
          window.__confirmAsk('', function(){
              api('/api/conversations',{action:'delete',id:cid})
                .then(function(d){
                  var n=(d&&d.files&&d.files.removed)||0;
                  loadConv();
                  say(n?('已删除，连带清掉 '+n+' 个记录文件'):'已删除');
                }).catch(function(){say('删除失败')});
            },{danger:true,ok:'删除',title:'彻底删除',
               html:'删除「'+esc(t)+'」？<br>'
                   +'<span style="color:#B4453C">对话内容和它导出过的记录文件都会一起清掉，删了找不回来。</span><br>'
                   +'只想从列表里收起来、留着以后看 → 用「归档」。'});
          return;
        }
        if(a==='unarch'){
          api('/api/conversations',{action:'unarchive',id:cid})
            .then(function(){loadConv();say('已恢复到会话列表')})
            .catch(function(){say('恢复失败')});
          return;
        }
        if(a==='archive'){
          api('/api/conversations',{action:'archive',id:cid})
            .then(function(){loadConv();say('已归档 —— 内容还在电脑上，在「归档」里能找回来')})
            .catch(function(){say('归档失败')});
          return;
        }
        if(a==='export'){
          api('/api/conversations',{action:'export',id:cid}).then(function(d){
            say(d&&d.path?('已导出到 '+d.path):'已导出对话记录');
          }).catch(function(){say('导出失败')});
          return;
        }
        if(a==='top'){
          api('/api/conversations',{action:'pin',id:cid,pin:!c.pinned_at})
            .then(function(){loadConv()})
            .catch(function(){
              /* 后端还没 pin 动作时先本地顶上，至少当前这次管用 */
              c.pinned_at=c.pinned_at?'':new Date().toISOString().slice(0,19).replace('T',' ');
              CONV_ALL.sort(function(x,y){
                if(!!y.pinned_at!==!!x.pinned_at)return (y.pinned_at?1:0)-(x.pinned_at?1:0);
                return String(y.updated||'').localeCompare(String(x.updated||''))});
              paintConv(); say(c.pinned_at?'已置顶':'已取消置顶');
            });
          return;
        }
        if(a==='rename'){
          var nt=window.prompt('新标题',c.title||'');
          if(nt==null)return;
          nt=String(nt).trim(); if(!nt)return;
          api('/api/conversations',{action:'save',id:cid,title:nt})
            .then(function(){loadConv()}).catch(function(){say('改名失败')});
          return;
        }
      });
      setTimeout(function(){
        document.addEventListener('click',function once(){
          closeConvMenu(); btn.classList.remove('on');
          document.removeEventListener('click',once);
        });
      },0);
    }
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape')closeConvMenu();
    });

    if(scSearchBtn&&scSearch){
      scSearchBtn.addEventListener('click',function(){
        var on=scSearch.hasAttribute('hidden');
        if(on){scSearch.removeAttribute('hidden');scInput&&scInput.focus()}
        else{scSearch.setAttribute('hidden','');if(scInput)scInput.value='';paintConv()}
        scSearchBtn.classList.toggle('on',on);
      });
      scInput&&scInput.addEventListener('input',paintConv);
      scInput&&scInput.addEventListener('keydown',function(e){
        if(e.key==='Escape'){scInput.value='';paintConv()}
      });
    }
    if(scArchBtn){
      scArchBtn.addEventListener('click',function(){
        /* 点归档图标 = 在「隐藏已归档 / 仅显示已归档」之间来回切，
           跟菜单里的「筛选会话」是同一个状态，不另存一份。 */
        CPREF.view=(CPREF.view==='only')?'hide':'only';
        syncViewFromPref(); saveCPref(); applyView();
      });
    }
    /* ── 分组折叠：点标题行开合，状态存服务端 ── */
    if(scList){
      scList.addEventListener('click',function(e){
        var gt=e.target.closest('.sc-gt');
        if(!gt)return;
        e.stopPropagation();
        var g=gt.getAttribute('data-g');
        COLLAPSED[g]=!COLLAPSED[g];
        if(!COLLAPSED[g])delete COLLAPSED[g];
        var wrap=gt.parentNode;
        wrap.classList.toggle('closed',!!COLLAPSED[g]);
        gt.classList.toggle('closed',!!COLLAPSED[g]);
        saveCPref();
      },true);
    }

    /* ── 三段式菜单：分组方式 / 排序方式 / 筛选会话 ──
       照 DSH 那张菜单搬的。为什么要三段而不是三个独立开关：
       分组和筛选会互相影响（比如「仅显示已归档」同时改了分组内容），
       拆成三个按钮用户要在三个地方来回切，放在一张菜单里一眼能看全当前口径。 */
    var cfMenu=null;
    function closeCf(){if(cfMenu){cfMenu.remove();cfMenu=null}
      if(scFilterBtn)scFilterBtn.classList.remove('on')}
    function cfRow(k,label,ic,on){
      return '<button class="cf-it'+(on?' on':'')+'" data-k="'+k+'">'+
        ic+'<span class="lb">'+label+'</span>'+
        '<svg class="ck" viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" '+
          'stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
    }
    var ICO={
      ws:'<svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M3.6 7.4A1.6 1.6 0 0 1 5.2 5.8h3.4l1.7 2h8.5a1.6 1.6 0 0 1 1.6 1.6v7.8a1.6 1.6 0 0 1-1.6 1.6H5.2a1.6 1.6 0 0 1-1.6-1.6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
      tree:'<svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M4 6h4v5h4m-4 0v7h4M14 6h6M14 11h6M14 18h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
      flat:'<svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
      manual:'<svg class="ic" viewBox="0 0 24 24" fill="none"><path d="m8 9 4-4 4 4M8 15l4 4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      clock:'<svg class="ic" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5V12l3 1.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
      hide:'<svg class="ic" viewBox="0 0 24 24" fill="none"><path d="m4 4 16 16M9.5 9.7A3 3 0 0 0 12 15a3 3 0 0 0 2.3-1.1M6.3 7.2A11 11 0 0 0 2.5 12S6 18 12 18a9 9 0 0 0 3.2-.6M17.7 16.8A11 11 0 0 0 21.5 12S18 6 12 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
      all:'<svg class="ic" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.7"/><path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
      only:'<svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M4 8h16v10.4A1.6 1.6 0 0 1 18.4 20H5.6A1.6 1.6 0 0 1 4 18.4V8zm1.2-4h13.6A1.2 1.2 0 0 1 20 5.2V7H4V5.2A1.2 1.2 0 0 1 5.2 4zM9.6 12h4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      pin:'<svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M9.2 3.6h5.6l-1 5 3 3.4h-9.6l3-3.4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 12v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
    };
    function openCf(btn){
      closeCf();
      var r=btn.getBoundingClientRect();
      cfMenu=document.createElement('div');
      cfMenu.className='cf-menu';
      cfMenu.innerHTML=
        '<div class="cf-h">分组方式</div>'+
        cfRow('group:ws','按工作区',ICO.ws,CPREF.group==='ws')+
        cfRow('group:flat','单列表',ICO.flat,CPREF.group==='flat')+
        '<div class="cf-sep"></div><div class="cf-h">排序方式</div>'+
        cfRow('sort:manual','手动排序',ICO.manual,CPREF.sort==='manual')+
        cfRow('sort:updated','最近更新',ICO.clock,CPREF.sort==='updated')+
        '<div class="cf-sep"></div><div class="cf-h">筛选会话</div>'+
        cfRow('view:hide','隐藏已归档',ICO.hide,CPREF.view==='hide')+
        cfRow('view:all','全部对话（显示已归档）',ICO.all,CPREF.view==='all')+
        cfRow('view:only','仅显示已归档',ICO.only,CPREF.view==='only')+
        cfRow('only:pinned','只看置顶',ICO.pin,onlyFilled);
      document.body.appendChild(cfMenu);
      var mw=cfMenu.offsetWidth,mh=cfMenu.offsetHeight;
      var L=Math.max(8,Math.min(r.left,mw,window.innerWidth-mw-8));
      var T=(r.bottom+mh+10>window.innerHeight)?Math.max(8,r.top-mh-4):(r.bottom+4);
      cfMenu.style.left=Math.max(8,L)+'px';cfMenu.style.top=T+'px';
      requestAnimationFrame(function(){cfMenu&&cfMenu.classList.add('on')});
      btn.classList.add('on');
      cfMenu.addEventListener('click',function(e){
        var it=e.target.closest('.cf-it');
        if(!it)return;
        e.stopPropagation();
        var k=it.getAttribute('data-k'),a=k.split(':');
        if(a[0]==='group')CPREF.group=a[1];
        else if(a[0]==='sort')CPREF.sort=a[1];
        else if(a[0]==='view'){
          CPREF.view=a[1];
          /* 选「仅显示已归档」等价于切到归档视图；选另两个就退出归档视图。
             不这么做的话，用户在归档视图里选「隐藏已归档」会看到一片空。 */
          syncViewFromPref();
        }else if(a[0]==='only'){
          onlyFilled=!onlyFilled;
          paintConv(); saveCPref(); return;
        }
        /* 这三段都是单选：分组方式选完列表就换了，排序/筛选选完列表也重排了。
           菜单本身要跟着收掉 —— 留在原地的话勾还停在旧项上，用户会以为没点上，
           得关掉再重开才看到勾挪过来（实测就是这么被报的）。 */
        saveCPref(); applyView(); paintConv(); closeCf();
      });
      setTimeout(function(){
        document.addEventListener('click',function once(){
          closeCf(); document.removeEventListener('click',once);
        });
      },0);
    }
    /* 归档视图与 CPREF.view 双向同步：两者只能有一个说法，否则列表显示的内容
       和标题上的「归档」二字会对不上。 */
    function syncViewFromPref(){
      archView=(CPREF.view==='only');
      if(scArchBtn)scArchBtn.classList.toggle('on',archView);
      var tt=document.querySelector('.sc-t');
      if(tt)tt.textContent=archView?'归档':'会话';
    }
    function applyView(){
      if(CPREF.view==='all'){
        /* 全部：把归档的也拉回来，不再走 archived:1 那条路 */
        loadConvAll();
        return;
      }
      loadConv();
    }
    function saveCPref(){
      try{window.api('/api/ui',{action:'set',
        patch:{conv_pref:CPREF,collapsed:COLLAPSED}}).catch(function(){})}catch(e){}
    }
    if(scFilterBtn){
      scFilterBtn.addEventListener('click',function(e){
        e.stopPropagation();
        if(cfMenu){closeCf();return}
        openCf(scFilterBtn);
      });
    }
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape')closeCf();
    });
    if(scNewBtn){
      scNewBtn.addEventListener('click',function(){
        window.goPage('home');
        document.dispatchEvent(new CustomEvent('riffcut-new-conv'));
      });
    }

    window.__markNav=markNav;
    window.__convReload=loadConv;
    window.__convSetCurrent=function(cid){CUR_CID=cid||'';paintConv()};

    /* 服务端读回三档设置与折叠状态，再决定拉哪一份列表 */
    try{
      window.api('/api/ui',{action:'get'}).then(function(d){
        if(!d)return;
        if(d.conv_pref&&typeof d.conv_pref==='object'){
          ['group','sort','view'].forEach(function(k){
            if(typeof d.conv_pref[k]==='string')CPREF[k]=d.conv_pref[k];
          });
        }
        if(d.collapsed&&typeof d.collapsed==='object')COLLAPSED=d.collapsed;
        syncViewFromPref();
        applyView();
      }).catch(function(){});
    }catch(e){}

    loadPinned(); paintNav();
    loadConv();
    // 首页每存一次对话都会广播，这里跟着刷新
    document.addEventListener('riffcut-conv-saved',function(){loadConv()});
  })();

  /* 页签跳转：「客户与素材」「品牌资产」现在是同一处的两个页签。
     两个页面各有一条 .u-tabs，都在这里统一接管，点哪个都调 goPage。 */
  document.addEventListener('click',function(e){
    var b=e.target.closest('.u-tabs button[data-goto]');
    if(!b)return;
    e.preventDefault();
    window.goPage(b.getAttribute('data-goto'));
  });

  /* 通用：没被真实功能接管（data-live）的元素才给占位反馈 */
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-demo]');
    if(t&&!t.hasAttribute('data-live')){window.say(t.getAttribute('data-demo')||'功能待接入');}
    /* ★ 带 data-live 的开关由页面自己的逻辑管状态，这里不能再翻一次。
       以前 #kSwitch 就是这么坏的：页面按服务端值设好「开」，这段委托
       又无脑 toggle 一遍 → 显示关、实际开，视觉和真实状态永远对不上。 */
    var s=e.target.closest('.u-switch');
    if(s&&!s.hasAttribute('data-live')){s.classList.toggle('on');}
  });
  /* 标记某元素已被真实功能接管，避免再弹占位提示 */
  window.live=function(selector,root){
    (root||document).querySelectorAll(selector).forEach(function(x){x.setAttribute('data-live','1')});
    return (root||document).querySelectorAll(selector);
  };

  /* ── 选择文件夹：真实读取目录内视频/图片/音频素材 ── */
  window.__folderFiles=[];
  var picker=document.getElementById('folderPicker');
  var VID=/\.(mp4|mov|m4v|avi|mkv|webm|mts|mxf|wmv|flv)$/i;
  var IMG=/\.(jpg|jpeg|png|heic|webp|tif|tiff|gif|bmp|raw)$/i;
  var AUD=/\.(mp3|wav|aac|m4a|flac|aiff|ogg)$/i;
  function kind(n){return VID.test(n)?'视频':IMG.test(n)?'图片':AUD.test(n)?'音频':'其他'}
  function fmtSize(b){if(!b&&b!==0)return '—';if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(1)+' MB'}

  window.onFolderPicked=function(arg){
    /* .app 原生选目录：拿到绝对路径 → 本机服务真实扫描（ffprobe 元数据 + 缩略图）
       扫描期间只挂一个右下角进度，不锁界面：用户可以接着切页、点别的按钮。 */
    if(arg&&!Array.isArray(arg)&&arg.root){
      /* 首页「工作空间」按钮复用了这个桥：它先置 __wsPicking，
         这里就把这个目录设成工作空间，而不是当素材夹扫一遍。 */
      if(window.__wsPicking){
        window.__wsPicking=false;
        if(window.riffcutSetWorkspace){window.riffcutSetWorkspace(arg.root);return}
      }
      window.say('已选择文件夹，后台开始读取…');
      var t0=Date.now();
      if(window.taskUI)window.taskUI.start('正在读取素材文件夹…','读取文件列表');
      var tick=setInterval(function(){
        if(!window.taskUI)return;
        var t=(Date.now()-t0)/1000;
        taskUI.stage(t<2?'读取文件列表':t<6?'读取分辨率 / 时长 / 大小'
          :t<14?'生成缩略图':'去重与素材归类');
      },400);
      window.api('/api/scan',{root:arg.root,customer:window.RiffCut.customer}).then(function(d){
        window.RiffCut.library=d;
        document.dispatchEvent(new CustomEvent('folderchange',{
          detail:{files:d.items||[],stats:d.stats||{},root:d.root,
                  scanned:d.scanned,index:d.index||null}}));
        window.say('读取完成：'+(d.stats?d.stats['总数']:0)+' 个文件，可以继续操作');
      }).catch(function(e){window.say('读取失败：'+e.message)})
        .then(function(){
          clearInterval(tick);
          if(window.taskUI)window.taskUI.done();
        });
      return;
    }
    /* 浏览器兜底：只有相对文件名，仍列出清单 */
    var list=arg||[];
    window.__folderFiles=list;
    var n={视频:0,图片:0,音频:0,其他:0};
    list.forEach(function(f){n[kind(f.name)]++});
    window.__folderStats=n;
    document.dispatchEvent(new CustomEvent('folderchange',{detail:{files:list,stats:n}}));
    window.say('已读取 '+list.length+' 个文件（浏览器预览模式，元数据需在本机应用里扫描）');
  };

  window.pickFolder=function(){
    if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.folder){
      window.webkit.messageHandlers.folder.postMessage('pick');
    }else{
      picker.value='';picker.click();
    }
  };
  picker.addEventListener('change',function(){
    var list=[].map.call(this.files,function(f){
      return {name:f.name,path:f.webkitRelativePath||f.name,size:f.size,kind:kind(f.name)};
    });
    if(list.length)window.onFolderPicked(list);
  });
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-pickfolder]');
    if(b){e.preventDefault();window.pickFolder();}
  });

  /* 交通灯 & 标题栏 */
  document.querySelectorAll('.tb-actions button').forEach(function(b){
    if(b.id==='tbBell')return;  /* 通知按钮由 live.js 接管 */
    if(b.id==='tbFeedback')return;  /* 反馈按钮下面单独绑 */
    b.addEventListener('click',function(){window.say(b.title+' · 系统能力待接入');});
  });

  /* 反馈：唤起系统邮件客户端，预填版本与系统信息。
     为什么走邮件而不是内置表单：本机软件没有服务端，收反馈最省事就是邮件；
     预填诊断信息是为了省掉「你用的什么版本」这一轮来回。 */
  (function(){
    var fb=document.getElementById('tbFeedback');
    if(!fb)return;
    fb.addEventListener('click',function(){
      if(!(window.riffcut&&window.riffcut.feedbackMail)){
        window.say('反馈通道未接通 · 请发邮件到 China@cyanweb.cn');
        return;
      }
      window.riffcut.feedbackMail({kind:'反馈'}).then(function(r){
        if(!r||!r.ok)window.say('没能唤起邮件客户端 · 请手动发到 China@cyanweb.cn');
      });
    });
  })();
  document.querySelectorAll('[data-win]').forEach(function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();
      var act=b.dataset.win;
      /* Electron 里走 preload 暴露的 winAction。
         旧版是 window.webkit.messageHandlers（WKWebView 通道），
         Electron 没有这个东西 —— 之前的症状是点红绿灯只弹「系统能力待接入」。 */
      if(window.riffcut&&window.riffcut.winAction){ window.riffcut.winAction(act); return; }
      window.say((b.title||'窗口操作')+' · 系统能力待接入');
    });
  });
})();
</script>
