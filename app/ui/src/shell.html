<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RiffCut 影创 AI Studio</title>
<style>
/* ══ 设计令牌（2026-11-17 统一专业标准）═══════════════════════════════
   原则：一档强调色、三档圆角、五档字号、无渐变无吉祥物色。
   ⚠ 变量名沿用了旧的 --gold* 是因为全站 120 处引用它们，
     一次性改名风险远大于收益；这里只换「值」，语义全部转成中性/强调。
     --gold      极浅中性底（原来是香槟金，现在只是比白深一档的灰）
     --gold-soft 浅中性底（选中态背景）
     --gold-deep 唯一强调色（原来是金铜，现在是青绿，和主按钮同色系）
     --green/--purple 只作为状态点保留，不再大面积铺色。
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --panel:#FFFFFF;
  --ink:#1E2430; --ink2:#5A6272; --ink3:#98A0AF;
  --line:#E7EAF0; --hover:#F4F6FA;
  /* 唯一强调色：青绿。全站只允许它和中性灰，不再有金/粉/紫。 */
  --accent:#1B8B7E; --accent-ink:#147567; --accent-soft:#EAF5F3; --accent-line:#BFE0DA;
  --gold:#F6F8FB; --gold-soft:#F0F3F8; --gold-deep:#1B8B7E;
  --green:#C6F1D9; --purple:#DDE3EC;
  /* 圆角只留三档：4（小控件）/ 8（按钮、输入）/ 12（卡片、面板） */
  --r-lg:12px; --r-md:8px; --r-sm:4px;
  /* 字号只留四档：20 页面标题 / 15 小标题·重点 / 12 正文 / 10.5 微标签 */
  --f1:20px; --f2:15px; --f3:12px; --f4:12px; --f5:10.5px;
  --sh-1:0 1px 2px rgba(28,38,58,.06),0 4px 14px rgba(28,38,58,.06);
  --sh-btn:0 1px 2px rgba(28,38,58,.08),inset 0 1px 0 rgba(255,255,255,.9);
  --sh-in:inset 0 1px 2px rgba(28,38,58,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
  /* 正文基准固定 15px（--f2）。不给基准值的话浏览器默认 16px 会成为一个
     计划外的第六档字号，凡是没显式声明的地方都会漏出这一档。 */
  font-size:var(--f2);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased}
/* 控件不继承字号会出现浏览器默认的 13.3333px 档，把它也压回令牌体系 */
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.ic{width:20px;height:20px;display:block;flex:0 0 auto}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
#frame{position:absolute;inset:0;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* ── 标题栏（macOS 交通灯） ───────────── */
/* ★ -webkit-app-region:drag 是 Electron 里「拖这块能移动窗口」的唯一开关。
   没有它，标题栏就是一块普通 div —— 鼠标按住拖不动窗口，
   而原生标题栏已经被 titleBarStyle:'hidden' 藏掉了，所以整窗没有任何地方能拖。
   反过来，按钮上必须 no-drag，否则点在按钮上的第一下会被当成「开始拖窗口」，
   点击事件根本不触发（这就是红绿灯点了没反应的一半原因）。 */
.titlebar{flex:0 0 clamp(48px,6.2%,64px);display:flex;align-items:center;padding:0 20px;
  position:relative;background:#FFFFFF;border-bottom:1px solid var(--line);
  box-shadow:0 1px 3px rgba(28,38,58,.04);z-index:5;
  -webkit-app-region:drag;user-select:none}
.titlebar button,.titlebar input,.titlebar .lights,.titlebar .tb-actions,
.titlebar .tb-brand{-webkit-app-region:no-drag}
/* 双击标题栏 = 系统默认的「最大化/还原」 */
.titlebar{-webkit-user-select:none}
/* ── 窗口按钮（原来是 12px 自绘三色点，跟系统那三个叠在一起像一串小圆点）
   现在：原生窗口的交通灯已经在 main.swift 里关掉了，这里就是唯一的三个按钮。
   尺寸取 macOS 标准 12px 圆 + 视觉留白，间距 8px，跟系统那种一眼分不出差别；
   只有 hover 才浮出符号，不 hover 时是纯色圆点，不喧宾夺主。 */
.lights{display:flex;align-items:center;gap:10px;padding-right:2px}
.lights i{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;
  font-size:10.5px;line-height:1;font-weight:700;font-style:normal;color:rgba(0,0,0,.55);
  cursor:pointer;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14);
  transition:filter .14s}
.lights i:hover{filter:brightness(.92)}
.lights i:active{filter:brightness(.82)}
.lights i span{opacity:0;transition:opacity .14s}
.lights:hover i span{opacity:1}
.lights .r{background:#FF5F57}.lights .y{background:#FEBC2E}.lights .g{background:#28C840}
.tb-brand{position:absolute;left:clamp(104px,7.6%,118px);display:flex;align-items:center;gap:9px}
.tb-brand img{height:18px;width:auto;object-fit:contain;display:block}
.tb-brand .tb-customer{font-size:var(--f5);color:var(--ink3);margin-left:8px;padding-left:10px;border-left:1px solid var(--line)}
.tb-actions{margin-left:auto;display:flex;align-items:center;gap:14px;color:#4A5262;position:relative}.tb-actions button{width:28px;height:28px;display:grid;place-items:center;color:#4A5262;border-radius:8px;transition:background .16s,box-shadow .16s}
.tb-actions button:hover{background:#F5F7FB;box-shadow:var(--sh-btn)}
.tb-actions .ic{width:17px;height:17px}

/* ── 页眉正中的系统级告警 ────────────────
   只给「不修好就没法用」的故障用：FFmpeg 缺失、本机服务没起来、渲染链路坏了。
   普通操作反馈也走页眉 say()，但告警在场时 say() 自动下移一行，两者不叠。
   红色呼吸脉冲用逐条 animation-* 属性写，不用含变量的简写（WebKit 会把整条 throw 掉）。 */
.sys-alert{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:9px;max-width:min(580px,44vw);
  padding:5px 6px 5px 12px;border-radius:8px;
  background:#FFF4F3;border:1px solid #F1C2BE;color:#A3251B;
  font-size:var(--f5);font-weight:600;line-height:1.2;z-index:7;
  animation-name:saBreath;animation-duration:2.4s;animation-timing-function:ease-in-out;
  animation-iteration-count:infinite}
.sys-alert[hidden]{display:none}
@keyframes saBreath{
  0%,100%{box-shadow:0 0 0 0 rgba(211,59,47,0),0 2px 8px rgba(211,59,47,.08)}
  50%{box-shadow:0 0 0 5px rgba(211,59,47,.15),0 2px 12px rgba(211,59,47,.16)}}
.sys-alert .sa-dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:#D33B2F;
  animation-name:saDot;animation-duration:1.7s;animation-timing-function:ease-out;
  animation-iteration-count:infinite}
@keyframes saDot{
  0%{box-shadow:0 0 0 0 rgba(211,59,47,.55)}
  70%{box-shadow:0 0 0 7px rgba(211,59,47,0)}
  100%{box-shadow:0 0 0 0 rgba(211,59,47,0)}}
.sys-alert .sa-tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sys-alert button{border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;
  padding:0;line-height:1;flex:0 0 auto}
.sys-alert .sa-more{padding:4px 9px;border-radius:8px;background:#FBE0DD;font-weight:700;
  transition:background .15s}
.sys-alert .sa-more:hover{background:#F7CDC9}
.sys-alert .sa-x{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;
  font-size:12px;opacity:.6;transition:opacity .15s,background .15s}
.sys-alert .sa-x:hover{opacity:1;background:#FBE0DD}
/* 收起态：缩成一颗红点继续挂着眼皮底下，问题没修好就不会真消失 */
.sys-alert.mini{max-width:none;padding:6px;border-radius:50%;gap:0}
.sys-alert.mini .sa-tx,.sys-alert.mini .sa-more,.sys-alert.mini .sa-x{display:none}
.sys-alert.mini{cursor:pointer}

/* ── 工作区 ───────────────────────────── */
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:clamp(184px,14.5%,220px) minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);
  transition:grid-template-columns .22s ease}
body.side-collapsed .workspace{grid-template-columns:64px minmax(0,1fr)}
/* 进剪辑页自动收起侧栏那套（ed-zone / side-peek / .side-hot）已整体删除：
   主栏只剩 4 项 + 一个「更多」，自动折叠省不出空间，反而让侧栏在剪辑页反复隐现。
   要窄屏就自己点顶部折叠按钮。 */
.sidebar{position:relative;display:flex;flex-direction:column;padding:0 12px;overflow:hidden;
  background:#FFFFFF;border-right:1px solid var(--line)}
/* 侧栏不再铺丝绸底纹：一张半透明贴图铺满整条侧栏，字压在上面显灰、显脏。
   纯白 + 右侧一道 1px 分隔线更干净，也和主区同一层纸面。 */
/* 顶部折叠条：顺带把整组导航往下带一点 */
.side-top{position:relative;z-index:3;height:38px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:space-between;padding:0 3px 0 15px}
.side-top .st-label{font-size:var(--f5);color:var(--ink3);letter-spacing:1.4px;font-weight:600}
/* 折叠按钮：只留图标本身 —— 无边框、无底色、无阴影（2026-11-17 用户要求）。
   悬浮时靠颜色和一层极淡的圆角底提示可点，不做「实体按钮」那种盒子。 */
.side-toggle{position:relative;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  color:#8A92A2;background:transparent;border:0;
  transition:background .18s,color .18s,transform .18s}
.side-toggle .ic{width:18px;height:18px;grid-area:1/1}
.side-toggle .ic-expand{display:none}
.side-toggle:hover{color:#1B8B7E;background:rgba(27,139,126,.08)}
.side-toggle:active{transform:scale(.93)}
.side-toggle::after{content:attr(data-tip);position:absolute;right:calc(100% + 10px);top:50%;
  white-space:nowrap;pointer-events:none;padding:5px 10px;border-radius:8px;
  background:#2A3140;color:#fff;font-size:10.5px;font-weight:500;letter-spacing:.4px;
  box-shadow:0 5px 16px rgba(28,38,58,.22);opacity:0;transform:translateY(-50%) translateX(4px);
  transition:opacity .16s,transform .16s;z-index:20}
.side-toggle::before{content:"";position:absolute;right:calc(100% + 5px);top:50%;
  border:5px solid transparent;border-left-color:#2A3140;pointer-events:none;
  opacity:0;transform:translateY(-50%);transition:opacity .16s;z-index:20}
.side-toggle:hover::after{opacity:1;transform:translateY(-50%) translateX(0)}
.side-toggle:hover::before{opacity:1}
body.side-collapsed .side-top{justify-content:center;padding:0}
body.side-collapsed .side-top .st-label{display:none}
body.side-collapsed .side-toggle .ic-collapse{display:none}
body.side-collapsed .side-toggle .ic-expand{display:block}
body.side-collapsed .side-toggle::after{display:none}
.nav{margin-top:6px;flex:0 0 auto;min-height:0;overflow:auto;scrollbar-width:none;position:relative;z-index:1;
  display:flex;flex-direction:column;justify-content:flex-start;gap:4px;padding:2px 0 12px}
.nav::-webkit-scrollbar{display:none}
/* 所有导航项与高亮块统一宽度：选中/悬浮长度完全一致 */
.nav a{position:relative;flex:0 0 auto;width:100%;height:clamp(38px,4.4vh,46px);
  display:flex;align-items:center;gap:11px;padding:0 14px;border-radius:var(--r-md);
  color:#39414F;font-size:15px;text-decoration:none;white-space:nowrap;
  transition:background .16s,color .16s,box-shadow .16s}
.nav a.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--gold-deep)}
/* 折叠态：只留图标，文字用 font-size:0 收掉（不用改 DOM） */
body.side-collapsed .nav a{width:40px;padding:0 10px;justify-content:center;gap:0;font-size:0}
body.side-collapsed .nav a .ic{flex:0 0 20px}
/* 折叠态：品牌标仍然压底（margin-top:auto 保留），只是别贴着窗口下沿。
   原来 margin-bottom:12px 几乎顶到底边，留白收到 34px 往上提一点点。 */
/* 折叠态（64px）整块品牌区收掉：原来靠那个三角 V 图形标占位，
   图形标删了、字标 132px 又塞不进 64px，留着只会截成半截字。
   页眉那条已经有一份完整的 RiffCut 影创字标，这里不重复。 */
.side-brand .wm-mini{display:none}
/* 折叠态：margin-top:auto 仍然压底，只把 margin-bottom 加大把它往上提 22px。
   用户要的是「往上一点」这种像素级微调，不是贴到导航下面。 */
body.side-collapsed .side-brand{display:flex;align-items:center;padding:6px 0 0;margin-bottom:32px}
body.side-collapsed .side-brand .wordmark{display:none}
body.side-collapsed .side-brand .wm-mini{display:block;width:40px;height:auto}
body.side-collapsed .side-brand .sl,body.side-collapsed .side-brand .by{display:none}
.nav a .ic{width:19px;height:19px;color:#39414F;flex:0 0 auto}
.nav a:hover{background:var(--hover);box-shadow:var(--sh-btn)}
/* 选中态：浅青绿底 + 深青字，不要描边也不要投影。
   原来那条 inset 0 0 0 1px 金描边 + 灰底，在 4 项一窄条上看着像贴了块脏胶带。 */
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;
  box-shadow:none}
.nav a.on .ic{color:var(--accent)}
.nav a.on:hover{background:#DFF0ED}
/* 左下角只留文字字标（RiffCut 影创）+ 标语 + 出品方。
   原来上面还有一个三角 V 图形标，跟字标里的 V 重复，删掉了；
   所以这里要补一点上留白，否则字标会显得被挤在会话列表下面。 */
.side-brand{position:relative;z-index:1;margin-top:auto;margin-bottom:14px;padding-left:15px;
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding-top:6px}
.side-brand .wordmark{width:100%;max-width:174px;height:auto;object-fit:contain;
  display:block;margin-bottom:6px}   /* 按宽度不按高度：新字标 9.16:1，按 24px 高算宽要 220px，侧栏只有 174px 可用，会被裁掉后半截 */
.side-brand .sl{font-size:var(--f5);color:#7C8494;letter-spacing:.5px}
.side-brand .by{font-size:var(--f5);color:#5C7FB8}

/* ── 会话区（照 DSH：常驻在固定项下面，占满剩余高度）──────────
   侧栏要承载「我之前做过什么」，所以这块必须常驻、可滚动，不能收成抽屉。
   固定项只有 4 个、会话可能有几十条 —— 高度分配上就让会话区吃 flex，
   固定项与底部「更多」都是 flex:0 0 auto，谁的条数变了都不会互相挤。 */
.side-conv{flex:1 1 0;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  margin:10px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
.sc-head{flex:0 0 auto;display:flex;align-items:center;gap:2px;height:26px;padding:0 5px 0 15px}
.sc-t{font-size:var(--f5);color:var(--ink3);letter-spacing:1.2px;font-weight:600;flex:1;min-width:0}
.sc-ic{flex:0 0 24px;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;
  background:transparent;border:0;color:#96A0B0;padding:0;transition:background .14s,color .14s}
.sc-ic svg{width:14px;height:14px}
.sc-ic:hover{background:var(--hover);color:#39414F}
.sc-ic.on{background:var(--accent-soft);color:var(--accent-ink)}
.sc-search{flex:0 0 auto;padding:6px 8px 2px}
.sc-search[hidden]{display:none}
.sc-search input{width:100%;height:30px;padding:0 10px;border-radius:8px;
  border:1px solid var(--line);background:#F7F9FC;font-size:var(--f4);color:#1E2430;
  outline:none;transition:border-color .14s,background .14s}
.sc-search input:focus{border-color:var(--accent-line);background:#FFFFFF}
.sc-list{flex:1 1 auto;min-height:0;overflow:auto;overflow-x:hidden;
  display:flex;flex-direction:column;gap:1px;padding:4px 8px 4px 8px;
  scrollbar-width:none}
.sc-list::-webkit-scrollbar{width:0}
.sc-item{position:relative;display:block;width:100%;text-align:left;
  padding:7px 9px;border-radius:8px;background:transparent;border:0;
  transition:background .14s}
.sc-item:hover{background:var(--hover)}
.sc-item.on{background:var(--accent-soft)}
.sc-item .row{display:flex;align-items:baseline;gap:6px;min-width:0}
/* ── 会话三段式菜单（分组方式 / 排序方式 / 筛选会话）──
   照 DSH 的那张三段菜单搬过来：勾选态用右侧对勾表示，不换底色 ——
   换底色会让整块菜单变成一堆色块，跟侧栏的白底打架。 */
.cf-menu{position:fixed;z-index:900;min-width:212px;padding:5px;
  background:#fff;border:1px solid var(--line);border-radius:11px;
  box-shadow:0 12px 32px -10px rgba(20,30,50,.24),0 2px 6px rgba(20,30,50,.06);
  display:flex;flex-direction:column;gap:1px;
  opacity:0;transform:translateY(-4px);transition:opacity .14s,transform .14s}
.cf-menu.on{opacity:1;transform:none}
.cf-h{padding:7px 9px 4px;font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.3px}
.cf-it{display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;
  border:0;background:none;border-radius:7px;cursor:pointer;
  font-size:13.5px;color:var(--ink);text-align:left;width:100%}
.cf-it:hover{background:#F3F6FA}
.cf-it .ic{width:15px;height:15px;flex:0 0 auto;color:var(--ink2)}
.cf-it .lb{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cf-it .ck{width:14px;height:14px;flex:0 0 auto;color:var(--accent);opacity:0}
.cf-it.on .ck{opacity:1}
.cf-sep{height:1px;background:var(--line);margin:4px 6px}
/* 分组标题：可折叠，箭头在左；计数贴右 */
.sc-grp{margin-top:2px}
.sc-gt{display:flex;align-items:center;gap:6px;width:100%;height:28px;padding:0 8px;
  border:0;background:none;cursor:pointer;border-radius:6px;
  font-size:11.5px;font-weight:600;color:var(--ink3);letter-spacing:.2px}
.sc-gt:hover{background:#F5F7FA;color:var(--ink2)}
/* 文件夹图标代替三角：展开时是开口夹（多一道横线），收起是合口夹。
   不再旋转 —— 转一个文件夹会很怪。 */
.sc-gt .ws{width:13px;height:13px;flex:0 0 auto;color:var(--ink3)}
.sc-gt:hover .ws{color:var(--ink2)}
.sc-gt .nm2{flex:1 1 auto;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-gt .n2{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--ink3)}
.sc-grp .bd{display:flex;flex-direction:column}
.sc-grp.closed .bd{display:none}
/* 置顶标志：标题后面一枚灰色小图钉，不另起一行、不改行高。
   灰色而不是品牌青 —— 它是个「状态标记」，不是可点的动作，着色会抢正文。 */
.sc-item .pin{width:17px;height:17px;flex:0 0 auto;color:#8B93A3;
  align-self:center;opacity:.95}
.sc-item.on .pin,.sc-item:hover .pin{color:#6B7385;opacity:1}
.sc-item .row b{flex:1 1 auto;min-width:0}
.sc-item .when{flex:0 0 auto;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.sc-item .more{flex:0 0 auto;display:none;place-items:center;width:18px;height:18px;
  border-radius:5px;border:0;background:none;color:#98A0AF;cursor:pointer;padding:0;
  align-self:center}
.sc-item:hover .more,.sc-item.on .more,.sc-item .more.on{display:grid}
.sc-item .more:hover{background:#fff;color:#1E2430;box-shadow:0 1px 2px rgba(20,30,50,.10)}
.sc-item .more svg{width:13px;height:13px}
.sc-item b{display:block;font-size:13.5px;font-weight:500;color:#39414F;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.45}
.sc-item.on b{color:var(--accent-ink);font-weight:600}
.sc-item .sub{display:block;font-size:11.5px;color:var(--ink3);line-height:1.45;
  margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-item .acts{position:absolute;right:5px;top:50%;transform:translateY(-50%);display:none;
  display:none;align-items:center;gap:2px}
.sc-item .acts{display:none !important}
.sc-item .act{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;
  color:#9AA2B1;cursor:pointer;border:1px solid transparent}
.sc-item .act:hover{color:#1E2430;border-color:#E3E8F0;background:#fff}
.sc-item .act.del:hover{color:#D33B2F;border-color:#F0D2CE}
.sc-item .act svg{width:12px;height:12px}

/* 会话「⋯」浮层：挂在 body 上，定位于按钮右下 */
.conv-menu{position:fixed;z-index:900;min-width:132px;padding:4px;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 28px -8px rgba(20,30,50,.22),0 2px 6px rgba(20,30,50,.06);
  display:flex;flex-direction:column;gap:1px;
  opacity:0;transform:translateY(-4px);transition:opacity .14s,transform .14s}
.conv-menu.on{opacity:1;transform:none}
.conv-menu button{display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;
  border:0;background:none;border-radius:6px;cursor:pointer;text-align:left;
  font-size:12.5px;color:#39414F;white-space:nowrap}
.conv-menu button:hover{background:var(--hover)}
.conv-menu button svg{width:13px;height:13px;flex:0 0 13px;color:#7A8291}
.conv-menu button.danger{color:#B4453C}
.conv-menu button.danger svg{color:#B4453C}
.conv-menu button.danger:hover{background:#FDF3F2}
.sc-item .del{position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border-radius:6px;display:none;place-items:center;
  background:#FFFFFF;border:1px solid var(--line);color:#98A0AE;padding:0}
.sc-item:hover .del{display:grid}
.sc-item .del:hover{color:#D33B2F;border-color:#F0D2CE}
.sc-item .del svg{width:12px;height:12px}
/* 空态：库里只有一条会话时会看到这个。
   必须明确写出「还没有会话」＋一句怎么办，否则空列表看着像加载失败。 */
.sc-empty{padding:16px 10px;font-size:var(--f5);line-height:1.8;color:var(--ink3)}
.sc-empty b{display:block;color:#5A6272;font-weight:600;font-size:var(--f4);margin-bottom:3px}
/* 搜索/筛选生效但没有结果 */
.sc-none{padding:14px 10px;font-size:var(--f5);color:var(--ink3)}
/* 折叠态：会话区放不下标题，整个收掉。
   但「我在哪条会话里」的感知不能丢 —— 由 .side-set 的高亮承担。 */
body.side-collapsed .side-conv{display:none}

/* 「更多」入口：贴在固定项下面、会话区上面。
   叫「更多」不叫「设置」：它列的是所有没钉到上面的模块，设置只是其中之一。
   高亮跟 .nav a.on 完全同一套（同底色、同描边、同 3px 竖条），
   否则用户从浮层跳到某个模块后回看侧栏，会以为哪都没选中。 */
.side-set{position:relative;z-index:1;flex:0 0 auto;display:flex;align-items:center;gap:10px;
  width:100%;height:clamp(38px,4.4vh,46px);padding:0 14px;margin:2px 0 0;border-radius:var(--r-md);
  background:transparent;border:0;color:#39414F;font-size:15px;text-align:left;
  transition:background .16s,color .16s}
.side-set .ic{width:19px;height:19px;flex:0 0 19px;color:#39414F}
.side-set:hover{background:var(--hover)}
.side-set.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;
  box-shadow:none}
.side-set.on .ic{color:var(--accent)}
.side-set.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--gold-deep)}
/* 进去的是哪个模块，直接在按钮上标出来 —— 不然只知道「在更多里」等于不知道 */
.side-set .sub{display:none;margin-left:auto;font-size:var(--f5);font-weight:400;color:var(--ink3)}
.side-set.on .sub{display:block}
body.side-collapsed .side-set .sub{display:none}
body.side-collapsed .side-set{width:40px;padding:0 10px;justify-content:center;gap:0;font-size:0}
body.side-collapsed .side-set .ic{flex:0 0 20px}

/* ── 设置浮层（对齐 DSH：左列模块 + 右侧说明）────────────── */
.set-mask{position:fixed;inset:0;z-index:300;display:none;
  background:rgba(20,28,42,.32);backdrop-filter:blur(2px);
  align-items:center;justify-content:center;padding:24px}
.set-mask.on{display:flex;animation:setIn .16s ease}
@keyframes setIn{from{opacity:0}to{opacity:1}}
/* 面板要装得下一整页真实内容（表格、轨道、图表），所以不能再是 760×520 的小框。
   放大到接近全屏，左列保持窄：右边是内容，左边只是索引。 */
.set-panel{display:grid;grid-template-columns:236px minmax(0,1fr);
  width:min(1180px,94vw);height:min(780px,90vh);
  background:#FFFFFF;border-radius:14px;overflow:hidden;
  box-shadow:0 24px 70px rgba(16,24,40,.26),0 2px 8px rgba(16,24,40,.08)}
.set-left{background:#F7F9FC;border-right:1px solid var(--line);
  padding:16px 12px 12px;display:flex;flex-direction:column;min-height:0}
.set-h{font-size:var(--f5);color:var(--ink3);letter-spacing:1.4px;font-weight:600;
  padding:4px 10px 4px}
/* 这一行说清两个动作，否则用户看到图钉不知道点它会干什么 */
.set-tip{font-size:10.5px;color:#A6AEBC;line-height:1.5;padding:0 10px 9px}
.set-list{display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0}
.set-list::-webkit-scrollbar{width:0}
/* 一行 = 跳页区 + 图钉区，两个独立点击目标，所以不能整行做成 button */
/* 行是「文字列表」不是「一堆色块」：默认全透明，只有 hover / 当前项才出底色。
   钉住的项靠左侧一条 2px 青条 + 实心图钉表达，不靠背景色 ——
   12 行全上色会变成一堵墙，看不出主次。 */
.set-item{position:relative;display:flex;align-items:center;gap:2px;width:100%;
  border-radius:8px;transition:background .14s}
.set-item:hover{background:#EDF1F7}
.set-item.cur{background:#FFFFFF;box-shadow:0 1px 3px rgba(20,30,50,.10)}
.set-go{display:flex;align-items:center;gap:11px;flex:1 1 auto;min-width:0;
  height:36px;padding:0 4px 0 12px;border-radius:8px;background:transparent;border:0;
  color:#3E4655;font-size:14px;text-align:left;white-space:nowrap}
.set-go .ic{width:17px;height:17px;flex:0 0 17px;color:#7A8394}
.set-go span{overflow:hidden;text-overflow:ellipsis}
.set-item.cur .set-go{color:#1E2430;font-weight:600}
.set-item.cur .set-go .ic{color:var(--accent)}
.set-item.on .set-go::before{content:"";position:absolute;left:2px;top:50%;
  transform:translateY(-50%);width:2px;height:13px;border-radius:0 2px 2px 0;
  background:var(--accent);opacity:.85}
/* 图钉：钉上是实心青绿，没钉是空心中灰。
   平时半透明，鼠标进这一行才显形 —— 12 个图钉同时亮着太吵。 */
.set-pin{flex:0 0 26px;width:26px;height:26px;margin-right:6px;border-radius:6px;
  display:grid;place-items:center;background:transparent;border:0;padding:0;
  color:#C2C9D4;opacity:0;transition:opacity .14s,color .14s,background .14s}
.set-item:hover .set-pin,.set-pin.on{opacity:1}
.set-pin svg{width:14px;height:14px}
.set-pin:hover{background:#E2E8F1;color:#6B7484}
.set-pin.on{color:var(--accent)}
.set-pin.on:hover{background:var(--accent-soft);color:var(--accent-ink)}
/* 主栏最多放 6 项：再多侧栏就成了竖排长列表，跟「四项就够」的初衷相反。
   到上限时图钉置灰并给 title 说明原因，不是静默点不动。 */
.set-pin.full{color:#DDE2E9}
.set-pin.full:hover{background:#F0F3F7;color:#C2C9D4}
/* 右侧两态：
     · 常态：一屏说明（这模块是干什么的）
     · 内嵌：真的把那个页面搬进来，占满右侧整块
   之所以要把 .page 搬进浮层而不是复制一份 HTML，是因为页面里绑着各自的
   JS 状态（选中素材、播放进度、表单草稿），复制一份等于两套状态互相打架。 */
.set-right{position:relative;padding:0;display:flex;flex-direction:column;min-height:0}
.set-x{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:8px;
  display:grid;place-items:center;background:transparent;border:0;color:#8A92A2;
  transition:background .14s,color .14s}
.set-x svg{width:17px;height:17px}
.set-x:hover{background:var(--hover);color:#1E2430}
.set-body{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;
  padding:38px 40px 26px}
/* 内嵌时说明区必须整块收掉，不能只靠 padding:0 ——
   它 still 占着 flex 空间，会把下面的页面挤成半高（实测只剩 284px）。 */
.set-body.is-embed{display:none}
.set-title{font-size:20px;font-weight:700;color:#1E2430;letter-spacing:.2px}
.set-desc{margin-top:10px;font-size:14px;line-height:1.72;color:#5A6272;max-width:52ch}
.set-hint{margin-top:22px;font-size:13px;color:#98A0AE;line-height:1.7}
/* 内嵌标题条：必须能退回来，否则进了模块就没有出口（浮层里没有侧栏） */
.set-embar{flex:0 0 auto;display:none;align-items:center;gap:10px;height:46px;
  padding:0 50px 0 14px;border-bottom:1px solid var(--line);background:#FCFDFE}
.set-embar.on{display:flex}
.set-back{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;
  border-radius:7px;background:transparent;border:1px solid var(--line);color:#5A6272;
  font-size:13px;transition:background .14s,color .14s}
.set-back:hover{background:#F2F5F9;color:#1E2430}
.set-back svg{width:13px;height:13px}
.set-embar b{font-size:14px;font-weight:600;color:#1E2430}
/* 搬进来的页面：.page 本身是 absolute inset:0 + display:none，
   在这里要强制显示（它可能不是当前页），其余排版沿用页面自己那套。 */
.set-stage{position:relative;flex:1 1 auto;min-height:0;display:none}
.set-stage.on{display:block}
.set-stage > .page{display:flex!important;position:absolute;inset:0}
@media (max-width:900px){
  .set-panel{grid-template-columns:minmax(0,1fr);height:min(92vh,100%)}
  .set-left{border-right:0;border-bottom:1px solid var(--line);max-height:196px}
  .set-body{padding:22px 22px 18px}
}

.pages{position:relative;min-width:0;min-height:0;height:100%;overflow:hidden;background:#FFFFFF}
.page{position:absolute;inset:0;display:none;flex-direction:column;
  padding:clamp(10px,1.2%,18px);gap:clamp(8px,1.1%,14px);overflow:hidden}
.page.on{display:flex}

/* ── 通用组件（u-） ────────────────────── */
.u-card{background:#FFFFFF;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.u-head{display:flex;align-items:flex-start;gap:12px;flex:0 0 auto}
.u-head .txt{flex:1;min-width:0}
.u-title{font-size:var(--f1);font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:9px}
.u-sub{font-size:var(--f5);color:var(--ink3);margin-top:4px;letter-spacing:.3px}
.u-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.u-btn{height:32px;padding:0 14px;border-radius:var(--r-sm);background:#FFFFFF;border:1px solid var(--line);
  font-size:var(--f4);color:#3E4655;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:var(--sh-btn);transition:background .16s,box-shadow .16s,transform .16s;white-space:nowrap}
.u-btn:hover{background:#FAFBFD;box-shadow:var(--sh-1);transform:translateY(-1px)}
/* 页签条：把「品牌资产」并进「客户与素材库」，用页签在两者间切换，
   不再单独占一个一级菜单位。样式跟 u-btn 同一套尺寸语言，只换形态。 */
.u-tabs{display:flex;gap:2px;flex:0 0 auto;padding:3px;border-radius:8px;
  background:#F2F5F9;border:1px solid #E7ECF3}
.u-tabs button{height:28px;padding:0 14px;border:0;border-radius:8px;background:transparent;
  font-size:var(--f4);color:#5A6473;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:background .16s,color .16s,box-shadow .16s;white-space:nowrap}
.u-tabs button:hover{color:#2C3340}
.u-tabs button.on{background:#FFFFFF;color:#2C3340;font-weight:600;
  box-shadow:0 1px 3px rgba(20,30,50,.10)}
.u-tabs button .ic{width:14px;height:14px}
.u-tabs .cnt{font-size:10.5px;color:#98A0AE;font-weight:400}
.u-tabs button.on .cnt{color:#1B8B7E}
.u-btn .ic{width:14px;height:14px}
.u-btn.gold{background:linear-gradient(180deg,#EEF1F6 0%,#E3E8F0 100%);color:#33405A;font-weight:600;border-color:#EAF5F3;
  box-shadow:0 2px 6px rgba(190,145,70,.26),inset 0 1px 0 rgba(255,255,255,.65)}
.u-btn.gold:hover{box-shadow:0 4px 12px rgba(190,145,70,.34),inset 0 1px 0 rgba(255,255,255,.65)}
.u-btn.sm{height:26px;padding:0 10px;font-size:var(--f5)}
.u-btn.dark{background:#252B36;color:#fff;border-color:#252B36;box-shadow:0 2px 8px rgba(37,43,54,.24)}
.u-btn.dark:hover{background:#3A4252}
.u-tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);flex:0 0 auto}
.u-tabs button{color:var(--ink3);font-size:var(--f3);position:relative;padding:0 0 10px;white-space:nowrap}
.u-tabs button.on{color:var(--ink);font-weight:600}
.u-tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--gold-deep);border-radius:4px}
.u-tag{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 8px;border-radius:12px;
  background:#F3F5F9;color:#5A6272;font-size:var(--f5);white-space:nowrap}
.u-tag.gold{background:#EAF5F3;color:#5A6272}
.u-tag.green{background:#E4F7EC;color:#2E7D52}
.u-tag.blue{background:#E8F0FE;color:#3567C0}
.u-tag.purple{background:#EFEAFB;color:#6E55A8}
/* 失败态：原来全站只有 green/gold/blue/purple/gray，没有「红」这一档，
   于是失败的任务只能用灰的，看上去跟「已完成」一样不显眼。
   红色只给真正的失败用，不要拿它做强调色。 */
.u-tag.red{background:#FBEDED;color:#B04949}
.u-tag.gray{background:#F1F3F7;color:#8A92A2}
.u-dot{width:7px;height:7px;border-radius:50%;background:#35B26B;display:inline-block;flex:0 0 auto}
.u-dot.off{background:#C4CAD5}.u-dot.warn{background:#E9A23B}
.u-field{display:flex;flex-direction:column;gap:6px}
.u-field label{font-size:var(--f5);color:var(--ink2);font-weight:600}
.u-input,.u-select{height:34px;border:1px solid var(--line);border-radius:var(--r-sm);background:#FFFFFF;
  box-shadow:var(--sh-in);padding:0 10px;font-size:var(--f4);display:flex;align-items:center;gap:8px;min-width:0}
.u-input input,.u-select select{border:0;outline:none;background:transparent;width:100%;font-size:var(--f4);color:#333B49;min-width:0}
.u-select select{appearance:none;cursor:pointer}
.u-input .ic,.u-select .ic{width:13px;height:13px;color:#9AA2B1;flex:0 0 auto}
.u-scroll{overflow:auto;scrollbar-width:none;min-height:0}
.u-scroll::-webkit-scrollbar{display:none}
.u-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:var(--ink3);font-size:var(--f4);padding:26px;text-align:center;height:100%}
.u-empty .ic{width:30px;height:30px;color:#C9CFDA}
.u-switch{width:34px;height:19px;border-radius:12px;background:#D9DEE8;position:relative;flex:0 0 auto;
  transition:background .18s;box-shadow:var(--sh-in)}
.u-switch::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .18s}
.u-switch.on{background:var(--gold-deep)}
.u-switch.on::after{transform:translateX(15px)}
.u-progress{height:5px;border-radius:4px;background:#EDF0F5;overflow:hidden}
.u-progress i{display:block;height:100%;background:linear-gradient(90deg,#E3E8F0,#1B8B7E);border-radius:4px}
.u-divider{height:1px;background:var(--line);flex:0 0 auto}
.u-row{display:flex;align-items:center;gap:10px}
.u-thumb{border-radius:8px;background-size:cover;background-position:center;border:1px solid rgba(0,0,0,.04);
  box-shadow:0 2px 8px rgba(28,38,58,.10)}
.u-primary{color:var(--gold-deep)}

/* ── 通知：只有后台长任务才留，顶部只显示最后一条（通知按钮左边） ───────── */
.tb-notice{display:none;align-items:center;gap:6px;max-width:230px;min-width:0;
  padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:#FBFCFE;
  font-size:var(--f5);color:var(--ink2);white-space:nowrap;overflow:hidden}
.tb-notice.on{display:inline-flex}
.tb-notice .dot{width:6px;height:6px;border-radius:50%;background:#1B8B7E;flex:0 0 auto}
.tb-notice.bad .dot{background:#C96A6A}
.tb-notice .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tb-actions button.unread{position:relative}
.tb-actions button.unread::after{content:"";position:absolute;top:3px;right:3px;
  width:6px;height:6px;border-radius:50%;background:#1B8B7E;border:1px solid #fff}
.notice-pop{position:fixed;top:52px;right:16px;width:310px;z-index:420;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 34px rgba(28,38,58,.16);padding:10px 12px;display:none}
.notice-pop.on{display:block}
.notice-pop h4{margin:0 0 8px;font-size:var(--f4);color:var(--ink);display:flex;align-items:center;gap:6px}
.notice-pop h4 button{margin-left:auto;font-size:var(--f5);color:var(--ink3);white-space:nowrap;
  border:0;background:none;padding:2px 6px;border-radius:4px;cursor:pointer}
.notice-pop h4 button:hover{background:#F5F7FB;color:var(--ink)}
/* ── 紧凑化 ───────────────────────────── */
.compact .side-brand .wordmark{max-width:168px}
.compact .side-brand .sl,.compact .side-brand .by{font-size:10.5px}
.compact .page{padding:8px;gap:8px}
.compact .u-title{font-size:15px}
.tiny .page{padding:6px;gap:6px}

/* ══ 全局统一悬浮框：软件里所有「新建 / 添加 / 上传 / 编辑」都用这一套 ══ */
/* 确认框永远压在最上面：音色弹窗（340）、任务卡都在它下面。
   以前确认框是 300，被 340 的音色弹窗盖住 —— 点音色时确认框「弹了但看不见」。 */
#mConfirmModal{z-index:900}
.v-modal{position:fixed;inset:0;z-index:340;display:none;align-items:center;justify-content:center}
.v-modal.open{display:flex}
.v-shade{position:absolute;inset:0;background:rgba(24,30,42,.36);backdrop-filter:blur(2px)}
.v-dialog{position:relative;width:min(520px,92vw);max-height:88vh;display:flex;flex-direction:column;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 24px 70px rgba(20,28,44,.28);overflow:hidden}
.v-dialog-wide{width:min(720px,94vw)}
.v-dhd{display:flex;align-items:center;gap:9px;padding:14px 17px;border-bottom:1px solid var(--line);flex:0 0 auto}
.v-dhd b{font-size:var(--f2)}
.v-x{margin-left:auto;width:26px;height:26px;border:0;background:transparent;color:#8A92A2;
  font-size:20px;line-height:1;cursor:pointer;border-radius:8px;display:grid;place-items:center}
.v-x:hover{background:#F2F4F8;color:#3A4252}
.v-dbd{padding:15px 17px;overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:11px}
.v-dft{display:flex;align-items:center;gap:8px;padding:12px 17px;border-top:1px solid var(--line);flex:0 0 auto}
.v-dft .u-btn:first-child{margin-right:auto}
.v-f{display:flex;flex-direction:column;gap:6px}
.v-f>label{font-size:var(--f5);color:var(--ink2);font-weight:600}
.v-f .u-input{height:34px}
.v-f .u-input input{height:100%;font-size:var(--f4)}
.v-sel,.v-ta{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;
  color:var(--ink);font-size:var(--f4);padding:8px 10px;outline:none;font-family:inherit;box-sizing:border-box}
.v-sel{height:34px;padding:0 10px}
.v-ta{min-height:66px;resize:vertical;line-height:1.6}
.v-sel:focus,.v-ta:focus{border-color:#BFE0DA}
.v-row{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap}
.v-row .v-f{flex:1;min-width:140px}
.v-chk{display:flex;align-items:center;gap:7px;font-size:var(--f5);color:var(--ink2);cursor:pointer;user-select:none}
.v-chk input{width:15px;height:15px;accent-color:#1B8B7E}
.v-inline{display:flex;gap:6px;align-items:center}
.v-inline .u-input{flex:1;min-width:0}
.v-paste{flex:0 0 auto;width:34px;height:34px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:#fff;color:#7A8292;display:grid;place-items:center;cursor:pointer}
.v-paste .ic{width:15px;height:15px}
.v-paste:hover{border-color:#BFE0DA;color:#5A6272;background:#FCFDFE}
.v-tip{font-size:var(--f5);color:var(--ink3);line-height:1.75;background:#F8FAFD;
  border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.v-tip b{color:var(--ink);font-weight:600}
.v-tip .v-path{display:block;margin-top:5px;font-family:ui-monospace,Menlo,monospace;
  font-size:var(--f5);color:#147567;word-break:break-all}
.v-sep{height:1px;background:var(--line);margin:2px 0}


/* ══ 从 2026-11-17-000024 构建备份补回：删登录/注册样式时删除范围跨过头，
      把这几块的样式一并带走了（任务浮条、通用弹窗、危险确认框、页眉提示）。 ══ */
/* 普通操作反馈：页眉正中一条细字，自动消失，不遮挡工作区、不进通知中心。
   2026-11-15 用户反馈：以前固定在页面底部，点时间线片段时黑条正好压在轨道上挡住内容。
   现在移到页眉居中；单行省略 + title 存全文，长错误悬停能看全，停留时长按字数给。
   页眉正中已被系统级红色告警占着时，自动落到页眉下方一行，两者不叠。 */
.mini-toast{position:fixed;top:clamp(5px,1.1vh,14px);left:50%;
  transform:translateX(-50%) translateY(6px);
  background:rgba(30,36,48,.9);color:#fff;padding:7px 16px;border-radius:12px;
  font-size:var(--f5);line-height:1.55;text-align:center;opacity:0;
  transition:opacity .18s,transform .18s;
  pointer-events:none;z-index:400;max-width:min(720px,72vw);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-toast.bad{background:rgba(154,46,38,.94)}
.mini-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.mini-toast.with-alert{top:clamp(52px,7vh,72px)}
/* 后台任务指示：右下角常驻小卡。只报进度，不挡点击、不加遮罩、切页也还在。
   规矩：读文件夹 / 建索引这类耗时活都在后台跑，前端一切照旧可操作。 */
.g-task{position:fixed;right:16px;bottom:16px;z-index:380;display:none;align-items:center;gap:10px;
  background:#FFFFFF;border:1px solid var(--line);border-radius:12px;padding:9px 13px;
  box-shadow:0 14px 36px rgba(20,28,44,.16);max-width:min(360px,72vw);pointer-events:none}
.g-task.on{display:flex}
.g-task .g-spin{width:15px;height:15px;flex:0 0 auto;border-radius:50%;
  border:2px solid #E9DFC9;border-top-color:#C08F32;animation:gSpin .8s linear infinite}
.g-task .g-txt{min-width:0}
.g-task b{display:block;font-size:var(--f4);font-weight:600;color:#2B323D;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-task .g-sub{display:block;font-size:var(--f5);color:#7C8494;line-height:1.4;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-task .g-t{font-size:var(--f5);color:#7C8494;font-variant-numeric:tabular-nums;flex:0 0 auto}
/* 添加 / 编辑模型：悬浮弹窗 */
.m-modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;
  padding:18px;background:rgba(22,28,40,.34);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.m-modal.open{display:flex}
.m-dialog{width:min(520px,94vw);max-height:86vh;overflow:auto;background:#fff;
  border:1px solid var(--line);border-radius:16px;box-shadow:0 22px 60px rgba(20,28,44,.24);
  padding:18px 20px 16px;display:flex;flex-direction:column;gap:12px}
.m-dialog::-webkit-scrollbar{width:6px}
.m-dialog::-webkit-scrollbar-thumb{background:#DDE2EA;border-radius:3px}
.m-dialog-hd{display:flex;align-items:center;gap:9px}
.m-dialog-hd b{font-size:15px;color:var(--ink)}
.m-dialog-hd .m-x{margin-left:auto;width:28px;height:28px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:#fff;color:var(--ink3);font-size:17px;line-height:1;cursor:pointer}
.m-dialog-hd .m-x:hover{color:var(--ink);background:#F7F8FA}
.m-paste{flex:0 0 auto;width:34px;height:36px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:#fff;color:var(--ink3);display:grid;place-items:center;cursor:pointer}
.m-paste .ic{width:15px;height:15px}
.m-paste:hover{border-color:#E7CE9B;color:#9A7433;background:#FFFDF8}
.m-hint{font-size:var(--f5);color:var(--ink3);line-height:1.6;min-height:18px}
.m-hint.warn{color:#9A7433;background:#FFFDF8;border:1px solid #EFE0C0;border-radius:8px;padding:7px 10px}
.m-dialog-ft{display:flex;justify-content:flex-end;gap:8px;padding-top:11px;border-top:1px solid var(--line)}
.m-dialog-ft .u-btn{min-width:82px;height:34px}
.m-dialog-ft .u-btn:disabled{opacity:.42;cursor:default;filter:grayscale(.6)}
.m-dialog.m-detail{width:min(880px,100%);max-height:94vh;overflow:hidden;
  padding:12px 18px 10px;gap:10px}
.m-dialog.m-detail .m-dialog-ft{padding-top:7px}
.m-dialog.m-detail .m-dialog-ft .u-btn{height:28px}
.m-detail-body .m-dialog-ft{flex:0 0 auto}
/* 危险操作二次确认 */
.m-confirm .m-dialog{width:min(430px,92vw)}
.m-confirm-txt{font-size:var(--f4);color:var(--ink2);line-height:1.75}
.m-confirm-txt b{color:#B45B5B}
.m-confirm-row{display:flex;gap:7px;align-items:center}
.m-confirm-row .u-input{flex:1;min-width:0;height:36px}
.m-confirm-row .u-input input{height:100%;font-size:var(--f4)}
.m-confirm .m-dialog-ft .u-btn.danger{background:#FFF1F1;border-color:#E9C1C1;color:#B45B5B}
.m-confirm .m-dialog-ft .u-btn.danger:disabled{opacity:.45;cursor:default;filter:grayscale(.4)}
.compact .m-dialog{width:min(470px,94vw)}
.tiny .m-dialog{width:94vw;padding:14px}
</style>

<script>
/* ── 排队壳：页面片段的脚本在这里就先跑了，比下面 shell 的 window.api 早几百行。
   以前片段里一上手就 window.api(...) 会抛 TypeError，并且把同一块后面所有
   事件绑定一起吞掉 —— 症状是「按钮点了完全没反应」（看板开关就是这么废的）。
   现在先挂一个只入队的假 api，真身装好后自动重放，调用方什么都不用改。 */
(function(){
  /* api 要拿返回值（Promise），所以必须真排队、真重放 */
  var Q=[];
  window.api=function(){
    var a=arguments;
    return new Promise(function(res,rej){ Q.push([a,res,rej]) });
  };
  window.__apiFlush=function(real){
    window.api=real;
    var q=Q.splice(0);
    for(var i=0;i<q.length;i++){
      (function(it){
        try{ real.apply(null,it[0]).then(it[1],it[2]) }catch(e){ it[2](e) }
      })(q[i]);
    }
  };

  /* 其余这几个是「即发即忘」的副作用（弹提示、切页、刷新轨道），
     没就绪时先记下来，真身挂上时补发 —— 不这么做的话，片段里在顶层
     调一次 window.say 就会 TypeError，同一块后面的事件绑定全被吞掉。
     症状和 api 那个一样：按钮点了完全没反应，而且不报在明面上。 */
  var D=[];
  ['say','notice','goPage','riffcutOpenEdit','refreshTimeline','pollTask',
   '__convSetCurrent','__convReload','__markNav'].forEach(function(n){
    window[n]=function(){
      D.push([n,arguments]);
    };
  });
  window.__deferFlush=function(){
    var q=D.splice(0);
    for(var i=0;i<q.length;i++){
      (function(it){
        var f=window[it[0]];
        if(typeof f!=='function')return;
        try{ f.apply(null,it[1]) }catch(e){}
      })(q[i]);
    }
  };
  /* 真身散落在下面几千行里，等 load 之后一次补发就够了；
     800ms 再补一刀，兜住 live.js 里异步挂上的那几个。 */
  window.addEventListener('load',function(){
    window.__deferFlush();
    setTimeout(function(){window.__deferFlush()},800);
  });
})();
</script>
