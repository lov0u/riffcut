<style>
/* ══ 专业剪辑台（我们自己的多轨剪辑界面）═══════════════════════════════════
   设计取舍：
   · 不嵌任何第三方剪辑界面。渲染能力由引擎提供，界面、数据、品牌全是影创自己的。
   · 三栏：左素材池 / 中预览 / 右属性；底部多轨时间线横跨整宽。
   · 时间线用「秒 → 像素」单一口径换算，缩放只改一个变量，拖拽裁剪都跟着走。 */
/* 一张纸 + 分隔线，不是一堆卡片。
   之前是「间隙 9px + 每块自带边框 + 底色差」三重分隔叠加，所以看着一块一块。
   现在：整屏纯白连成一片，面板之间只靠 1px 线分隔，间隙归零。 */
.ed{flex:1;min-height:0;display:flex;flex-direction:column;gap:0;
  background:#FFFFFF;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ed-main{flex:1 1 auto;min-height:170px;display:grid;
  grid-template-columns:clamp(170px,17%,230px) minmax(0,1fr) clamp(190px,19%,250px);gap:0}
/* 面板之间只留一条线，不再各画一圈框 */
.ed-main>*{border-radius:0!important}
.ed-main>*+*{border-left:1px solid var(--line)}

/* 打开成片浮层：列出导出过的 mp4，点一下就导进当前工程 */
.ed-wk-modal{position:fixed;inset:0;z-index:370;display:none;
  align-items:center;justify-content:center;background:rgba(16,22,32,.46);
  backdrop-filter:blur(2px)}
.ed-wk-modal.on{display:flex}
.ed-wk-box{width:min(660px,90vw);max-height:78vh;display:flex;flex-direction:column;
  background:#FFF;border-radius:13px;overflow:hidden;
  box-shadow:0 24px 60px -16px rgba(20,30,50,.28)}
.ed-wk-hd{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:13px 16px;
  border-bottom:1px solid var(--line)}
.ed-wk-hd b{flex:1;font-size:14px;font-weight:600;color:var(--ink)}
.ed-wk-hd span{font-size:11.5px;color:var(--ink3)}
.ed-wk-hd button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  font-size:17px;font-weight:300;color:var(--ink3);background:var(--hover)}
.ed-wk-hd button:hover{background:#E8ECF3;color:var(--ink)}
.ed-wk-list{flex:1 1 auto;min-height:0;overflow:auto;padding:8px}
.ed-wk-e{padding:26px 12px;text-align:center;font-size:12.5px;color:var(--ink3);line-height:1.9}
.ed-wk-i{display:flex;align-items:center;gap:11px;width:100%;padding:7px 8px;
  border-radius:9px;text-align:left}
.ed-wk-i:hover{background:var(--accent-soft)}
.ed-wk-i .th{flex:0 0 auto;width:74px;height:44px;border-radius:6px;overflow:hidden;
  background:#EEF2F7;display:grid;place-items:center;color:var(--ink3)}
.ed-wk-i .th img{width:100%;height:100%;object-fit:cover;display:block}
.ed-wk-i .th .ic{width:18px;height:18px}
.ed-wk-i .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ed-wk-i .tx b{font-size:13px;font-weight:500;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-wk-i .tx i{font-size:11px;font-style:normal;color:var(--ink3);
  font-variant-numeric:tabular-nums}

/* 素材池 */
.ed-pool{display:flex;flex-direction:column;min-height:0;background:#fff;
  border-radius:var(--r-md);overflow:hidden}
.ed-pool-h{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 10px;
  border-bottom:1px solid var(--line);font-size:var(--f5);font-weight:600;color:var(--ink)}
.ed-pool-h .u-btn{margin-left:auto;height:23px;padding:0 8px;font-size:10.5px}
.ed-pool-b{flex:1 1 auto;min-height:0;overflow-y:auto;padding:7px;display:flex;
  flex-direction:column;gap:6px;scrollbar-width:thin}
/* 素材列表是一列行，不是一列卡片：每项自带一圈框，八项就是八个盒子。
   改成行：无框、无圆角、只留行间一条淡线；hover 用极淡底提示。 */
.ed-as{display:flex;align-items:center;gap:7px;padding:7px 8px;border:0;
  border-bottom:1px solid var(--line-w);border-radius:0;cursor:grab;
  background:transparent;font-size:12px;line-height:1.3}
.ed-as:hover{background:#F5F7FA}
.ed-as:last-child{border-bottom:0}
.ed-as:active{cursor:grabbing}
.ed-as .ic{width:14px;height:14px;flex:0 0 auto;color:#8A92A2}
.ed-as .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-as .du{flex:0 0 auto;font-size:10.5px;color:var(--ink3)}
.ed-as.video .ic{color:#2E9E76}.ed-as.audio .ic{color:#2563EB}
.ed-as.image .ic{color:#5A8FD6}
.ed-pool-e{color:var(--ink3);font-size:10.5px;text-align:center;padding:16px 8px;line-height:1.7}

/* 预览 */
.ed-pv{display:flex;flex-direction:column;min-height:0;background:#0B1119;
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;position:relative}
.ed-stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
  padding:10px;position:relative}
.ed-stage video,.ed-stage img{max-width:100%;max-height:100%;object-fit:contain;display:block;
  border-radius:4px;background:#000}
/* 模板预览：模板内部按自己的 1920x1080 坐标系画，iframe 保持这个尺寸。
   ★ 必须有 translate(-50%,-50%) 从中心对齐 —— 少了它，left/top:50% 会让
   iframe 的左上角钉在容器中心，画面整体往右下延伸（用户说的「画面跑到右下角」）。
   具体缩放比由 JS 按 layer 像素尺寸算成 --tpl-fit，跟导出端 contain 口径一致。 */
.ed-stage iframe.ed-tpl{position:absolute;left:50%;top:50%;
  width:1920px;height:1080px;border:0;border-radius:4px;background:#000;
  transform-origin:center center;display:block;
  transform:translate(-50%,-50%) scale(var(--tpl-fit,1))}
.ed-stage .ph{color:#5E6B7C;font-size:12px;text-align:center;line-height:1.9;padding:20px}
.ed-bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;
  border-top:1px solid rgba(255,255,255,.09);color:#D6DCE6;font-size:10.5px}
.ed-bar button{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  color:#D6DCE6;background:transparent;border:0;cursor:pointer}
.ed-bar button:hover{background:rgba(255,255,255,.1)}
.ed-bar .tm{font-variant-numeric:tabular-nums;letter-spacing:.4px}
.ed-bar .u-btn{margin-left:auto;height:26px;padding:0 10px;font-size:10.5px;
  background:#2563EB;border-color:#2563EB;color:#fff}
.ed-bar .u-btn:hover{background:#16786C}
/* 预览缩放三件套：适应 / 缩小 / 放大。跟时间线的「缩放」（只管 pps）是两回事。 */
.ed-bar .pvbtn{width:auto;min-width:26px;height:26px;padding:0 7px;border-radius:8px;
  font-size:10.5px;color:#D6DCE6;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);cursor:pointer}
.ed-bar .pvbtn:hover{background:rgba(37,99,235,.3);border-color:rgba(37,99,235,.5)}

/* 属性 */
.ed-insp{display:flex;flex-direction:column;min-height:0;background:#fff;
  border-radius:var(--r-md);overflow:hidden}
.ed-insp-h{flex:0 0 auto;padding:8px 10px;border-bottom:1px solid var(--line);
  font-size:var(--f5);font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
.ed-insp-b{flex:1 1 auto;min-height:0;overflow-y:auto;padding:9px 10px;
  display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
.ed-insp .row{display:flex;flex-direction:column;gap:3px}
.ed-insp label{font-size:10.5px;color:var(--ink3)}
.ed-insp input[type=text],.ed-insp input[type=number],.ed-insp select{
  height:26px;padding:0 7px;
  font-size:12px;color:var(--ink);width:100%}
.ed-insp input[type=color]{height:26px;padding:1px;border:1px solid var(--line-c);
  border-radius:8px;background:#fff;width:100%}
.ed-insp input[type=range]{width:100%}
.ed-insp .two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ed-insp .hint{font-size:10.5px;color:var(--ink3);line-height:1.65;text-align:center;padding:14px 4px}
.ed-insp .del{height:26px;border-radius:8px;border:1px solid #F0D5CF;background:#FFF6F4;
  color:#C4553F;font-size:10.5px;cursor:pointer;margin-top:2px}
.ed-insp .del:hover{background:#FDECE8}

/* 时间线 */
.ed-tl{flex:0 0 auto;min-height:0;display:flex;flex-direction:column;
  background:#fff;border-top:1px solid var(--line)}
.ed-tl-h{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 10px;
  border-bottom:1px solid var(--line);font-size:var(--f5);color:var(--ink)}
.ed-tl-h .u-btn{height:23px;padding:0 8px;font-size:10.5px}
.ed-tl-h .u-btn.primary{background:#2563EB;color:#fff;border-color:#2563EB;font-weight:600}
.ed-tl-h .u-btn.primary:hover{background:#1D4ED8;color:#fff}
.ed-tl-h .sp{flex:1 1 auto}
.ed-tl-h .zoom{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink3)}
.ed-tl-h input[type=range]{width:80px}
.ed-scroll{flex:0 1 auto;overflow:auto;position:relative;scrollbar-width:thin;
  /* 轨道名列宽：拖右边缘的手柄可改，并记进 localStorage，下次打开还是这个宽度。
     JS 的 LANE_W 从存储读取，这里是首次打开（没存过）的默认值：108px。 */
  --lane-w:128px;
  /* 至少完整显示刻度 + 四条轨（20 + 4×32 = 148），否则音频轨会被切掉一半，
     看着像界面断了。轨道更多时才出现滚动条。 */
  min-height:148px;max-height:min(46vh,360px)}
.ed-inner{position:relative;min-width:100%}
.ed-ruler{position:sticky;top:0;z-index:3;height:20px;min-width:100%;background:#FFFFFF;
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.ed-ruler .tk{position:absolute;top:0;height:100%;border-left:1px solid #E8ECF3;
  font-size:10.5px;color:#9AA2B1;padding-left:3px;line-height:20px;white-space:nowrap}
.ed-lane{display:flex;align-items:stretch;border-bottom:1px solid #F1F4F8;min-height:32px}
/* 轨道名列默认 108px、可拖动调宽窄并记忆：把「加片段 / 锁 / 静音 / 删除」都集成在这一栏，
   不用再跑到上面工具栏找。原来 62px 塞不下，红叉 hover 时被挤没了。 */
.ed-lane-lb{flex:0 0 var(--lane-w,128px);position:sticky;left:0;z-index:2;background:#FFFFFF;
  border-right:1px solid var(--line);display:flex;align-items:center;gap:3px;
  padding:0 4px 0 6px;font-size:10.5px;color:var(--ink3);white-space:nowrap;overflow:hidden}
/* 轨道名栏右边缘的拖拽手柄：往左拖只留图标、往右拖显示文字。
   每条轨道栏右缘各有一个，视觉上连成一条竖线；拖任意一个都改同一个宽度。 */
.ed-lane-lb .lb-resize{position:absolute;right:0;top:0;bottom:0;width:7px;
  cursor:col-resize;z-index:6;background:transparent}
.ed-lane-lb .lb-resize:hover,.ed-lane-lb .lb-resize.on{background:rgba(37,99,235,.4)}
/* 窄栏（<100px）时把轨道名藏掉，只留图标和按钮——这样内容区不会被挤没。 */
.ed-lane-lb .ic{width:11px;height:11px;flex:0 0 auto}
.ed-lane-b{flex:1 1 auto;position:relative;min-height:32px}
.ed-cl{position:absolute;top:3px;height:30px;border-radius:4px;overflow:hidden;
  font-size:10.5px;line-height:1;display:flex;align-items:center;padding:0 6px;
  cursor:grab;user-select:none;border:1px solid var(--line-c);
  white-space:nowrap;text-overflow:ellipsis;box-sizing:border-box}
.ed-cl:active{cursor:grabbing}
.ed-cl.video{background:#EFF4FF;border-color:#A8C4F8;color:#1D4ED8}
.ed-cl.audio{background:#FEF6E7;border-color:#EBD9B4;color:#8A5A12}
.ed-cl.image{background:#E8F0FB;border-color:#C5D9F2;color:#2C5C99}
.ed-cl.text{background:#F4EFFB;border-color:#DCCDF2;color:#5B3E8E}
.ed-cl.template{background:#EFF4FF;border-color:#A8C4F8;color:#1D4ED8}
.ed-cl.on{outline:2px solid #2563EB;outline-offset:-1px;box-shadow:0 2px 8px rgba(37,99,235,.25)}
.ed-cl .h{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:2}
.ed-cl .h.l{left:0}.ed-cl .h.r{right:0}
.ed-cl .h:hover{background:rgba(37,99,235,.35)}
.ed-play{position:absolute;top:0;bottom:0;width:9px;margin-left:-4px;background:transparent;
  z-index:4;cursor:ew-resize}
.ed-play::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:1px;background:#C4553F}
.ed-play::before{content:"";position:absolute;top:0;left:0;width:9px;height:9px;
  background:#C4553F;border-radius:0 0 50% 50%}
.ed-drop{position:absolute;inset:0;border:2px dashed transparent;pointer-events:none}
.ed-lane-b.over .ed-drop{border-color:#2563EB;background:rgba(37,99,235,.05);border-radius:4px}
/* 模板没有官方缩略图时的兜底：渐变底 + 名字，别显示碎图 */
/* 每个模板卡都先铺一层 16:9 占位底，有图再把图盖上去。
   这样没图的、图挂了，都不会出现碎图或空白塌陷 —— 448 个模板里只有 178 个有官方图。 */
.ed-tp .thumb{position:relative;width:100%;aspect-ratio:16/9;background:#EEF2F7;overflow:hidden}
.ed-tp .nopic-ph{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  background:linear-gradient(135deg,#1E2634,#2C3748);color:#C8D2E0}
.ed-tp .nopic-ph b{font-size:10.5px;font-weight:600;color:#7FD3C4;letter-spacing:.5px}
.ed-tp .nopic-ph i{font-size:10.5px;color:#7A879C;font-style:normal;max-width:92%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-tp .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

.ed-tip{padding:22px;text-align:center;color:var(--ink3);font-size:12px;line-height:1.9}

/* 模板库：居中悬浮框（原来是 430px 右侧抽屉，两列小卡片，
   用户原话「空间大一点显示的也完整」）。
   现在 92vw 宽、四列，一屏能看 24 张，行高按内容自适应。 */
.ed-lib{position:fixed;left:50%;top:50%;z-index:120;
  width:min(1180px,92vw);height:min(760px,88vh);
  background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 24px 70px rgba(16,24,40,.26);
  display:none;flex-direction:column;
  transform:translate(-50%,-50%) scale(.985);opacity:0;
  transition:opacity .18s,transform .18s}
.ed-lib.open{display:flex;transform:translate(-50%,-50%) scale(1);opacity:1}
/* 背后压一层暗色，让悬浮框自己立起来 */
.ed-lib-mask{position:fixed;inset:0;z-index:119;background:rgba(14,20,32,.34);
  display:none;opacity:0;transition:opacity .18s}
.ed-lib-mask.open{display:block;opacity:1}
.ed-lib-h{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:13px 16px;
  border-bottom:1px solid var(--line);font-size:var(--f4);font-weight:600;
  border-radius:14px 14px 0 0;background:#FFFFFF}
.ed-lib-h .u-btn{margin-left:0}
.ed-lib-h .u-btn{margin-left:auto;height:25px;padding:0 9px;font-size:10.5px}
.ed-lib-s{flex:0 0 auto;display:flex;gap:6px;padding:8px 12px 6px}
.ed-lib-s input{flex:1 1 auto;height:30px;
  padding:0 10px;font-size:12.5px}
/* 分类单行横滚：11 个分类折两行要占 70px，横滚只占 26px。
   滚动条压到看不见（触控板和 shift 滚轮都能滚），不留一道灰杠破坏观感。 */
.ed-lib-cats{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:5px;margin:0;
  padding:0 16px 11px}
.ed-lib-cats button{flex:0 0 auto}
.ed-lib-b{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 11px 14px;
  display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.ed-tp{flex:0 0 calc(25% - 6px);max-width:calc(25% - 6px);box-sizing:border-box;
  border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;
  display:flex;flex-direction:column}
.ed-tp .thumb img{background:#EEF2F7}
/* 卡片只留：缩略图 + 标题 + 两个按钮。原来还有一行两行截断的描述，
   占 29px 高、且被截得只剩半句话（用户原话「太多的垃圾信息」）。
   完整描述挂到 title 上，鼠标停一下就有。 */
.ed-tp .bd{padding:5px 6px 6px;display:flex;flex-direction:column;gap:4px;min-height:0}
.ed-tp b{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;line-height:1.3}
.ed-tp .row{display:flex;gap:4px}
.ed-tp .row button{flex:1 1 0;min-width:0}
.ed-tp button{height:24px;border-radius:7px;border:1px solid var(--line);background:#FFFFFF;
  font-size:11px;color:#4A5262;cursor:pointer;padding:0 4px}
.ed-tp button:hover{background:#EAF6F3;border-color:#A8C4F8;color:#0F6B60}
.ed-tp button[data-n]{background:#fff;border-color:#D8E2DC;color:#1B7A6E;font-weight:600}
.ed-tp button[data-n]:hover{background:#2563EB;border-color:#2563EB;color:#fff}
/* 缩略图整块可点，等一下就有反应，鼠标要给出这个暗示 */
.ed-tp .thumb{cursor:pointer;position:relative}
.ed-tp .thumb:hover::after{content:"";position:absolute;inset:0;
  box-shadow:inset 0 0 0 2px #2563EB;border-radius:0;pointer-events:none}
/* 有官方预览片的角上带个播放标：用户一眼分得清哪些能立刻看 */
.ed-tp .thumb .pv{position:absolute;right:6px;bottom:6px;width:20px;height:20px;
  border-radius:50%;background:rgba(20,28,42,.62);display:flex;align-items:center;
  justify-content:center;backdrop-filter:blur(1px)}
.ed-tp .thumb .pv .ic{width:11px;height:11px;color:#fff}
.ed-lib-tip{flex:0 0 auto;padding:8px 13px 10px;border-top:1px solid var(--line);
  background:#FFFFFF;font-size:10.5px;color:var(--ink3);line-height:1.65}

/* 模板卡片上的「先看看」按钮 + 试用弹窗 */
.ed-tp .bd .peek{width:100%;height:26px;margin-bottom:5px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:12px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.ed-tp .bd .peek:hover{border-color:#2563EB;color:#2563EB;background:#F6FBFA}
.ed-tp .bd .peek .ic{width:12px;height:12px}
.ed-lib-cats button{height:26px;padding:0 10px;border:1px solid #E3E9F1;background:#FFF;
  border-radius:12px;font-size:12px;color:#5A6473;cursor:pointer;line-height:1;
  display:inline-flex;align-items:center;gap:4px;transition:.14s}
.ed-lib-cats button:hover{border-color:#BFD8D2;color:#2563EB}
.ed-lib-cats button.on{background:#2563EB;border-color:#2563EB;color:#FFF;font-weight:600}
.ed-lib-cats button em{font-style:normal;font-size:10.5px;opacity:.62}
.ed-lib-cats button.on em{opacity:.8}

.ed-tp .catb{position:absolute;left:7px;top:7px;z-index:2;padding:1px 6px;border-radius:4px;
  background:rgba(22,30,42,.62);color:#FFF;font-size:10.5px;line-height:16px;letter-spacing:.02em;
  backdrop-filter:blur(4px)}
/* 原来这里是「说明段 + 同步条 + 品牌条」三块竖着排，占掉 100 多像素。
   现在压成一行：状态点 + 一句话 + 同步 + 品牌色开关 + 色块。 */
.ed-lib-state{flex:0 0 auto;display:flex;align-items:center;gap:7px;margin:0 12px 8px;

/* ══════════ 剪映式升级：多轨合成预览 / 关键帧 / 轨道控制 ══════════ */
/* 预览不再只显示「一个」片段，而是把当前时刻命中的所有片段按 z 叠成一张画面。
   容器固定按工程分辨率(默认1920x1080)排版，再整块 scale 缩进预览框，
   跟模板 iframe 的做法一致 —— 编辑器里看到的和导出的构图才对得上。 */
.ed-stage .ed-compose{position:absolute;left:50%;top:50%;transform-origin:center center;
  overflow:hidden;background:#000;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.ed-layer{position:absolute;transform-origin:center center;overflow:hidden;
  box-sizing:border-box;pointer-events:none}
.ed-layer video,.ed-layer img,.ed-layer .ed-tpl{width:100%;height:100%;
  object-fit:cover;display:block;border:0;background:transparent}
.ed-layer .ed-tpl{position:absolute;left:0;top:0}
/* 文字层：跟导出端 .vl-tx 同一套排版口径（居中、可换行、深色底衬、描边阴影）。
   width/height 交给 edApplyXform 设成 auto，靠 translate(-50%,-50%) 定位到 x/y。 */
.ed-layer.text{overflow:visible;pointer-events:auto;cursor:move}
/* ★ 模板层必须能吃到指针事件，否则「在画面上直接点文字改」永远是死的。
   默认 .ed-layer 是 pointer-events:none（纯展示，不挡时间线操作），
   结果就是模板 iframe 里注入的点选脚本拿不到真实鼠标 —— 合成事件能触发、
   真人点一点反应都没有，这种 bug 在 CDP 里派事件是查不出来的。
   模板层给 auto、光标给 text，用户一看就知道这儿能改。
   多个模板叠在同一时刻时只有最上层能点，这与「看到的就是最上面那个」一致。 */
.ed-layer.template{pointer-events:auto;cursor:text}
.ed-layer.text .ed-text{cursor:move}
/* 逐字动效拆出来的单字：必须是 inline-block 才吃得下 transform，
   否则 translateY/scale 对行内元素无效，一个都不会动。 */
.ed-layer .ed-ch{display:inline-block;white-space:pre}
/* 拖动预览里的文字时给个细框，让人知道抓住了哪一层 */
.ed-layer.text.drag{outline:1px dashed rgba(37,99,235,.55);outline-offset:4px}
/* 逐字动效拆出来的单字。inline-block 才能吃 transform；white-space:pre 保住
   字与字之间的空白（拆 span 后普通空格会塌掉）。 */
.ed-layer.text .ed-ch{display:inline-block;white-space:pre}
.ed-layer.text .ed-ch[style*="visibility:hidden"]{visibility:hidden}
.ed-layer .ed-text{display:block;padding:10px 24px;border-radius:12px;
  background:rgba(10,16,24,.58);box-shadow:0 6px 26px rgba(0,0,0,.22);
  text-shadow:0 2px 12px rgba(0,0,0,.45);backdrop-filter:blur(2px);
  white-space:pre-wrap;word-break:break-word;text-align:center;line-height:1.35;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.ed-cl .ed-inline{position:absolute;left:2px;right:2px;top:2px;bottom:2px;
  border:1px solid #1D4ED8;border-radius:4px;background:#fff;color:#1B2A2E;
  font-size:11px;padding:0 6px;outline:none;box-shadow:0 2px 8px rgba(20,60,55,.18);
  box-sizing:border-box;z-index:5;cursor:text;user-select:text}
/* 关键帧菱形：落在片段内部，按 at(0~1) 定位；点一下播放头跳到那一帧。 */
.ed-kf{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
  background:#C4553F;border:1px solid #fff;border-radius:2px;transform:rotate(45deg);
  z-index:3;cursor:pointer;box-shadow:0 0 0 1px rgba(196,85,63,.3)}
.ed-kf:hover{background:#8E3524;transform:rotate(45deg) scale(1.25)}
.ed-cl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
/* 轨道名那一列：锁 / 静音 / 删除，默认藏起来，hover 轨道才出现，省地方。 */
/* 轨道名：等宽数字 + 居中 + 固定宽，四条轨名字视觉等长 */
.ed-lane-lb .lb-nm{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:clip;

.ed-lane-lb .lb-t .ic{width:13px;height:13px}
.ed-lane-lb .lb-t:hover{background:#fff;border-color:rgba(37,99,235,.28);
  color:#1D4ED8;box-shadow:0 2px 5px rgba(20,60,55,.13);transform:translateY(-1px)}
.ed-lane-lb .lb-t:active{transform:translateY(0);box-shadow:none}
.ed-lane-lb .lb-t.on{color:#1D4ED8;border-color:rgba(37,99,235,.3);background:rgba(37,99,235,.1)}
/* 加片段按钮：常显，绿底 */

/* 静音：红调 */

.ed-lane-lb .lb-del:hover{background:#fff;border-color:rgba(168,99,79,.38);

/* 时间线工具条分组 */
.ed-tl-h .tlsep{width:1px;height:15px;background:var(--line);margin:0 1px}
/* 属性面板：变换分区 + 关键帧列表 */

/* 打帧按钮：空心=没打，实心红=当前位置已有该属性关键帧。 */
.ed-insp .kfbtn{flex:0 0 auto;width:22px;height:22px;border:1px solid var(--line);

         被砍掉的东西去了哪：那段落解释文案挪进搜索框的 placeholder 和卡片
         的 title；「整场戏/片段」下拉跟分类按钮重复，删掉（分类里本来就有
         这两个概念的替代——按场景分类比按技术形态分类更好用）。 -->
    <div class="ed-lib-s">
      <input id="edLibQ" placeholder="搜模板（中文直接搜：片头 / 转场 / 字幕 / 图表…）">
    </div>
    <div class="ed-lib-cats" id="edLibCats"></div>
    <div class="ed-lib-state">
      <span class="dot" id="edSrcDot"></span>
      <span class="tx" id="edSrcTx">检查本地模板库…</span>
      <button class="u-btn" id="edSrcSync" title="从镜像重新拉一份模板库，约 139MB">同步</button>
      <label class="bc" title="勾上后装模板时把模板的强调色换成客户品牌色。模板配色是它的设计语言，默认不换。">
        <input type="checkbox" id="edUseBrand"><span>品牌色</span>
      </label>
      <span class="lc" id="edBrandSw"></span>
    </div>
    <div class="ed-lib-b" id="edLibGrid"><div class="ed-tip">输入关键词搜一下</div></div>
    <div class="ed-lib-tip">装进工程后是可改的源码，落在工程 compositions 目录里，不是黑盒。</div>
  </div>

  <!-- 模板试用弹窗：装之前先看清楚它是什么、动起来什么样 -->
  <div class="ed-try" id="edTry">
    <div class="ed-try-box">
      <div class="ed-try-h"><b id="edTryName">模板</b>
        <span id="edTryKind">整场戏</span>
        <button class="u-btn" id="edTryClose">关闭</button></div>
      <div class="ed-try-v" id="edTryView"><div class="ed-tip">加载中…</div></div>
      <div class="ed-try-f">
        <div class="ed-try-d" id="edTryDesc"></div>
        <div class="ed-try-a">
          <button class="u-btn" id="edTryAdd">装进工程</button>
        </div>
      </div>
    </div>
  </div>
<!-- 打开成片浮层。挂在页面最外层：放进 .ed 或工具栏里会跟着栅格高度被挤没。 -->
<div class="ed-wk-modal" id="edWkModal">
  <div class="ed-wk-box" role="dialog" aria-modal="true" aria-label="打开成片">
    <div class="ed-wk-hd">
      <b>打开成片</b>
      <span>点一条就导进当前工程当素材</span>
      <button type="button" id="edWkX" aria-label="关闭">×</button>
    </div>
    <div class="ed-wk-list" id="edWkList"></div>
  </div>
</div>

</section>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};

    /* 出片预设：从「品牌资产」页拆过来，放在真正用得到的地方 —— 导出前。
   一条预设 = 画幅 × 时长 × 引用哪个技能，选完画幅自动跟着改，
   这样用户在品牌页配置的规格，出片这一刻才真正落到手上。 */
/* 品牌色：从「品牌资产」页配的套件里取主色（colors[0]），
   装模板时如果用户勾了「用品牌色跑模板」，就把模板主色换掉。
   默认不勾 —— 模板的配色是它的设计语言，无脑替换会让所有模板长一样。 */
window.__ED_BRAND = "";
function edLoadBrand(){
  var sw=$('#edBrandSw'), tx=$('#edSrcTx'), bar=$('#edBrandBar');
  if(!sw||!tx)return;
  window.api('/api/brand',{action:'bootstrap'}).then(function(d){
    var kits=(d&&d.kits)||[];
    var cur=kits.filter(function(k){return k.current})[0]||kits[0]||{};
    var cs=(cur.colors||[]).filter(function(c){return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(String(c.hex||'').trim())});
    if(!cs.length){
      sw.style.background='#EEE';
      sw.title='当前客户还没设品牌配色（去「品牌资产」加）';
      return;
    }
    var main=String(cs[0].hex||'').trim();
    window.__ED_BRAND=main;
    window.__ED_COLORS=cs;
    /* 品牌「主色」常常是近黑的漆墨色（示例客户就是 #1E2430），拿去换模板
       主色整个画面会发黑。这里跟后端判断保持一致，提前把「实际会用哪个色」
       告诉用户，免得装完了才发现颜色不对还得再查。 */
    function lum(h){
      h=String(h||'').replace('#','');
      if(h.length===3)h=h.split('').map(function(c){return c+c}).join('');
      if(h.length!==6)return null;
      var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
      var mx=Math.max(r,g,b),mn=Math.min(r,g,b);
      return {mx:mx,mn:mn,gray:(mx-mn)<22||mx<40||mn>225};
    }
    var use=cs[0], note='';
    if(lum(main)&&lum(main).gray){
      var pick=cs.filter(function(c){
        return /强调|点缀|识别|品牌色/i.test(c.name||'')&&lum(c.hex)&&!lum(c.hex).gray;
      })[0];
      if(!pick){
        var best=null,bs=-1;
        cs.forEach(function(c){
          var L=lum(c.hex);if(!L||L.gray)return;
          var s2=(L.mx-L.mn)/255;
          if(s2>bs){bs=s2;best=c}
        });
        pick=best;
      }
      if(pick){use=pick;note='（主色太深，实际用'+(pick.name||'强调色')+'）'}
      else{note='（主色太深，建议加一个鲜艳的强调色）'}
    }
    sw.style.background=use.hex;
    window.__ED_USE=String(use.hex||'').trim();
    /* 品牌色不再单独占一行文字说明，改挂 title —— 顶部每一行都要省着用。
       想知道具体用哪个色，鼠标停一下色块就有。 */
    sw.title=use.hex+(use.name?' '+use.name:'')+(note?'（主色太深，已改用强调色）':'')+' · 模板按这个色跑';
  }).catch(function(){});
}
$('#edUseBrand') && $('#edUseBrand').addEventListener('change',function(){
  var bar=$('#edBrandBar');
  if(bar)bar.classList.toggle('on',this.checked);
  if(this.checked&&!window.__ED_BRAND)say('这个客户还没设品牌配色');
});

function edFillPresets(){
  var sel=$('#edPreset');if(!sel)return;
  window.api('/api/brand',{action:'bootstrap'}).then(function(d){
    var ps=(d&&d.presets)||[];
    sel.innerHTML='<option value="">出片预设：不用</option>'+ps.map(function(p){
      return '<option value="'+esc(p.id)+'" data-ratio="'+esc(p.ratio||'')+
        '" data-dur="'+esc(p.duration||'')+'">'+esc(p.name)+
        (p.ratio?' · '+esc(p.ratio):'')+'</option>';
    }).join('');
  }).catch(function(){});
}
document.addEventListener('DOMContentLoaded',edFillPresets);
setTimeout(edFillPresets,1500);
$('#edPreset') && $('#edPreset').addEventListener('change',function(){
  var o=this.options[this.selectedIndex];if(!o)return;
  var r=(o.getAttribute('data-ratio')||'').trim();
  var sz=$('#edSize');
  if(r&&sz){
    // 预设里的画幅写的是「16:9」这类比例，映射到下拉里的具体尺寸
    var m={'16:9':'1920x1080','9:16':'1080x1920','1:1':'1080x1080','4:3':'1280x960'};
    var hit=m[r]||'';
    if(!hit){
      var mm=r.match(/^(\d+)\s*[x×:]\s*(\d+)$/);
      if(mm)hit=parseInt(mm[1])+'x'+parseInt(mm[2]);
    }
    if(hit&&[].some.call(sz.options,function(x){return x.value===hit}))sz.value=hit;
    else if(hit){sz.options[sz.options.length]=new Option(hit+'（预设）',hit);sz.value=hit;}
  }
  if(o.value)say('用预设「'+(o.textContent||'').split(' · ')[0]+'」出片');
});

  /* 轨道名列宽（px）。CSS .ed-lane-lb 的 flex-basis 与这里必须一致：
     时间刻度、播放头、滚轮定位都按它算偏移。加宽是为了把「＋/锁/静音/删除」集成进轨道栏。
     ★ 拖过的宽度记进 localStorage，下次打开还是用户调的；没存过默认 108px。 */
  var LANE_KEY='riffcut.edit.laneWidth';
  function laneStored(){try{var v=parseInt(localStorage.getItem(LANE_KEY)||'',10);
      return v>=100&&v<=128?v:128}catch(e){return 128}}
  var LANE_W=laneStored();
  var ED={proj:null,data:null,assets:[],sel:null,pps:60,zoom:1,t:0,playing:false,dirty:false,
          compose:null,layers:{},kf:{track:null,i:null,prop:'x'},pvScale:1};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function say(m){window.say(m)}
  function fmt(s){s=Math.max(0,+s||0);var m=Math.floor(s/60),x=Math.floor(s%60);
    return ('0'+m).slice(-2)+':'+('0'+x).slice(-2)}

  /* ═══════ 关键帧引擎（前端预览用，导出仍以后端 GSAP 为准）═══════
     语义跟 timeline.js 的 keyTweens() 完全一致：
       · keys[].at 是「片段内进度 0~1」，片段挪动/改长时关键帧跟着走；
       · 每个点记录「到达这里时的目标值」，点之间用目标点的 ease 插值；
       · 没有该属性的关键帧 → 用片段上的基础属性。
     这样预览里看到的运动，就是导出后的运动，不会「剪的时候是一个样、出片又一个样」。 */
  var KF_PROPS=['x','y','w','h','scale','rotate','opacity','radius'];
  var KF_LABEL={x:'横向位置',y:'纵向位置',w:'宽度',h:'高度',scale:'缩放',rotate:'旋转',opacity:'不透明度',radius:'圆角'};
  function edNum(v,d){v=+v;return isFinite(v)?v:d}
  function edEase(name,p){
    p=Math.max(0,Math.min(1,p));
    var n=String(name||'power2.inOut').toLowerCase();
    if(n.indexOf('linear')>=0)return p;
    var sine=n.indexOf('sine')>=0, expo=n.indexOf('expo')>=0;
    var m=n.match(/power([1-4])/), pow=m?+m[1]:2;
    function f(t){
      if(t<=0)return 0;if(t>=1)return 1;
      if(sine)return 1-Math.cos(t*Math.PI/2);
      if(expo)return Math.pow(2,10*(t-1));
      return Math.pow(t,pow);
    }
    var hasIn=n.indexOf('.in')>=0||n.indexOf('inout')>=0||n==='in';
    var hasOut=n.indexOf('.out')>=0||n.indexOf('inout')>=0||n==='out';
    if(hasIn&&hasOut)return p<0.5?f(2*p)/2:1-f(2*(1-p))/2;
    if(hasOut&&!hasIn)return 1-f(1-p);
    return f(p);
  }
  function edKeyPoints(c,k){
    var base={x:edNum(c.x,0.5),y:edNum(c.y,0.5),w:edNum(c.w,1),h:edNum(c.h,1),
      scale:edNum(c.scale,1),rotate:edNum(c.rotate,0),opacity:edNum(c.opacity,1),radius:edNum(c.radius,0)};
    var pts=[{at:0,v:base[k],ease:'power2.inOut',base:true}];
    (c.keys||[]).forEach(function(kk){
      if(!kk||kk[k]==null||kk.at==null)return;
      var v=+kk[k];if(!isFinite(v))return;
      pts.push({at:Math.max(0,Math.min(1,+kk.at)),v:v,ease:kk.ease||'power2.inOut'});
    });
    pts.sort(function(a,b){return a.at-b.at});
    var uniq=[];
    pts.forEach(function(q){
      if(uniq.length&&Math.abs(uniq[uniq.length-1].at-q.at)<1e-6)uniq[uniq.length-1]=q;
      else uniq.push(q);
    });
    return uniq;
  }
  function edEvalKF(c,t){
    var s=+c.start||0,len=edClipLen(c);
    var p=len>0?(t-s)/len:0;
    p=Math.max(0,Math.min(1,p));
    var out={};
    KF_PROPS.forEach(function(k){
      var pts=edKeyPoints(c,k),val=pts[0].v;
      for(var i=1;i<pts.length;i++){
        var a=pts[i-1],b=pts[i];
        if(p>=b.at){val=b.v;continue}
        if(p>=a.at){
          var span=Math.max(1e-6,b.at-a.at);
          var e=edEase(b.ease,(p-a.at)/span);
          val=a.v+(b.v-a.v)*e;
          break;
        }
      }
      out[k]=val;
    });
    return out;
  }
  /* ── 预览端动效 ──
     用户原话：「现在文字的动效没有生效」。
     根因：导出端 timeline.js 的 tweens() 一直在算 ANIM_PRESETS，但 edPreview() 从头到尾
     没读过 c.anim —— 面板上点「淡入淡出/上滑入」只写进了 clip 对象，预览画面一动不动。
     这里把 ANIM_PRESETS 的同一套口径（进场 DUR_IN=0.5 / 出场 DUR_OUT=0.35 / 位移量与缩放
     终值）复刻到预览端，两边才不会「编辑器里看着是下滑淡入、成片出去是硬切」。
     ★ 有 c.keys 关键帧时不能再叠预设位移：两套都在动 x/y，会互相顶掉（导出端同样处理）。 */
  var ED_ANIM={
    fade:      {in:{},           out:{}},
    slideUp:   {in:{y:40},       out:{y:-40}},
    slideDown: {in:{y:-40},      out:{y:40}},
    slideLeft: {in:{x:60},       out:{x:-60}},
    slideRight:{in:{x:-60},      out:{x:60}},
    zoomIn:    {in:{s:1.18},     out:null},
    zoomOut:   {in:{s:0.86},     out:null},
    kenburns:  {in:null,         out:null},
    charIn:    {in:null,         out:null},
    typewriter:{in:null,         out:null}
  };
  var ED_DUR_IN=0.5,ED_DUR_OUT=0.35;
  function edOut3(q){return 1-Math.pow(1-Math.max(0,Math.min(1,q)),3)}
  function edIn2(q){return Math.pow(Math.max(0,Math.min(1,q)),2)}
  /* 返回 {a: 透明度乘数, dx, dy: 像素偏移, s: 缩放乘数} */
  function edAnimState(c,t){
    var st={a:1,dx:0,dy:0,s:1};
    if(!c)return st;
    var lt=Math.max(0,t-(+c.start||0));
    var len=Math.max(0.2,edClipLen(c));
    var p=String(c.anim||'').trim();
    var P=ED_ANIM[p]||null;
    var hasKeys=Array.isArray(c.keys)&&c.keys.length;
    var fi=edNum(c.fadeIn,0),fo=edNum(c.fadeOut,0);
    var pin=hasKeys?null:(P?P.in:null),pout=hasKeys?null:(P?P.out:null);
    var dIn=fi>0?fi:(pin?ED_DUR_IN:0);
    var dOut=fo>0?fo:(pout?ED_DUR_OUT:0);
    /* 进场：导出端 dIn>0 时 from 的 opacity 一律兜成 0，所以只要 dIn>0 就一定有淡入 */
    if(dIn>0&&lt<dIn){
      var q=lt/dIn,e=edOut3(q);
      st.a*=e;
      if(pin){
        if(pin.x)st.dx+=pin.x*(1-e);
        if(pin.y)st.dy+=pin.y*(1-e);
        if(pin.s)st.s*=1+(pin.s-1)*(1-e);
      }
    }
    /* 出场：退场比进场短，收尾才不拖（与导出端 EASE_OUT=power2.in 一致） */
    if(dOut>0&&lt>len-dOut){
      var q2=Math.min(1,(lt-(len-dOut))/dOut),e2=edIn2(q2);
      st.a*=(1-e2);
      if(pout){
        if(pout.x)st.dx+=pout.x*e2;
        if(pout.y)st.dy+=pout.y*e2;
        if(pout.s)st.s*=1+(pout.s-1)*e2;
      }
    }
    /* 缓慢推镜：ANIM_PRESETS 里 kenburns 是 [null,null]，导出端原来什么都不做 ——
       那是死档位。这里和 timeline.js 一起改成「全段线性推到 1.08 倍」。 */
    if(p==='kenburns'&&!hasKeys&&len>0.4){
      var z=edNum(c.zoom,0)||1.08;
      st.s*=1+(z-1)*(lt/len);
    }
    return st;
  }

  function edApplyXform(el,c,t){
    var v=edEvalKF(c,t),txt=c.type==='text';
    el.style.left=(v.x*100).toFixed(3)+'%';
    el.style.top=(v.y*100).toFixed(3)+'%';
    el.style.width=txt?'auto':(v.w*100).toFixed(3)+'%';
    el.style.height=txt?'auto':(v.h*100).toFixed(3)+'%';
    el.style.maxWidth=txt?'86%':'';
    var an=edAnimState(c,t);
    el.style.opacity=(Math.max(0,Math.min(1,v.opacity))*an.a).toFixed(3);
    if(!txt)el.style.borderRadius=(v.radius>0?(+v.radius).toFixed(1)+'px':'0');
    /* 偏移放在 scale 之前，dx/dy 才是真正的屏幕像素量（放后面会被 scale 放大缩小） */
    el.style.transform='translate(-50%,-50%)'
      +(an.dx||an.dy?' translate('+an.dx.toFixed(2)+'px,'+an.dy.toFixed(2)+'px)':'')
      +' rotate('+v.rotate.toFixed(2)+'deg) scale('+(Math.max(.01,v.scale)*an.s).toFixed(4)+')';
    /* 模板 iframe 固定 1920x1080 内部坐标系，按这一层在工程里的实际像素尺寸
       等比 contain 缩放，跟导出端 fitPatchBlock 的 contain 口径一致 —— 内容完整居中，
       不会再溢出到右下角。layer 像素 = 工程画幅 × 该层 w/h 比例。 */
    var fr=el.querySelector&&el.querySelector('iframe.ed-tpl');
    if(fr&&ED.data){
      var W0=+ED.data.width||1920,H0=+ED.data.height||1080;
      var lw=Math.max(1,W0*v.w),lh=Math.max(1,H0*v.h);
      var fk=Math.min(lw/1920,lh/1080);
      fr.style.setProperty('--tpl-fit',String(Math.round(fk*10000)/10000));
    }
  }

  /* ── 工程列表 ── */
  function edLoadList(){
    return window.api('/api/edit',{action:'list'}).then(function(d){
      var list=(d&&d.projects)||[], sel=$('#edProj');
      if(!list.length){sel.innerHTML='<option value="">（还没有工程）</option>';return}
      sel.innerHTML=list.map(function(p){
        return '<option value="'+esc(p.name)+'">'+esc(p.name)+' · '+p.clips+' 段 · '+fmt(p.duration)+'</option>';
      }).join('');
      /* 别把内部草稿工程（_模板试用 之类）当当前工程打开。
         它是「先看看」的预览容器，没有主时间线，一导出必然失败。
         列表接口已经不返回它了，但 ED.proj 可能还停在旧值上。 */
      function isInternal(n){return String(n||'').charAt(0)==='_'}
      if(ED.proj&&isInternal(ED.proj))ED.proj='';
      /* 当前工程还在列表里 → 保持不动；不在了（被删/改名）→ 清掉重选 */
      var exists=list.some(function(p){return p.name===ED.proj});
      if(ED.proj&&!exists)ED.proj='';
      if(ED.proj){ sel.value=ED.proj; return }
      /* 没有当前工程：选「最新的那个」而不是 list[0]。
         list 按名字排序的话，AI 刚建的「垂直片头演示」可能排在后面，
         选中第一个等于还是打开旧工程，用户以为新工程没建成。
         接口给了 mtime（秒），按它倒序取最新的最符合直觉。 */
      var newest=list.slice().sort(function(a,b){ return (b.mtime||0)-(a.mtime||0) })[0];
      if(newest){ sel.value=newest.name; edOpen(newest.name) }
      else say('还没有剪辑工程，点「新建工程」开始');
    }).catch(function(){});
  }

  function edOpen(name){
    return window.api('/api/edit',{action:'get',project:name}).then(function(d){
      ED.proj=name;ED.data=(d&&d.project)||null;ED.assets=(d&&d.assets)||[];ED.sel=null;
      $('#edProj').value=name;
      edPool();edLanes();edInsp();edPreview();
      var sz=$('#edSize');
      if(sz&&ED.data&&ED.data.width&&ED.data.height){
        var v=ED.data.width+'x'+ED.data.height;
        for(var i=0;i<sz.options.length;i++)if(sz.options[i].value===v){sz.selectedIndex=i;break}
      }
      var sub=$('#edSub');
      if(sub&&ED.data)sub.textContent='当前工程：'+name+' · '+ED.data.width+'×'+ED.data.height
        +' · '+fmt(edDuration())+' · '+((ED.data.tracks||[]).reduce(function(a,t){return a+(t.clips||[]).length},0))+' 个片段';
      return d;
    }).catch(function(e){say('打开工程失败：'+(e&&e.message||''))});
  }

  /* ── 素材池 ── */
  function edPool(){
    var box=$('#edPool');if(!box)return;
    if(!ED.assets.length){
      box.innerHTML='<div class="ed-pool-e">还没有素材。<br>点「导入」加视频 / 音频 / 图片，<br>拖到轨道上就能用。</div>';
      return;   /* ★ 这个 return 以前少了右大括号，函数体没闭合 —— 后面的渲染代码
                   全部漏在函数外面，等于素材池永远不渲染。 */
    }
    var ic={video:'#i-film',audio:'#i-vol',image:'#i-image'};
    box.innerHTML=ED.assets.map(function(a,i){
      return '<div class="ed-as '+a.kind+'" draggable="true" data-i="'+i+'" title="'+esc(a.name)+'">'+
        '<svg class="ic"><use href="'+(ic[a.kind]||'#i-list')+'"/></svg>'+
        '<span class="nm">'+esc(a.name)+'</span>'+
        (a.duration?'<span class="du">'+fmt(a.duration)+'</span>':'')+'</div>';
    }).join('');
  }

  /* ── 时间线 ── */
  /* 轨道名一律按「类型 + 同类序号」重算，忽略数据源给的 tr.name。
     结果统一是「视频1/图形1/字幕1/音频1」这种 2 汉字 + 1 数字，长度永远一致。 */
  var TN={video:'视频',graphics:'图形',text:'字幕',audio:'音频'};
  function edTrackName(tr,all){
    var base=TN[tr.kind]||'轨道';
    var same=(all||[]).filter(function(x){return x.kind===tr.kind});
    var i=same.indexOf(tr);
    return base+((i<0?0:i)+1);
  }
  function edLanes(){
    var lanes=$('#edLanes'),ruler=$('#edRuler');
    if(!lanes)return;
    if(!ED.data){lanes.innerHTML='';ruler.innerHTML='';return}
    var dur=edDuration();
    /* 缩放口径：pps = 让整条时间线正好铺满可视宽度的每像素秒数 × 用户倍率。
       这样 12 秒的工程也铺满整条，不会右边留一大片空白；
       拉滑块只是在这个基准上放大缩小，不会一进来就半屏空着。 */
    var sc=$('#edScroll');
    /* 轨道名栏宽窄同步到 CSS：拖手柄改了 LANE_W 后，这里让每栏跟上；
       窄于 104px 收起轨道名只留图标+按钮，时间线内容就不会被挤没。 */
    if(sc){sc.style.setProperty('--lane-w',LANE_W+'px');}
    var visW=Math.max(400,((sc&&sc.clientWidth)||600)-LANE_W);
    var base=visW/dur;                       /* 铺满所需的 pps */
    ED.pps=Math.max(4, base*(ED.zoom||1));
    var wpx=Math.max(dur*ED.pps, visW);
    /* 刻度按「可视宽度能放下多少秒」来画，不按工程时长画。
       只画到 dur 的话，短工程右边会留一大片空刻度，看着像界面断了。 */
    var visSec=Math.max(dur, wpx/ED.pps);
    var r='',step=dur<=20?2:(dur<=60?5:10);
    if(visSec>60)step=15;
    if(visSec>180)step=30;
    /* 刻度要跟片段对齐：轨道名那列占 62px，所以 tick 和 ruler 宽度都要加这 62。
       原来 tick 从 0 画、clip 从 62 画，00:00 跟片段差一整格，看着很别扭。 */
    for(var s2=0;s2<=visSec;s2+=step){
      r+='<div class="tk" style="left:'+(LANE_W+s2*ED.pps)+'px">'+fmt(s2)+'</div>';
    }
    ruler.innerHTML=r;ruler.style.width=(wpx+LANE_W)+'px';
    var laneIc={video:'#i-film',graphics:'#i-grid',text:'#i-text',audio:'#i-vol'};
    lanes.innerHTML=(ED.data.tracks||[]).map(function(tr){
      var clips=(tr.clips||[]).map(function(c,ci){
        var left=Math.max(0,(+c.start||0)*ED.pps);
        var len=edClipLen(c);
        var cls=(c.type&&c.type!=='text'&&c.type!=='template')?c.type:(c.type||tr.kind);
        var label=c.type==='text'?(c.text||'字幕'):(c.type==='template'?('模板 · '+(c.name||'')):(c.src||'').split('/').pop());
        var on=(ED.sel&&ED.sel.track===tr.id&&ED.sel.i===ci)?' on':'';
        /* 关键帧菱形：at 是片段内进度，落在片段宽度对应位置。
           点菱形跳播放头到那一帧，配合右侧属性面板改值。 */
        var kfs=(c.keys||[]).map(function(k){
          if(k==null||k.at==null)return '';
          return '<i class="ed-kf" data-kf="'+ci+'" data-at="'+(+k.at)+'" title="关键帧 '+fmt((+c.start||0)+(+k.at)*len)+'"></i>';
        }).join('');
        return '<div class="ed-cl '+cls+on+(c.locked?' lk':'')+(c.mute?' mu':'')+'" data-tr="'+esc(tr.id)+'" data-i="'+ci+'" '+
          'style="left:'+left+'px;width:'+Math.max(16,len*ED.pps)+'px" title="'+esc(label)+'">'+
          '<span class="h l"></span><span class="nm">'+esc(label)+'</span>'+kfs+'<span class="h r"></span></div>';
      }).join('');
      var lb=(tr.locked?' lk':'')+(tr.mute?' mu':'');
      var tn=edTrackName(tr,ED.data.tracks);
      return '<div class="ed-lane'+lb+'" data-tr="'+esc(tr.id)+'">'+
        '<div class="ed-lane-lb"><svg class="ic"><use href="'+(laneIc[tr.kind]||'#i-list')+'"/></svg>'+
        '<span class="lb-nm" title="'+esc(tn)+'">'+esc(tn)+'</span>'+
        '<button class="lb-t lb-add" data-track-act="add" title="'+(tr.kind==='text'?'在这条轨加一段文字':tr.kind==='audio'?'导入音频到这条轨':'导入素材到这条轨')+'"><svg class="ic"><use href="#i-plus"/></svg></button>'+
        '<button class="lb-t'+(tr.locked?' on':'')+'" data-track-act="lock" title="锁定 / 解锁这条轨道"><svg class="ic"><use href="#i-lock"/></svg></button>'+
        '<button class="lb-t lb-del" data-track-act="del" title="删除这条轨道"><svg class="ic"><use href="#i-trash"/></svg></button>'+
        '<span class="lb-resize" title="拖动改这一栏宽窄"></span>'+
        '</div>'+
        '<div class="ed-lane-b" data-tr="'+esc(tr.id)+'" data-kind="'+esc(tr.kind)+'">'+
        '<div class="ed-drop"></div>'+clips+'</div></div>';
    }).join('');
    edTime();
  }

  /* 双击文字片段 = 就地在那一格上改字，不跳到右侧属性面板。
     用户原话：「双击字幕轨道可以直接从轨道上来修改文字内容」。
     Enter 存盘 / Esc 放弃 / 点别处也存盘；输入框存在期间时间线不重排。 */
  function edInlineText(trId,i){
    var cl=document.querySelector('.ed-cl[data-tr="'+trId+'"][data-i="'+i+'"]');
    var c=edClipAt(trId,i);
    if(!cl||!c||cl.querySelector('.ed-inline'))return;
    var nm=cl.querySelector('.nm');
    if(nm)nm.style.visibility='hidden';
    var inp=document.createElement('input');
    inp.className='ed-inline';inp.type='text';inp.value=c.text||'';
    inp.style.width=Math.max(70,cl.clientWidth-10)+'px';
    cl.appendChild(inp);
    inp.focus();inp.select();
    var done=false;
    function fin(save){
      if(done)return;done=true;
      if(save&&inp.value!==(c.text||'')){c.text=inp.value;edDirty()}
      inp.remove();
      if(nm)nm.style.visibility='';
      edLanes();edInsp();edPreview();
      if(save)edSave(true);
    }
    inp.addEventListener('keydown',function(ev){
      ev.stopPropagation();
      if(ev.key==='Enter'){ev.preventDefault();fin(true)}
      else if(ev.key==='Escape'){ev.preventDefault();fin(false)}
    });
    inp.addEventListener('blur',function(){fin(true)});
    ['mousedown','click','mousemove','mouseup'].forEach(function(t){
      inp.addEventListener(t,function(ev){ev.stopPropagation()});
    });
  }

  function edClipLen(c){
    if(c.type==='text'||c.type==='template')return Math.max(0.2,+c.duration||3);
    var d=Math.max(0.1,(+c.out||0)-(+c.in||0));
    return d/Math.max(0.1,+c.speed||1);
  }

  function edTime(){
    var t=Math.max(0,ED.t||0),dur=ED.data?edDuration():0;
    var el=$('#edTime');if(el)el.textContent=fmt(t)+' / '+fmt(dur);
    var ph=$('#edPlay');if(ph)ph.style.left=(LANE_W+t*ED.pps)+'px';
  }

  /* ── 属性面板 ── */
  /* ══════════ 文字样式库 ══════════
     剪映「文字 → 样式」那一栏的等价物：不是给你调六个数字，是给你几十种
     已经排好的成品。点一下整段文字换皮，颜色框改的是主色（{C} 会被替换）。
     ★ 样式一律存成**解析后的 CSS 声明串**（c.tcss），导出端 timeline.js 直接
       套在 style 上，不需要认识这张表 —— 两端同一份视觉，不会各写一套跑偏。 */
  /* 样式表从 src/textstyles.js 来（构建时内联成 window.RC_TEXTSTYLES）。
     ★ 以前这 46 款直接写死在这个页面里，导出端 timeline.js 与 AI 工具层
       都摸不到 —— AI 只能给动效名，设不了样式。现在三边共用一份。 */
  var TSL=window.RC_TEXTSTYLES||{TS:[],ANIM:[['','无']],list:function(){return []}};
  var TS=TSL.TS;
  var TS_ANIM=TSL.ANIM;
  /* 逐字类动效按「字符」算相位，跟整块动效不是一回事：
     charIn 每个字错开 45ms 弹上来，typewriter 每 55ms 蹦一个字。
     这两个常量在导出端 timeline.js 里必须一模一样，否则编辑器里看着 45ms、
     出去变 90ms，节奏就散了。 */
  var CH_STEP=TSL.CH_STEP,CH_DUR=TSL.CH_DUR,TW_STEP=TSL.TW_STEP;
  /* 默认 .ed-text / .vl-tx 自带「深色底衬 + 大内边距」。
     成品样式里没写 background 的（渐变字、中空字、发光字…）不该挂这块黑底，
     否则渐变字后面一块黑板，全是脏的。所以没写 background 就显式清掉。 */
  function tsBare(st){return !!st&&!/background/i.test(st.css)}
  function tsById(id){for(var i=0;i<TS.length;i++)if(TS[i].id===id)return TS[i];return null}
  /* 主色/副色替换：样式里 {C} 填主色，{C2} 填副色（渐变款的第二档颜色）。
     以前只有 {C}，金渐变永远是固定的金→白，用户改颜色只动得了第一档 ——
     现在每个渐变款都带自己的 c2 默认值，片段没设过就用它。 */
  function tsCss(st,color,color2){
    if(!st)return '';
    return String(st.css)
      .replace(/\{C2\}/g,color2||st.c2||'#F472B6')
      .replace(/\{C\}/g,color||'#FFFFFF')
  }

  /* 面板上那一格只有 11px 高，不能直接套整串样式：
     黑底衬的白字、竖排、斜带、边框一旦全套上去，格子被撑破、几行字叠成一团。
     这里只借「字形本身」的观感 —— 颜色/描边/阴影/字体/字重/字距，其余全丢。 */
  function tsChipCss(st,color){
    if(!st)return '';
    var keep=/^(color|font-family|font-weight|font-style|text-shadow|-webkit-text-stroke|-webkit-text-stroke-color|-webkit-text-stroke-width|letter-spacing|text-transform)$/;
    return String(st.css)
      .replace(/\{C2\}/g,st.c2||'#F472B6')
      .replace(/\{C\}/g,color||'#FFFFFF').split(';').map(function(d){
      var i=d.indexOf(':');if(i<0)return '';
      var k=d.slice(0,i).trim().toLowerCase(),v=d.slice(i+1).trim();
      if(!keep.test(k))return '';
      /* 宽字距那几款一个字符能拉开半格，标签里必须收回去，否则四个字显示不全 */
      if(k==='letter-spacing'){var n=parseFloat(v);if(!isFinite(n)||Math.abs(n)>0.1)v='0';}
      /* 字体名带双引号（"SF Mono" / "Songti SC"），直接拼进 style="..." 会把属性截断，
         后面所有声明跟着丢 —— 等宽终端、宋体标题、手写体、引文这几格就成了纯继承色。
         CSS 认单引号，统一换成单引号。 */
      return k+':'+v.replace(/"/g,"'");
    }).filter(Boolean).join(';');
  }

  /* 「默认底衬」这类样式 css 是空串，取不到颜色就完全继承了面板的深灰字，
     放在深底格子上等于隐形。没有颜色声明的一律补白字。 */
  function tsChipText(st,color){
    var d=tsChipCss(st,color);
    /* 渐变字（金渐变/霓虹/冰蓝那一批）是 background-clip:text + color:transparent，
       缩略格里没有那层渐变背景，字就是全透明的 —— 一整格看着是空的。
       这里把渐变里的第一个色抠出来当实色用，只求「看得出是什么色系」。 */
    if(/(^|;)color:transparent/i.test(d)&&st){
      var g=String(st.css).replace(/\{C\}/g,color||'#FFFFFF')
        .match(/(#[0-9a-fA-F]{3,8}|rgba?\([^)]*\))/);
      d=d.replace(/color:transparent/i,'color:'+(g?g[1]:'#FFFFFF'));
    }
    if(!/(^|;)color:/.test(d))d='color:#FFFFFF;'+(tsChipDark(st,color)?'':';color:#101418;')+d;
    return d;
  }

  /* 缩略格底色要反向取：白字的样式用深底，黑字的样式（黑中空/荧光笔/黑底衬）
     用浅底，否则那一格就是「一片同色」，什么都看不见。
     中空字的 color 是 transparent，真正的笔画色在 -webkit-text-stroke 里，要换过去算。 */
  function tsChipDark(st,color){
    if(!st)return true;
    var css=String(st.css).replace(/\{C\}/g,color||'#FFFFFF');
    var col='',stroke='';
    css.split(';').forEach(function(d){
      var i=d.indexOf(':');if(i<0)return;
      var k=d.slice(0,i).trim().toLowerCase(),v=d.slice(i+1).trim();
      if(k==='color')col=v;
      if(k==='-webkit-text-stroke')stroke=v;
      if(k==='-webkit-text-stroke-color')stroke=v;
    });
    var src=(!col||/transparent|rgba\(\s*0\s*,\s*0\s*,\s*0\s*,\s*0\s*\)/i.test(col))?(stroke||'#FFFFFF'):col;
    /* -webkit-text-stroke 的值是「2px #101418」这种带宽度前缀的简写，
       不把颜色抠出来，正则就认不出它是黑 —— 于是黑中空被判成亮笔画、配了深底，
       整格变成一片深色，字全糊掉。 */
    var cm=src.match(/(#[0-9a-fA-F]{3,8}|rgba?\([^)]*\))/);
    if(cm)src=cm[1];
    var m=src.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
    var r=255,g=255,b=255;
    if(m){
      var h=m[1].length===3?m[1].split('').map(function(x){return x+x}).join(''):m[1];
      r=parseInt(h.slice(0,2),16);g=parseInt(h.slice(2,4),16);b=parseInt(h.slice(4,6),16);
    }else{
      var mm=src.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
      if(mm){r=+mm[1];g=+mm[2];b=+mm[3]}
    }
    return (0.299*r+0.587*g+0.114*b)>140;   // 笔画偏亮 → 用深底
  }

  function edInsp(){
    var box=$('#edInsp'),title=$('#edInspTitle');
    if(!box)return;
    if(!ED.sel||!ED.data){title.textContent='属性';
      box.innerHTML='<div class="hint">在时间线上点一个片段，<br>这里就能改它的参数</div>';return}
    var tr=(ED.data.tracks||[]).filter(function(x){return x.id===ED.sel.track})[0];
    var c=tr&&(tr.clips||[])[ED.sel.i];
    if(!c){title.textContent='属性';box.innerHTML='<div class="hint">片段已经不在了</div>';return}
    var kind=c.type||tr.kind;
    title.textContent=({video:'视频片段',audio:'音频片段',image:'图片片段',text:'字幕片段',template:'模板片段'})[kind]||'片段';
    var h='';
    /* 基础字段：文字 / 模板 / 媒体各有各的时间口径 */
    if(kind==='text'){
      h+='<div class="row"><label>文字</label><input type="text" id="fText" value="'+esc(c.text||'')+'"></div>';
      h+='<div class="two"><div class="row"><label>字号(px)</label><input type="number" id="fSize" value="'+(c.size||64)+'"></div>'+
         '<div class="row"><label>颜色</label><input type="color" id="fColor" value="'+(c.color||'#FFFFFF')+'"></div></div>';
      /* 副色只在「两色款」上出现：纯色/中空/发光那些换副色没意义，
         摆出来反而让人以为坏了。渐变款没设过副色就直接显示它自己的默认第二档。 */
      var stNow=tsById(c.tstyle||'');
      if(stNow&&stNow.c2){
        h+='<div class="row"><label>副色（渐变第二档）</label><input type="color" id="fColor2" value="'+(c.c2||stNow.c2)+'"></div>';
      }
      h+='<div class="two"><div class="row"><label>开始(秒)</label><input type="number" id="fStart" step="0.1" value="'+(+c.start||0)+'"></div>'+
         '<div class="row"><label>时长(秒)</label><input type="number" id="fDur" step="0.1" value="'+(+c.duration||3)+'"></div></div>';
    }else if(kind==='template'){
      h+='<div class="row"><label>模板</label><input type="text" value="'+esc(c.name||'')+'" readonly></div>';
      h+='<div class="two"><div class="row"><label>开始(秒)</label><input type="number" id="fStart" step="0.1" value="'+(+c.start||0)+'"></div>'+
         '<div class="row"><label>时长(秒)</label><input type="number" id="fDur" step="0.1" value="'+(+c.duration||3)+'"></div></div>';
    }else{
      h+='<div class="row"><label>素材</label><input type="text" value="'+esc((c.src||'').split('/').pop())+'" readonly></div>';
      h+='<div class="two"><div class="row"><label>轨道起点</label><input type="number" id="fStart" step="0.1" value="'+(+c.start||0)+'"></div>'+
         '<div class="row"><label>素材入点</label><input type="number" id="fIn" step="0.1" value="'+(+c.in||0)+'"></div></div>';
      h+='<div class="two"><div class="row"><label>素材出点</label><input type="number" id="fOut" step="0.1" value="'+(+c.out||0)+'"></div>'+
         '<div class="row"><label>速度</label><input type="number" id="fSpeed" step="0.05" value="'+(+c.speed||1)+'"></div></div>';
      if(kind!=='image')
        h+='<div class="row"><label>音量 '+(Math.round((c.volume!=null?c.volume:1)*100))+'%</label><input type="range" id="fVol" min="0" max="100" value="'+Math.round((c.volume!=null?c.volume:1)*100)+'"></div>';
    }
    /* 文字片段不摆数字面板：位置在画面上直接拖，字号颜色在上面两个框，
       这里给的是几十种排好的成品样式 —— 点一下整段换皮（剪映「样式」那栏）。 */
    if(kind==='text'){
      h+='<div class="vsec"><div class="vh">文字样式<span class="sp"></span>'+
         '<span style="font-size:9.5px;color:#9AA2B1">'+TS.length+' 种</span></div>'+
         '<div class="tsgrid" id="tsGrid">';
      TS.forEach(function(st){
        h+='<button class="tschip'+(tsChipDark(st,c.color)?'':' lit')+((c.tstyle||'')===st.id?' on':'')+'" data-ts="'+st.id+'" title="'+esc(st.nm)+'">'+
           '<span class="tssm" style="'+tsChipText(st,c.color)+'">'+esc(st.nm)+'</span></button>';
      });
      h+='</div></div>';
      h+='<div class="vsec"><div class="vh">文字动效<span class="sp"></span>'+
         '<span style="font-size:9.5px;color:#9AA2B1">整段进出</span></div>'+
         '<div class="tsrow" id="tsAnim">';
      TS_ANIM.forEach(function(x){
        h+='<button class="tsbtn'+((c.anim||'')===x[0]?' on':'')+'" data-tsa="'+x[0]+'">'+x[1]+'</button>';
      });
      h+='</div></div>';
    }else if(kind!=='audio'){
      /* 画面变换：剪映里「画面 → 基础」那一组。视频/图片/模板能改，
         每个属性右边的 ◆ 就是在当前播放头位置打关键帧。
         有关键帧时输入框改的是那一帧的值，不是整段的基础值 —— 跟剪映一致。 */
      var v=edEvalKF(c,ED.t);
      var XF=[['x','横向 %',100,0],['y','纵向 %',100,0],['scale','缩放 %',100,0],
              ['rotate','旋转 °',1,0],['opacity','不透明度 %',100,0],['radius','圆角 px',1,0]];
      h+='<div class="vsec"><div class="vh">画面变换<span class="sp"></span>'+
         '<span style="font-size:9.5px;color:#9AA2B1">◆ = 关键帧</span></div>';
      XF.forEach(function(p){
        var k=p[0],mul=p[2],cur=+((v[k]!=null?v[k]:edNum(c[k],k==='scale'?1:k==='opacity'?1:0))*mul).toFixed(1);
        var has=edKeyAt(c,k,ED.t)>=0;
        h+='<div class="kfrow"><label>'+p[1]+'</label>'+
           '<input type="number" data-xf="'+k+'" data-mul="'+mul+'" step="1" value="'+cur+'">'+
           '<button class="kfbtn'+(has?' on':'')+'" data-kfprop="'+k+'" title="在播放头位置打 / 取消关键帧">◆</button></div>';
      });
      h+='<div class="kfrow"><label>层级 z</label><input type="number" data-xf="z" data-mul="1" step="1" value="'+edNum(c.z,0)+'">'+
         '<button class="kfbtn" disabled title="层级不参与关键帧" style="opacity:.3">·</button></div>';
      /* 动画预设：没有关键帧时才生效（跟导出端 tweens() 的取舍一致），避免两套位移打架。 */
      h+='<div class="kfrow"><label>预设动画</label><select data-xf="anim">'+
         [['','无'],['fade','淡入淡出'],['slideUp','上滑入'],['slideDown','下滑入'],
          ['slideLeft','左滑入'],['slideRight','右滑入'],['zoomIn','放大入'],['zoomOut','缩小入'],
          ['kenburns','缓慢推镜']].map(function(o){
            return '<option value="'+o[0]+'"'+((c.anim||'')===o[0]?' selected':'')+'>'+o[1]+'</option>';
          }).join('')+'</select><button class="kfbtn" disabled style="opacity:.3">·</button></div>';
      h+='</div>';
      /* 关键帧列表：跳转 / 改缓动 / 删除。这是「剪映那样调关键帧」的核心操作面。 */
      h+='<div class="vsec"><div class="vh">关键帧 <span class="sp"></span>'+
         '<span style="font-size:9.5px;color:#9AA2B1">'+((c.keys||[]).length)+' 个</span></div>'+
         '<div class="kfops"><button id="kfAddAll">＋ 在这一帧打全部</button>'+
         '<button id="kfClear">清空</button></div><div class="kflist" id="kfList">'+
         edKfList(c)+'</div></div>';
    }
    if(kind==='template'){
      /* 模板的可改内容。模板只提供动效，字是每一期都要换的 ——
         所以这里填的值落在**片段**上，不动模板源文件（同一个模板
         在这条时间线上装两次，各填各的，互不影响）。 */
      h+='<div class="vsec" id="fVars"><div class="vh">这个模板能改的内容</div>'+
         '<div class="vlist" id="fVarList"><div class="hint">读取中…</div></div></div>';
    }
    h+='<button class="del" id="fDel">删掉这个片段</button>';
    box.innerHTML=h;
    edWire();
    if(kind==='template') edFillVars(c);
  }

  /* 当前播放头位置附近有没有某个属性的关键帧，返回 key 的下标，没有返回 -1。
     容差 0.03 个进度（约 0.1 秒），让「走到关键帧上按 ◆ 取消」能命中。 */
  function edKeyAt(c,prop,t){
    var len=edClipLen(c);if(len<=0)return -1;
    var p=(t-(+c.start||0))/len;
    var keys=c.keys||[];
    for(var i=0;i<keys.length;i++){
      var k=keys[i];if(!k||k.at==null||k[prop]==null)continue;
      if(Math.abs((+k.at)-p)<=0.03)return i;
    }
    return -1;
  }
  /* 关键帧列表 HTML */
  function edKfList(c){
    var keys=c.keys||[];
    if(!keys.length)return '<div class="hint" style="padding:8px 2px">还没有关键帧。<br>把播放头挪到要变的位置，点属性右边的 ◆ 或「＋ 在这一帧打全部」。</div>';
    var len=edClipLen(c),st=+c.start||0;
    return keys.map(function(k,i){
      var at=Math.max(0,Math.min(1,+k.at||0));
      var cur=Math.abs(ED.t-(st+at*len))<0.15;
      var summary=KF_PROPS.filter(function(p){return k[p]!=null}).map(function(p){
        return KF_LABEL[p].slice(0,2)+':'+(+k[p]).toFixed(2);
      }).join(' ');
      var ease=String(k.ease||'power2.inOut');
      var es=['power2.inOut','power1.inOut','power3.inOut','linear','sine.inOut','expo.out','none'].map(function(e){
        return '<option value="'+e+'"'+(ease===e?' selected':'')+'>'+({none:'默认',linear:'匀速','power2.inOut':'缓入缓出','power1.inOut':'轻微缓动','power3.inOut':'强缓动','sine.inOut':'正弦','expo.out':'急停'})[e]+'</option>';
      }).join('');
      return '<div class="kfi'+(cur?' cur':'')+'">'+
        '<span class="at">'+fmt(st+at*len)+'</span>'+
        '<span class="val" title="'+esc(summary)+'">'+esc(summary||'（空帧）')+'</span>'+
        '<select data-kfease="'+i+'">'+es+'</select>'+
        '<button data-kfgo="'+i+'" title="跳到这一帧">▸</button>'+
        '<button data-kfdel="'+i+'" title="删掉这一帧">×</button></div>';
    }).join('');
  }
  /* 打/取消一个属性的关键帧 */
  function edKfToggle(c,prop){
    var len=edClipLen(c);if(len<=0)return;
    var p=Math.max(0,Math.min(1,(ED.t-(+c.start||0))/len));
    var idx=edKeyAt(c,prop,ED.t);
    c.keys=c.keys||[];
    if(idx>=0){
      delete c.keys[idx][prop];
      if(!KF_PROPS.some(function(k){return c.keys[idx][k]!=null}))c.keys.splice(idx,1);
      say('已取消「'+KF_LABEL[prop]+'」在这个位置的关键帧');
    }else{
      var v=edEvalKF(c,ED.t)[prop];
      /* 同一位置已有别的属性的帧 → 合并进去，不要叠出两个重叠的菱形 */
      var hit=-1;
      c.keys.forEach(function(k,i){if(k&&k.at!=null&&Math.abs((+k.at)-p)<0.02)hit=i});
      if(hit<0){c.keys.push({at:Math.round(p*1000)/1000,ease:'power2.inOut',[prop]:v})}
      else c.keys[hit][prop]=v;
      c.keys.sort(function(a,b){return (+a.at)-(+b.at)});
      say('已在 '+fmt(ED.t)+' 打上「'+KF_LABEL[prop]+'」关键帧');
    }
    edDirty();edLanes();edInsp();edPreview();
  }
  /* 关键帧模式下改属性值：有帧改帧，没帧改基础值 */
  function edSetXf(c,prop,v){
    var idx=edKeyAt(c,prop,ED.t);
    if(idx>=0&&c.keys&&c.keys[idx])c.keys[idx][prop]=v;
    else c[prop]=v;
    edDirty();edPreview();
  }

  /* 把一个模板片段能改的项列出来。声明来自模板源码里的
     data-composition-variables，值来自片段自己的 vars。 */
  /* 模板可改项面板。
     ★ 文字不再从面板改 —— 用户要求「直接从视频上面点击就可以更改」。
       画面点改的实现见 uiserver 注入的 edit 脚本 + 这里的 message 监听。
       这个面板现在只做三件事：
         1) 告诉用户「点画面上的字就能改」，这是主入口；
         2) 列出这篇模板里扫到的全部文字和当前值，让用户知道能改哪些、改成了什么；
         3) 保留**颜色/形状/枚举/数值**这几类变量 —— 这些在画面上点不出来，只能靠面板。 */
  function edFillVars(clip){
    var box=$('#fVarList'); if(!box)return;
    var cid=clip.id||'';
    if(!cid){box.innerHTML='<div class="hint">这个片段还没存过，先拖一下时间线</div>';return}
    window.api('/api/edit',{action:'template_vars',project:ED.proj,clip_id:cid}).then(function(d){
      var it=((d&&d.items)||[])[0];
      var decl=(it&&it.decl)||[], vals=(it&&it.values)||clip.vars||{};
      var tl=(it&&it.text)||[], tev=(it&&it.edits)||{};
      /* 只留画面上点不出来的变量类型（颜色/枚举/数字）。
         字符串类（headline/subline/text…）一律走点画面改，不再重复给输入框。 */
      var styleDecl=decl.filter(function(v){
        return v.type==='color'||v.type==='enum'||v.type==='number'||v.type==='range';
      });
      var h='';
      if(tl.length){
        h+='<div class="tsHint">在预览画面上<b>直接点文字</b>就能改，改完按回车。'+
           '改的是这个片段自己的副本，模板特效一个字不动。</div>';
        h+='<div class="tsList">'+tl.map(function(t){
          var cur=tev[t.key]!=null?tev[t.key]:t.text;
          var ch=tev[t.key]!=null?' changed':'';
          return '<div class="tsItem'+ch+'" title="原文：'+esc(t.text)+'">'+
                 '<span class="tsDot"></span>'+esc(cur)+'</div>';
        }).join('')+'</div>';
        h+='<div class="tsFoot">共 '+tl.length+' 条文字'+
           (Object.keys(tev).length?('，已改 '+Object.keys(tev).length+' 条'):'')+
           '<button class="tsReset" id="fResetEdits">全部还原</button></div>';
      }else{
        h+='<div class="hint">这个模板里没有文字（纯画面/图形模板），没什么可改的。</div>';
      }
      if(styleDecl.length){
        h+='<div class="tsStyleHead">这些只能在面板改（画面上点不到）</div>'+
           styleDecl.map(function(v){
             var val=vals[v.id]!=null?vals[v.id]:(v.default!=null?v.default:'');
             var lbl=esc(v.label||v.id), hint=v.desc?' title="'+esc(v.desc)+'"':'';
             if(v.type==='color'){
               return '<div class="vrow"><label'+hint+'>'+lbl+'</label>'+
                      '<input type="color" data-var="'+esc(v.id)+'" value="'+esc(String(val))+'"></div>';
             }
             if(v.type==='enum'&&v.options){
               var op=v.options.map(function(o){
                 return '<option value="'+esc(String(o.value))+'"'+
                        (String(val)===String(o.value)?' selected':'')+'>'+esc(String(o.label||o.value))+'</option>';
               }).join('');
               return '<div class="vrow"><label'+hint+'>'+lbl+'</label>'+
                      '<select data-var="'+esc(v.id)+'">'+op+'</select></div>';
             }
             var step=v.step!=null?v.step:'any';
             return '<div class="vrow"><label'+hint+'>'+lbl+'</label>'+
                    '<input type="number" step="'+esc(String(step))+'" data-var="'+esc(v.id)+'" value="'+esc(String(val))+'"></div>';
           }).join('');
      }
      box.innerHTML=h;
      edWireVars(clip);
      var rs=$('#fResetEdits');
      if(rs) rs.addEventListener('click',function(){
        if(!Object.keys(tev).length){say('还没有改过');return}
        window.api('/api/edit',{action:'set_template_vars',project:ED.proj,clip_id:cid,edits:{}})
          .then(function(r){
            if(!r||!r.ok){say((r&&r.error)||'还原失败');return}
            if(r&&r.src)clip.src=r.src;
            delete clip.edits;
            edDirty(); edSave(true).then(function(){edPreview();edFillVars(clip)});
            say('已全部还原成模板原文');
          }).catch(function(){say('还原失败')});
      });
    }).catch(function(){ box.innerHTML='<div class="hint">读不到这个模板的参数</div>' });
  }

  /* 模板变量面板的接线。
     改动落在**片段**的 vars 上，不动模板源文件 —— 同一个模板在这条时间线上
     装两次，各填各的，互不影响。这是「只换字不换特效」的实现基础：
     特效用的是模板自己的 HTML/GSAP，我们只替换它声明出来的那几个值。
     写法与 edWire() 里其它接线一样：input 实时预览，change（失焦/回车）才落盘，
     否则打一行字就把工程 JSON 写十几遍。 */
  function edWireVars(clip){
    var box=$('#fVarList'); if(!box||!clip)return;
    var cid=clip.id||'';

    function commit(){
      /* ★ 只写内存里的 clip.vars，落盘交给 edSave() —— 不让界面和接口各写一遍盘。
         之前的写法是「界面调接口写盘、edSave 又写一次整份工程」，
         两个写者抢同一个文件：接口写完、编辑器下一次自动保存用内存里的旧数据
         把刚写进去的值盖掉，表现就是「字改了一下，过会儿自己变回去」。
         编辑器的 ED.data 是唯一内存真身，edSave 是唯一写盘者。 */
      var all={};
      box.querySelectorAll('[data-var]').forEach(function(e){
        var k=e.getAttribute('data-var');
        var v=(e.value==null?'':String(e.value));
        if(v!=='')all[k]=v;
      });
      if(Object.keys(all).length)clip.vars=all;
      else delete clip.vars;
      edDirty();
      /* ★ 顺序不能反：预览 iframe 的变量是**服务端按 clip_id 从磁盘 timeline.json 读**的
         （见 uiserver.js 的 templatePage）。先 edPreview() 再 edSave()，
         iframe 拿到的仍是上一次落盘的旧值 —— 表现就是「面板上的字改了，
         画面上的字一点没变」，用户会判定这个功能没做。
         所以先落盘，落完再让 iframe 重建。 */
      edSave(true).then(function(){edPreview()});
    }
    /* 打字时不能每敲一个键就重建一次 iframe：模板里是 THREE.js 场景，
       重建一次要重新编译着色器、重排队列，字还没打完画面一直在闪。
       这里只把值写进内存 clip.vars，停手 450ms 后再统一落盘 + 刷新预览。 */
    var tId=0;
    function later(){
      clearTimeout(tId);
      tId=setTimeout(commit,450);
    }
    /* 正文文字覆盖：跟 vars 一样先在内存里攒，停手 450ms 再一次性落盘 + 重建预览。
       走的是 set_template_vars 的 edits 分支 —— 后端负责写模板副本、把 src 指过去。 */
    function commitEdits(){
      var all={};
      box.querySelectorAll('[data-edit]').forEach(function(e){
        var k=e.getAttribute('data-edit');
        var v=(e.value==null?'':String(e.value));
        if(v!=='')all[k]=v;
      });
      window.api('/api/edit',{action:'set_template_vars',project:ED.proj,clip_id:cid,edits:all})
        .then(function(d){
          if(d&&d.src)clip.src=d.src;
          if(d&&d.edits&&Object.keys(d.edits).length)clip.edits=d.edits; else delete clip.edits;
          edDirty();edPreview();edSave(true).then(function(){edPreview()});
        }).catch(function(){});
    }
    var eId=0;
    function laterEdits(){
      clearTimeout(eId);
      eId=setTimeout(commitEdits,450);
    }
    box.addEventListener('input',function(e){
      var t=e.target;
      if(!t||!t.getAttribute||t.getAttribute('data-edit')==null)return;
      laterEdits();
    });
    box.addEventListener('change',function(e){
      var t=e.target;
      if(!t||!t.getAttribute||t.getAttribute('data-edit')==null)return;
      clearTimeout(eId);commitEdits();
    });
    box.addEventListener('input',function(e){
      var t=e.target;
      if(!t||!t.getAttribute||t.getAttribute('data-var')==null)return;
      clip.vars=clip.vars||{};
      var v=String(t.value==null?'':t.value);
      if(v==='')delete clip.vars[t.getAttribute('data-var')];
      else clip.vars[t.getAttribute('data-var')]=v;
      later();
    });
    box.addEventListener('change',function(e){
      var t=e.target;
      if(!t||!t.getAttribute||t.getAttribute('data-var')==null)return;
      clearTimeout(tId);
      commit();
    });
  }

  function edWire(){
    function num(id,fn){var e=$(id);if(e)e.addEventListener('input',function(){fn(+this.value);edDirty()})}
    function str(id,fn){var e=$(id);if(e)e.addEventListener('input',function(){fn(this.value);edDirty()})}
    var c=edSel();if(!c)return;
    str('#fText',function(v){c.text=v;edLanes();edPreview()});
    /* 文字框内容可改：input 实时写回 clip.text，时间线标签和预览同步刷新，
       失焦时保存一次（打字不用每敲一个字都落盘）。 */
    var ft=$('#fText');
    if(ft)ft.addEventListener('change',function(){edSave(true);say('文字已更新')});
    num('#fSize',function(v){c.size=v;edPreview()});
    /* 改颜色要顺带重算样式串：主色是 {C} 占位，不重算的话渐变/中空那几款跟不动。 */
    str('#fColor',function(v){c.color=v;
      var st=tsById(c.tstyle||'');if(st)c.tcss=tsCss(st,v,c.c2);
      edPreview()});
    /* 副色：只有渐变款有第二档色标，改它要重算 tcss，否则界面颜色变了画面不变。 */
    str('#fColor2',function(v){
      c.c2=v;
      var st=tsById(c.tstyle||'');if(st)c.tcss=tsCss(st,c.color,v);
      edPreview()});
    num('#fStart',function(v){c.start=Math.max(0,v);edLanes()});
    num('#fDur',function(v){c.duration=Math.max(0.2,v);edLanes()});
    num('#fIn',function(v){c.in=Math.max(0,v);edLanes()});
    num('#fOut',function(v){c.out=Math.max(0,v);edLanes()});
    num('#fSpeed',function(v){c.speed=Math.max(0.1,v);edLanes()});
    var vol=$('#fVol');
    if(vol)vol.addEventListener('input',function(){c.volume=(+this.value)/100;
      this.previousElementSibling.textContent='音量 '+this.value+'%'});
    /* 变换输入：有关键帧就改帧，没关键帧就改基础值（剪映行为）。 */
    Array.prototype.forEach.call(document.querySelectorAll('#edInsp [data-xf]'),function(inp){
      var ev=inp.tagName==='SELECT'?'change':'input';
      inp.addEventListener(ev,function(){
        var k=inp.getAttribute('data-xf'),mul=+(inp.getAttribute('data-mul')||1);
        var v=+inp.value/mul;if(!isFinite(v))return;
        if(k==='scale')v=Math.max(0.01,v);
        if(k==='opacity')v=Math.max(0,Math.min(1,v));
        if(k==='anim'){c.anim=v;edDirty();edPreview();return}
        if(k==='z'){c.z=v;edDirty();edPreview();return}
        edSetXf(c,k,v);
      });
    });
    /* 文字样式：点一下整段换皮。颜色框改的是主色，样式里的 {C} 会跟着变，
       所以选完样式再改颜色，两者不打架。 */
    Array.prototype.forEach.call(document.querySelectorAll('#edInsp [data-ts]'),function(b){
      b.addEventListener('click',function(){
        var id=b.getAttribute('data-ts');
        c.tstyle=id;
        var st=tsById(id);
        /* 换款时副色要重新决定：新款没有第二档就把上一款留下的 c.c2 清掉，
           否则「彩边分离」的红会跟到「薄荷」上，颜色对不上却说不出原因。 */
        if(!st.c2)c.c2='';
        c.tcss=tsCss(st,c.color,c.c2);
        /* 副色框跟着换：新款没有第二档就整块重画面板把它收掉 */
        edInsp();
        Array.prototype.forEach.call(document.querySelectorAll('#tsGrid .tschip'),function(x){
          x.classList.toggle('on',x.getAttribute('data-ts')===id);
        });
        edDirty();edPreview();edSave(true);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#edInsp [data-tsa]'),function(b){
      b.addEventListener('click',function(){
        var v=b.getAttribute('data-tsa');
        c.anim=v;
        Array.prototype.forEach.call(document.querySelectorAll('#tsAnim .tsbtn'),function(x){
          x.classList.toggle('on',x.getAttribute('data-tsa')===v);
        });
        edDirty();edSave(true);
        /* 点了动效只写字段不够 —— 动效是「时间上的变化」，播放头停在中间
           等于看见静止的一帧，用户会以为又没生效。这里把播放头拉回片段起点
           并开始播放，让它当场跑一遍。 */
        var cs=+c.start||0;
        ED.t=cs;
        edTime();edPreview();
        if(v&&!ED.playing)edPlayToggle();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#edInsp [data-kfprop]'),function(b){
      b.addEventListener('click',function(){edKfToggle(c,b.getAttribute('data-kfprop'))});
    });
    var all=$('#kfAddAll');
    if(all)all.addEventListener('click',function(){
      var len=edClipLen(c);if(len<=0)return;
      var p=Math.max(0,Math.min(1,(ED.t-(+c.start||0))/len));
      var v=edEvalKF(c,ED.t);c.keys=c.keys||[];
      var hit=-1;
      c.keys.forEach(function(k,i){if(k&&k.at!=null&&Math.abs((+k.at)-p)<0.02)hit=i});
      var pt=hit<0?{at:Math.round(p*1000)/1000,ease:'power2.inOut'}:c.keys[hit];
      KF_PROPS.forEach(function(k){pt[k]=v[k]});
      if(hit<0)c.keys.push(pt);
      c.keys.sort(function(a,b){return (+a.at)-(+b.at)});
      edDirty();edLanes();edInsp();edPreview();
      say('已在 '+fmt(ED.t)+' 打上全部关键帧');
    });
    var clr=$('#kfClear');
    if(clr)clr.addEventListener('click',function(){
      if(!(c.keys||[]).length)return;
      c.keys=[];edDirty();edLanes();edInsp();edPreview();say('这个片段的关键帧已清空');
    });
    Array.prototype.forEach.call(document.querySelectorAll('#edInsp [data-kfgo]'),function(b){
      b.addEventListener('click',function(){
        var k=(c.keys||[])[+b.getAttribute('data-kfgo')];if(!k)return;
        ED.t=(+c.start||0)+(+k.at||0)*edClipLen(c);
        edTime();edInsp();edPreview();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#edInsp [data-kfdel]'),function(b){
      b.addEventListener('click',function(){
        var i=+b.getAttribute('data-kfdel');
        if(c.keys&&c.keys[i])c.keys.splice(i,1);
        edDirty();edLanes();edInsp();edPreview();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#edInsp [data-kfease]'),function(s){
      s.addEventListener('change',function(){
        var k=(c.keys||[])[+s.getAttribute('data-kfease')];if(!k)return;
        k.ease=this.value;edDirty();say('这个关键帧的缓动已改为「'+this.options[this.selectedIndex].text+'」');
      });
    });
    var del=$('#fDel');
    if(del)del.addEventListener('click',edDelSel);
  }
  /* 删掉当前选中的片段：属性面板的 #fDel、时间线工具栏的 #edDelBtn、键盘 Delete
     都走这里，避免三处逻辑各写一份、改一处漏两处。 */
  function edDelSel(){
    if(!ED.sel||!ED.data){say('先点一下要删的片段，再按删除');return}
    var tr=(ED.data.tracks||[]).filter(function(x){return x.id===ED.sel.track})[0];
    if(!tr||tr.locked){say('这条轨道锁住了，删不了');return}
    if(!tr.clips||ED.sel.i<0||ED.sel.i>=tr.clips.length){say('先点一下要删的片段，再按删除');return}
    tr.clips.splice(ED.sel.i,1);ED.sel=null;edDirty();edLanes();edInsp();edPreview();
    say('片段已删除');
  }

  function edSel(){
    if(!ED.sel||!ED.data)return null;
    var tr=(ED.data.tracks||[]).filter(function(x){return x.id===ED.sel.track})[0];
    return tr?(tr.clips||[])[ED.sel.i]:null;
  }

  function edDirty(){ED.dirty=true}

  function edSave(quiet){
    if(!ED.data||!ED.proj)return Promise.resolve();
    /* 保存时把时长收敛到真实内容尾：有片段就写片段尾，没有才留原画布时长。
       不能再用 max(旧值,尾) —— 那样 AI 初始写 10 秒、片段 3 秒，就永远是 10 秒。 */
    var tail=edTail();
    ED.data.duration=tail>0?tail:Math.max(1,+ED.data.duration||10);
    return window.api('/api/edit',{action:'save',project:ED.proj,project_data:ED.data})
      .then(function(d){
        /* ★ 2026-11-21：不能整块换成 d.project。
           服务端 save 返回的是 {...data} 的新对象，换掉 ED.data 之后，
           edWire() 闭包里握着的还是旧 clips 的引用 —— 于是面板上改字号、
           点文字样式、拖关键帧，全都改在一个没人引用的死对象上：
           界面看着点了，预览和磁盘一动不动。只回填标量，tracks 保持原对象。 */
        if(d&&d.project){
          var np=d.project;
          ['name','width','height','fps','duration'].forEach(function(k){
            if(np[k]!==undefined)ED.data[k]=np[k];
          });
        }
        ED.dirty=false;
        if(!quiet)say('工程已保存');
        edLanes();
      }).catch(function(e){say('保存失败：'+(e&&e.message||''))});
  }

  function edTail(){
    var end=0;
    (ED.data.tracks||[]).forEach(function(t){
      (t.clips||[]).forEach(function(c){
        end=Math.max(end,(+c.start||0)+edClipLen(c));
      });
    });
    return Math.round(end*100)/100;
  }
  /* 有效时长：有片段时跟内容走（最晚的片段结束点），一条片段都没有时才用工程画布时长。
     ★ 以前一律用写死的 ED.data.duration（AI 常写成 10），片段只有 3 秒时播放头会
     空跑到 10 秒、时间线右边空一大截，导出还会多渲 7 秒黑屏——用户说的「一共三秒
     为什么指针一直跑」就是这个。播放/显示/刻度/保存统一走这里。 */
  function edDuration(){
    var tail=edTail();
    return tail>0 ? tail : Math.max(1,+ED.data.duration||10);
  }

  /* ── 拖拽 ── */
  var drag=null;
  /* 时间线上正在原地改字（.ed-inline 输入框）时，所有 mousedown 都放过：
     一点就重建时间线 DOM，输入框会被连根拔掉，字就存不上了。 */
  function edInInline(e){
    var t=e.target;
    return !!(t&&t.closest&&t.closest('.ed-inline'));
  }
  document.addEventListener('mousedown',function(e){
    if(edInInline(e))return;
    /* 拖轨道名栏右缘的手柄 = 改这一栏宽窄。往左拖到 <100px 只留图标，
       往右拖宽了显示轨道名。宽窄只影响界面，不改工程数据。 */
    var rz=e.target.closest&&e.target.closest('.lb-resize');
    if(rz){
      e.preventDefault();e.stopPropagation();
      var sc0=$('#edScroll');
      drag={mode:'lanew',x0:e.clientX,w0:LANE_W,el:rz};
      rz.classList.add('on');
      return;
    }
    /* 点菱形 = 播放头跳到这一帧，不启动片段拖拽 */
    var kf=e.target.closest&&e.target.closest('.ed-kf');
    if(kf){
      var kcl=kf.closest('.ed-cl');
      var kt=kcl&&kcl.getAttribute('data-tr'),ki=kcl?+kcl.getAttribute('data-i'):-1;
      var kc=edClipAt(kt,ki);
      if(kc){
        ED.sel={track:kt,i:ki};
        ED.t=(+kc.start||0)+(+kf.getAttribute('data-at')||0)*edClipLen(kc);
        e.preventDefault();e.stopPropagation();
        edLanes();edInsp();edTime();edPreview();
      }
      return;
    }
    var cl=e.target.closest('.ed-cl');if(!cl)return;
    var tr=cl.getAttribute('data-tr'),i=+cl.getAttribute('data-i');
    var trObj=(ED.data.tracks||[]).filter(function(x){return x.id===tr})[0];
    if(trObj&&trObj.locked){say('这条轨道锁住了，点轨道名旁边的 🔓 解锁');return}
    var c=edClipAt(tr,i);if(!c)return;
    if(c.locked){say('这个片段锁住了');return}
    ED.sel={track:tr,i:i};edLanes();edInsp();
    /* 双击文字片段 = 直接把光标放进右侧文字框。
       ★ 不能靠 dblclick 事件：上面 edLanes() 每次点击都全量重建时间线 DOM，
       两次点击落在不同节点上，浏览器不会再派发 dblclick —— 这就是
       用户说的「带着双击编辑但没用」。改用 mousedown 的 detail>=2 判定，
       并且这次不 preventDefault、不进拖拽，焦点才能落到输入框。 */
    if(e.detail>=2&&c.type==='text'){
      edInlineText(tr,i);
      return;
    }
    var mode='move';
    if(e.target.classList.contains('h'))mode=e.target.classList.contains('l')?'left':'right';
    drag={mode:mode,c:c,x0:e.clientX,start0:+c.start||0,
          in0:+c.in||0,out0:+c.out||0,dur0:edClipLen(c),tr:tr};
    e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(!drag)return;
    if(drag.mode==='lanew'){
      /* 拖轨道名栏宽窄：56~200px。同步 CSS 变量 + JS 常量，再重画刻度/播放头。
         这里不调 edLanes()（会连手柄一起重建、丢掉 drag.el），只更新宽度并重画时间线。 */
      LANE_W=Math.max(100,Math.min(128,Math.round(drag.w0+(e.clientX-drag.x0))));
      var scx=$('#edScroll');
      if(scx){scx.style.setProperty('--lane-w',LANE_W+'px');}
      edLanes();
      return;
    }
    var dx=(e.clientX-drag.x0)/ED.pps;
    if(drag.mode==='move'){
      drag.c.start=Math.max(0,Math.round((drag.start0+dx)*100)/100);
    }else if(drag.mode==='right'){
      if(drag.c.type==='text'||drag.c.type==='template'){
        drag.c.duration=Math.max(0.2,Math.round((drag.dur0+dx)*100)/100);
      }else{
        drag.c.out=Math.max(drag.in0+0.1,Math.round((drag.out0+dx)*100)/100);
      }
    }else{
      if(drag.c.type==='text'||drag.c.type==='template'){
        var nd=Math.max(0.2,drag.dur0-dx);
        drag.c.start=Math.max(0,drag.start0+(drag.dur0-nd));
        drag.c.duration=Math.round(nd*100)/100;
      }else{
        drag.c.in=Math.max(0,Math.min(drag.out0-0.1,Math.round((drag.in0+dx)*100)/100));
        drag.c.start=Math.max(0,Math.round((drag.start0+dx)*100)/100);
      }
    }
    edDirty();edLanes();
  });
  document.addEventListener('mouseup',function(){
    if(!drag)return;
    /* 拖轨道栏宽结束时写回存储，下次打开还是这个宽度 */
    if(drag.mode==='lanew'){try{localStorage.setItem(LANE_KEY,String(LANE_W))}catch(e){}}
    drag=null;edInsp();
    /* 拖完立刻落盘：只改内存不存，用户切工程/重启就白拖了 */
    if(ED.dirty)edSave(true);
  });

  function edClipAt(tr,i){
    if(!ED.data)return null;
    var t=(ED.data.tracks||[]).filter(function(x){return x.id===tr})[0];
    return t?(t.clips||[])[i]:null;
  }

  /* ── 轨道操作：加 / 锁 / 静音 / 删 ──
     「多轨」不只是画几条线：每条轨要能单独锁住防误拖、静音、删掉，
     还要能随时加一条新轨 —— 这些在剪映里都是最基础的动作。 */
  function edAddTrack(kind){
    /* 没打开工程时，「加轨」不能静默失败 —— 那正是用户说的「轨道做不了」。
       自动建一个工程再挂轨，一次点击就把多轨时间线跑起来。
       ★ 建工程是异步的，建完回调里再走一遍本函数（那时 ED.data 已就绪）。 */
    if(!ED.data){
      var nm0='未命名-'+Date.now().toString().slice(-4);
      say('还没有工程，正在自动建一个…');
      window.api('/api/edit',{action:'new',name:nm0}).then(function(){
        return edLoadList().then(function(){return edOpen(nm0)});
      }).then(function(){
        if(ED.data){edAddTrack(kind);say('工程「'+nm0+'」建好了，轨道已就位，把素材拖上来就能剪')
        }else say('工程建好了，请从上面的工程列表选它');
      }).catch(function(e){say('建工程失败：'+((e&&e.message)||''))});
      return;
    }
    var nm={video:'主视频',graphics:'图形',text:'字幕',audio:'音频'};
    var n=(ED.data.tracks||[]).filter(function(t){return t.kind===kind}).length+1;
    ED.data.tracks=ED.data.tracks||[];
    ED.data.tracks.push({id:kind.charAt(0)+'t'+Date.now().toString().slice(-5),
      kind:kind,name:(nm[kind]||kind)+n,clips:[]});
    edDirty();edLanes();say('已加一条'+(nm[kind]||kind)+'轨');
  }
  function edConfirm(text,onOk){
    if(window.__confirmAsk){window.__confirmAsk(text,onOk);return}
    if(window.confirm&&window.confirm(text))onOk();
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-track-act]');
    if(!b||!ED.data)return;
    var lane=b.closest('.ed-lane'),tid=lane&&lane.getAttribute('data-tr');
    var tr=(ED.data.tracks||[]).filter(function(x){return x.id===tid})[0];
    if(!tr)return;
    var act=b.getAttribute('data-track-act');
    if(act==='lock')tr.locked=!tr.locked;
    else if(act==='mute')tr.mute=!tr.mute;
    else if(act==='add'){
      /* 轨道栏的＋：按轨类型加东西。文字轨直接插可编辑字幕；
         音视频/图形轨先给素材池里挑，池里没有就调系统文件对话框导入。 */
      if(tr.locked){say('这条轨道锁住了，先解锁');return}
      if(tr.kind==='text'){edAddTextAt(tr);return}
      var want=(tr.kind==='audio')?'audio':(tr.kind==='graphics'?'image':'video');
      var pool=(ED.assets||[]).filter(function(a){return a.kind===want});
      var pick=function(a){
        var c={id:'c'+Date.now(),src:a.src,in:0,out:a.duration||5,volume:1,speed:1};
        c.type=(want==='image')?'image':want;
        edPush(tr.id,c);
        say('已加「'+(a.name||a.src.split('/').pop())+'」到这条轨');
      };
      if(pool.length){
        var html='<div style="max-height:260px;overflow:auto">'+
          pool.map(function(a,i){return '<div class="ed-as '+esc(a.kind)+'" data-pool="'+i+'" style="cursor:pointer">'+
            '<svg class="ic"><use href="#i-'+(a.kind==='image'?'image':a.kind==='audio'?'vol':'film')+'"/></svg>'+
            '<span class="nm">'+esc(a.name||a.src.split('/').pop())+'</span>'+
            '<span class="du">'+Math.round(a.duration||0)+'s</span></div>'}).join('')+'</div>';
        if(window.confirmAction){
          var closePick=function(){
            var m=document.getElementById('mConfirmModal');if(m)m.classList.remove('open');
            document.body.classList.remove('modal-open');
            document.removeEventListener('click',onPick);
          };
          var onPick=function(ev){
            var it=ev.target.closest&&ev.target.closest('[data-pool]');if(!it)return;
            pick(pool[+it.getAttribute('data-pool')]);closePick();
          };
          window.confirmAction({title:'选素材加到'+(tr.name||tr.kind)+'轨',
            html:html+'<div style="font-size:11px;color:#8A92A2;margin-top:6px">点一条直接加到轨道上</div>',
            okText:'取消',onOk:function(){}});
          document.addEventListener('click',onPick);
        } else { pick(pool[0]); }
        return;
      }
      // 池里没有 → 弹系统文件对话框导入，导完自动落到这条轨
      if(window.riffcut&&window.riffcut.pickFiles){
        window.riffcut.pickFiles().then(function(r){
          if(!r||!r.ok||!r.files||!r.files.length){if(r&&!r.canceled)say('没选到文件');return}
          var f=r.files[0];
          window.api('/api/edit',{action:'import',project:ED.proj,path:f}).then(function(j){
            if(!j||!j.ok){say('导入失败：'+((j&&j.error)||'未知错误'));return}
            var a=j.asset||{};
            var c={id:'c'+Date.now(),src:a.src||f,in:0,out:a.duration||5,volume:1,speed:1,
              type:(a.kind===want?want:(want==='image'?'image':want))};
            edPush(tr.id,c);say('已导入并加到这条轨');
          }).catch(function(err){say('导入失败：'+(err&&err.message||err))});
        });
      } else { say('这台机器没有文件选择通道，先把素材拖进来'); }
      return;
    }
    else if(act==='del'){
      if((ED.data.tracks||[]).length<=1){say('至少留一条轨道');return}
      var n=(tr.clips||[]).length;
      var go=function(){
        ED.data.tracks=ED.data.tracks.filter(function(x){return x!==tr});
        if(ED.sel&&ED.sel.track===tid)ED.sel=null;
        edDirty();edLanes();edInsp();edPreview();
        say('轨道已删除');
      };
      edConfirm('确定删除「'+edTrackName(tr,ED.data.tracks)+'」轨？'+(n?'\n轨道上 '+n+' 个片段会一起删掉。':''),go);
      return;
    }
    edDirty();edLanes();edInsp();edPreview();
  });
  $('#edAddVBtn')&&$('#edAddVBtn').addEventListener('click',function(){edAddTrack('video')});
  $('#edAddTBtn')&&$('#edAddTBtn').addEventListener('click',function(){edAddTrack('text')});
  $('#edAddABtn')&&$('#edAddABtn').addEventListener('click',function(){edAddTrack('audio')});
  /* ＋文字：直接在播放头位置插一段可编辑的字幕。
     以前只能「＋字幕轨」加一条空轨，用户不知道怎么往里放字——现在一键就有字，
     插完自动选中并把右侧属性面板的文本框聚焦，改完内容即时反映到时间线和预览。
     targetTr：可指定插到哪条轨（轨道栏的＋用）；不传就找/建第一条文字轨。 */
  function edAddTextAt(targetTr){
    if(!ED.data){say('先选一个工程');return}
    ED.data.tracks=ED.data.tracks||[];
    var tr=targetTr||(ED.data.tracks||[]).filter(function(x){return x.kind==='text'})[0];
    if(!tr){tr={id:'t'+Date.now().toString().slice(-5),kind:'text',name:'字幕',clips:[]};ED.data.tracks.push(tr)}
    if(tr.locked){say('这条轨道锁住了，先解锁');return}
    var c={id:'c'+Date.now(),type:'text',text:'双击修改文字',start:Math.round((ED.t||0)*100)/100,
      duration:3,size:64,color:'#FFFFFF',weight:700};
    tr.clips=tr.clips||[];tr.clips.push(c);
    ED.sel={track:tr.id,i:tr.clips.length-1};
    edDirty();edLanes();edInsp();edPreview();
    var ft=$('#fText');if(ft){ft.focus();ft.select()}
    say('已加一段文字，在右侧改内容');
  }
  $('#edAddTextBtn')&&$('#edAddTextBtn').addEventListener('click',function(){edAddTextAt()});
  /* 双击时间线上的文字片段 = 直接聚焦右侧文字框，改字不用先找面板。 */
  document.addEventListener('dblclick',function(e){
    var cl=e.target.closest&&e.target.closest('.ed-cl');if(!cl||!ED.data)return;
    var tr=cl.getAttribute('data-tr'),i=+cl.getAttribute('data-i');
    var c=edClipAt(tr,i);if(!c||c.type!=='text')return;
    ED.sel={track:tr,i:i};edLanes();edInsp();
    var ft=$('#fText');if(ft){ft.focus();ft.select()}
  });

  /* ── 分割 / 复制 ── */
  function edSplit(){
    var c=edSel();if(!c){say('先点一个片段，再把播放头挪到要切开的位置');return}
    var tr=(ED.data.tracks||[]).filter(function(x){return x.id===ED.sel.track})[0];
    if(!tr||tr.locked){say('这条轨道锁住了');return}
    var s=+c.start||0,len=edClipLen(c),off=ED.t-s;
    if(off<=0.15||off>=len-0.15){say('把播放头放到片段中间（别贴着两头）再分割');return}
