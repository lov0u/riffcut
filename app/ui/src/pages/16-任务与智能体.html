<style>
/* 任务与智能体。
   两件事分两栏，不合并：
     · 子智能体 —— 内核自己开的分身，一轮任务里并行干活（几十秒寿命，重启即清空）
     · 后台任务 —— 软件自己派出去的活儿（扫素材、渲片、下载），有进度条、能取消
   用户常把「渲片」当成「AI 在想」，画在一起就会一直搞不清到底谁在忙。 */
.ag-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:clamp(6px,0.8%,10px);margin-bottom:10px}
.ag-kpi{background:#FFF;border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px}
.ag-kpi .n{font-size:21px;font-weight:700;color:#1E2430;line-height:1.1;font-variant-numeric:tabular-nums}
.ag-kpi .l{font-size:var(--f5);color:#8A92A2;margin-top:3px}
.ag-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:clamp(8px,1%,12px)}
@media (max-width:1180px){.ag-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.ag-col{display:flex;flex-direction:column;min-height:0;padding:0}
.ag-h{display:flex;align-items:center;gap:7px;padding:10px 13px;border-bottom:1px solid var(--line);
  font-size:var(--f3);font-weight:600;color:#33405A}
.ag-h .u-tag{margin-left:auto;font-weight:400}
.ag-rows{flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding:8px 12px 14px}
.ag-rows::-webkit-scrollbar{display:none}
.ag-item{border:1px solid var(--line);border-radius:var(--r-md);padding:9px 11px;margin-bottom:7px;background:#FFF}
.ag-item.run{border-color:#A8C4F8;background:#FBFDFC}
.ag-item.bad{border-color:#F0D6D6;background:#FEFBFB}
.ag-nm{display:flex;align-items:center;gap:6px;font-size:var(--f4);color:#2C3340;font-weight:600}
.ag-nm .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-task{font-size:10.5px;color:#6B7484;line-height:1.5;margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ag-meta{font-size:10px;color:#98A0AF;margin-top:5px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.ag-bar{height:3px;background:#EEF2F7;border-radius:2px;margin-top:6px;overflow:hidden}
.ag-bar i{display:block;height:100%;background:#2563EB;border-radius:2px;transition:width .4s}
.ag-empty{padding:26px 12px;text-align:center;color:#98A0AF;font-size:var(--f4);line-height:1.7}
.ag-dot{width:6px;height:6px;border-radius:50%;background:#2563EB;flex:0 0 auto;animation:agp 1.2s infinite}
@keyframes agp{0%,100%{opacity:.35}50%{opacity:1}}
.ag-tip{background:#F4F8F7;border:1px solid #CFE4DF;border-radius:var(--r-md);padding:9px 12px;margin-bottom:10px;
  font-size:var(--f5);color:#5C6B72;line-height:1.65}
.ag-tip b{color:#2563EB;font-weight:600}
.ag-tip span{display:block}
</style>

<section class="page" data-page="agents">
  <div class="u-head">
    <div class="txt">
      <div class="u-title"><svg class="ic" style="width:18px;height:18px"><use href="#i-grid"/></svg>任务与智能体</div>
      <div class="u-sub">左边是内核自己开的分身 · 右边是软件派出去的后台活儿</div>
    </div>
    <div class="u-actions">
      <button class="u-btn" id="agRefresh"><svg class="ic"><use href="#i-refresh"/></svg>刷新</button>
      <button class="u-btn" id="agClearDone" title="只清已结束的任务，正在跑的不动"><svg class="ic"><use href="#i-trash"/></svg>清除已完成</button>
    </div>
  </div>

  <div class="ag-tip">
    <b>怎么用</b>：
    <span>左边「子智能体」是 AI 接到复杂活时自己开的帮手（比如同时找素材、写文案、挑音乐），
    只在那一轮任务里活着，软件重启就自动清空，不会留垃圾。</span>
    <span>中间「后台任务」是软件派出去的活（扫素材、渲片、下载），带进度、可取消；
    历史越攒越多时点右上「清除已完成」，只清已经结束的，正在跑的不受影响。</span>
    <span>右边「后台工位」是首页那个监理派出去的长活（搜文案、写分镜、写代码做片子），
    每件单开一条会话，所以你在首页可以一直说话、随时补意见，不用等它跑完。</span>
  </div>

  <div class="ag-top" id="agTop">
    <div class="ag-kpi"><div class="n">—</div><div class="l">读取中</div></div>
  </div>

  <div class="ag-body">
    <div class="u-card ag-col">
      <div class="ag-h"><svg class="ic" style="width:14px;height:14px"><use href="#i-spark"/></svg>
        子智能体<span class="u-tag gray" id="agSubN">—</span></div>
      <div class="ag-rows" id="agSubs"><div class="ag-empty">读取中…</div></div>
    </div>
    <div class="u-card ag-col">
      <div class="ag-h"><svg class="ic" style="width:14px;height:14px"><use href="#i-task"/></svg>
        后台任务<span class="u-tag gray" id="agTaskN">—</span></div>
      <div class="ag-rows" id="agTasks"><div class="ag-empty">读取中…</div></div>
    </div>
    <!-- 后台工位：首页那个「监理」派出去的活。跟右边后台任务不是一回事 ——
         后台任务是软件内部的活（扫素材/渲片），工位是 AI 另开会话在想的活。 -->
    <div class="u-card ag-col">
      <div class="ag-h"><svg class="ic" style="width:14px;height:14px"><use href="#i-spark"/></svg>
        后台工位<span class="u-tag gray" id="agWorkN">—</span></div>
      <div class="ag-rows" id="agWorks"><div class="ag-empty">读取中…</div></div>
    </div>
  </div>
</section>

<script>
(function(){
  function A(){ return window.api.apply(null, arguments) }
  var $=function(s){return document.querySelector(s)};
  var top=$('#agTop'), subs=$('#agSubs'), tasks=$('#agTasks');
  var last=null;

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function secs(ms){ return ms<1000 ? ms+'ms' : (ms/1000).toFixed(1)+'s' }
  function hhmm(ts){
    if(!ts) return '';
    var d=new Date(Number(ts)); if(isNaN(d.getTime())) return '';
    var p=function(n){return n<10?'0'+n:''+n};
    return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }

  function paintTop(d){
    var items=[
      ['在跑的分身', d.subRunning, d.subRunning?'#2563EB':'#1E2430'],
      ['分身已完成', d.subDone],
      ['分身失败', d.subFailed, d.subFailed?'#B04949':null],
      ['后台在跑', d.taskRunning],
      ['排队中', d.taskQueued],
      ['任务总数', d.taskTotal],
    ];
    top.innerHTML=items.map(function(x){
      return '<div class="ag-kpi"><div class="n"'+(x[2]?' style="color:'+x[2]+'"':'')+'>'
        +(x[1]==null?'—':x[1])+'</div><div class="l">'+x[0]+'</div></div>';
    }).join('');
  }

  function paintSubs(d){
    var list=d.subagents||[];
    $('#agSubN').textContent = list.length ? (list.length+' 个') : '0';
    if(!list.length){
      subs.innerHTML='<div class="ag-empty">还没有子智能体跑过。<br>'
        +'当一个任务能拆成几件互不相干的事（比如同时找素材、写文案、挑音乐），'
        +'内核会自己开分身并行做，那时这里会出现记录。<br><br>'
        +'它们只活在那一轮任务里，软件重启就清空 —— 不会留下「在跑、其实早没了」的假记录。</div>';
      return;
    }
    subs.innerHTML=list.map(function(x){
      var cls = x.ended ? (x.ok?'ag-item':'ag-item bad') : 'ag-item run';
      var dur = x.ended ? secs(x.ended-x.started) : secs(Date.now()-x.started);
      var tag = x.ended
        ? (x.ok?'<span class="u-tag green">完成</span>':'<span class="u-tag red">失败</span>')
        : '<span class="u-tag gold"><i class="ag-dot" style="display:inline-block;vertical-align:middle;margin-right:3px"></i>在跑</span>';
      return '<div class="'+cls+'"><div class="ag-nm"><span class="t">'+esc(x.name||'子智能体')+'</span>'+tag+'</div>'
        +(x.task?'<div class="ag-task">'+esc(x.task)+'</div>':'')
        +'<div class="ag-meta"><span>开始 '+hhmm(x.started)+'</span><span>·</span><span>'+dur+'</span>'
        +(x.note?'<span>·</span><span>'+esc(x.note.slice(0,80))+'</span>':'')
        +'</div></div>';
    }).join('');
  }

  function paintTasks(d){
    var list=d.tasks||[];
    var c=d.counts||{};
    $('#agTaskN').textContent = (c['已完成']||0)+' 完成 / '+(c['失败']||0)+' 失败';
    if(!list.length){
      tasks.innerHTML='<div class="ag-empty">还没有后台任务。</div>';
      return;
    }
    tasks.innerHTML=list.map(function(x){
      var st=x.state||'';
      var cls = st==='运行中' ? 'ag-item run' : (st==='失败'?'ag-item bad':'ag-item');
      var tag = st==='已完成' ? '<span class="u-tag green">已完成</span>'
        : st==='失败' ? '<span class="u-tag red">失败</span>'
        : st==='运行中' ? '<span class="u-tag gold">运行中</span>'
        : '<span class="u-tag gray">'+esc(st||'未知')+'</span>';
      var pct=Math.max(0,Math.min(100,Number(x.progress)||0));
      return '<div class="'+cls+'"><div class="ag-nm"><span class="t">'+esc(x.name||x.id)+'</span>'+tag+'</div>'
        +(pct>0?'<div class="ag-bar"><i style="width:'+pct+'%"></i></div>':'')
        +'<div class="ag-meta"><span>'+esc(x.created||'')+'</span>'
        +(x.error?'<span>·</span><span style="color:#B04949">'+esc(String(x.error).slice(0,60))+'</span>':'')
        +(x.retries>1?'<span>·</span><span>重试 '+x.retries+' 次</span>':'')
        +'</div></div>';
    }).join('');
  }

  /* 后台工位：首页「监理」派出去的活，各自一条内核会话。
     状态只有四种：在跑 / 已完成 / 失败 / 已叫停，跟工位条上看到的一致。 */
  function paintWorks(l){
    var works=$('#agWorks');if(!works)return;
    var list=(l&&l.items)||[];
    var n=$('#agWorkN');
    if(n)n.textContent = list.length ? (l.running+' 在跑 / 共 '+list.length) : '0';
    if(!list.length){
      works.innerHTML='<div class="ag-empty">还没有派出去的活。<br><br>'
        +'在首页跟 AI 说「做一条片子」「搜几版钩子文案」这类长活时，'
        +'它会派给后台工位去干，自己留在对话里当监理 —— 你可以一边聊一边等。</div>';
      return;
    }
    works.innerHTML=list.map(function(x){
      var cls = x.status==='running' ? 'ag-item run' : (x.status==='failed' ? 'ag-item bad' : 'ag-item');
      var tag = x.status==='running'
        ? '<span class="u-tag gold"><i class="ag-dot" style="display:inline-block;vertical-align:middle;margin-right:3px"></i>在跑</span>'
        : x.status==='done' ? '<span class="u-tag green">已完成</span>'
        : x.status==='failed' ? '<span class="u-tag red">失败</span>'
        : '<span class="u-tag gray">已叫停</span>';
      var dur = x.ended ? secs(x.ended-x.started) : secs(Date.now()-x.started);
      return '<div class="'+cls+'"><div class="ag-nm"><span class="t">'+esc(x.title||'工位')+'</span>'+tag+'</div>'
        +(x.last?'<div class="ag-task">'+esc(String(x.last).slice(0,120))+'</div>':'')
        +'<div class="ag-meta"><span>'+esc(x.kind||'通用')+'</span><span>·</span><span>'+dur+'</span>'
        +'<span>·</span><span>'+x.stepCount+' 步</span>'
        +(x.error?'<span>·</span><span>'+esc(String(x.error).slice(0,60))+'</span>':'')
        +'</div></div>';
    }).join('');
  }

  function load(){
    A('/api/agents',{action:'list',limit:60}).then(function(d){
      last=d||{};
      paintTop(last); paintSubs(last); paintTasks(last);
    }).catch(function(e){
      subs.innerHTML='<div class="ag-empty">读不到：'+esc((e&&e.message)||e)+'</div>';
    });
    /* 工位单独取，一处失败不影响其它两栏 */
    A('/api/workers',{action:'list'}).then(paintWorks).catch(function(e){
      var w=$('#agWorks'); if(w) w.innerHTML='<div class="ag-empty">读不到：'+esc((e&&e.message)||e)+'</div>';
    });
  }

  $('#agRefresh').addEventListener('click',load);
  /* 清除已结束的后台任务记录 —— 只清任务中心的存档，不删成片文件。
     后端 tasks({action:'clear'}) 只保留运行中/排队中，正在跑的不受影响。 */
  $('#agClearDone').addEventListener('click',function(){
    var n=(last&&last.counts)?((last.counts['已完成']||0)+(last.counts['失败']||0)+(last.counts['已取消']||0)):0;
    var ask=function(){
      A('/api/tasks',{action:'clear'}).then(function(d){
        var removed=(d&&d.removed)||n;
        say(removed?('已清除 '+removed+' 条已结束的任务（成片文件没动）'):'没有可清除的任务');
        load();
      }).catch(function(e){say('清除失败：'+((e&&e.message)||e))});
    };
    if(window.__confirmAsk){
      window.__confirmAsk('清除已结束的后台任务记录？成片文件不会删除，正在跑的任务不受影响。',ask,{title:'清除已完成',ok:'清除'});
    }else if(window.confirm){ if(window.confirm('清除已结束的后台任务记录？成片文件不会删除。'))ask() }
    else ask();
  });
  document.addEventListener('riffcut-ready',load);
  /* 主进程收到子智能体通知时会推一份过来，不用等轮询 */
  if(window.riffcut&&window.riffcut.onAgents){
    window.riffcut.onAgents(function(d){ if(d){ last=d; paintTop(d); paintSubs(d) } });
  }
  if(window.RiffCut) load();
})();
</script>
