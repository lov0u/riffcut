<style>
.h-idea{padding:8px 0;border-bottom:1px solid #F1F4F8}
.h-idea:last-child{border-bottom:0}
.h-idea .t{font-size:13px;color:#2C3340;line-height:1.45}
.h-idea .a{font-size:12px;color:#5C6478;line-height:1.5;margin-top:3px}
.h-idea .m{display:flex;align-items:center;gap:8px;margin-top:6px}
.h-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.h-plat{height:29px;padding:0 11px;border:1px solid var(--line);border-radius:12px;background:#FFF;
  font-size:var(--f5);color:#5A6272;box-shadow:var(--sh-btn);cursor:pointer;display:inline-flex;
  align-items:center;gap:5px;transition:all .16s;white-space:nowrap}
.h-plat:hover{border-color:#A8C4F8}
.h-plat.on{background:#EFF4FF;border-color:#A8C4F8;color:#33405A;font-weight:600}
.h-plat .dot{width:5px;height:5px;border-radius:50%;background:#35B26B}
.h-plat .dot.off{background:#C9CED8}
.h-plat.dead{opacity:.62}
.h-plat .n{margin-left:2px;font-size:10px;font-style:normal;color:#8A92A2;
  font-variant-numeric:tabular-nums}
.h-plat.on .n{color:var(--accent-ink)}
.h-search{display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:#FFF;box-shadow:var(--sh-in);min-width:190px}
.h-search input{;font-size:var(--f4);color:#333B49;width:100%;min-width:0}
.h-search .ic{width:13px;height:13px;color:#9AA2B1;flex:0 0 auto}
.h-body{flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(0,1fr) clamp(280px,23vw,340px);
  gap:clamp(8px,1%,12px)}
.h-list{display:flex;flex-direction:column;min-height:0;padding:0}
.h-list-head{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line);
  flex:0 0 auto;font-size:var(--f3);font-weight:600}
.h-list-head .u-tag{margin-left:auto}
.h-rows{flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding:6px 12px 12px}
.h-rows::-webkit-scrollbar{display:none}
.h-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line-c);
  border-radius:var(--r-md);cursor:pointer;transition:background .14s,border-color .14s}
.h-row:hover{background:#FFFFFF;border-color:var(--line)}
.h-row .rk{width:22px;flex:0 0 auto;text-align:center;font-size:var(--f5);font-weight:700;color:#A6ADBB}
.h-row.top1 .rk{color:#D0553E}.h-row.top2 .rk{color:#D89A2E}.h-row.top3 .rk{color:#8A93A6}
.h-row .tt{flex:1;min-width:0;font-size:var(--f4);color:#333B49;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  white-space:normal;line-height:1.45}
.h-row .hot{flex:0 0 auto;font-size:var(--f5);color:#8A92A2;font-variant-numeric:tabular-nums}
.h-row .mini{flex:0 0 auto;height:23px;padding:0 8px;font-size:10.5px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:#FFF;color:#5A6272;cursor:pointer;box-shadow:var(--sh-btn);
  display:none;align-items:center;gap:4px}
.h-row:hover .mini{display:inline-flex}
.h-side{display:flex;flex-direction:column;gap:clamp(8px,1%,12px);min-height:0}
.h-ideas{display:flex;flex-direction:column;min-height:0;padding:0;flex:1}
.h-ideas-head{padding:10px 14px;border-bottom:1px solid var(--line);font-size:var(--f3);font-weight:600;
  display:flex;align-items:center;gap:8px;flex:0 0 auto}
.h-ideas-head .ic{width:15px;height:15px;color:var(--gold-deep)}
.h-ideas-body{flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding:10px 12px}
.h-ideas-body::-webkit-scrollbar{display:none}
.h-idea .t{font-size:var(--f4);font-weight:600;color:#333B49;line-height:1.5}
.h-idea .a{font-size:var(--f5);color:#5A6272;line-height:1.65;margin-top:5px}
.h-idea .m{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.h-idea .m .u-tag{height:19px;font-size:10.5px}
.h-idea .acts{margin-left:auto;display:flex;gap:5px}
.h-idea .acts button{height:22px;padding:0 8px;font-size:10.5px}
.h-note{flex:0 0 auto;padding:7px 12px;border:1px solid #E4E9F1;background:#FAFBFD;
  border-radius:var(--r-md);font-size:var(--f5);color:#7A8291;line-height:1.6}
.h-note b{color:#33405A}
/* 窄窗口（高度<1000 或 宽度不够）时不要藏侧栏 —— 选题面板是这个页的核心功能，
   藏掉等于「热点能看不能用」。改成上下排，两边都留着，整页可纵向滚动。 */
/* 只有真正矮屏（<620）才上下排；826 这种常见高度保持双栏，
   否则「热点能看、选题要滚下去」，一页拆成两屏。 */
.tiny .h-body{grid-template-columns:1fr;
  grid-template-rows:minmax(180px,1.1fr) minmax(150px,.9fr);overflow:auto;
  scrollbar-width:none}
.tiny .h-body::-webkit-scrollbar{display:none}
.compact .h-list,.tiny .h-list{min-height:180px}
.compact .h-side,.tiny .h-side{min-height:150px}
.compact .h-ideas,.tiny .h-ideas{min-height:150px}
.compact .h-ideas-body,.tiny .h-ideas-body{max-height:none}
.tiny .h-row .mini{display:none!important}
</style>

<section class="page" data-page="hotspot">
  <div class="u-head">
    <div class="txt">
      <div class="u-title"><svg class="ic" style="width:18px;height:18px"><use href="#i-chart"/></svg>热点雷达</div>
      <div class="u-sub">看各平台实时热搜 · 按赛道筛 · 直接变成选题丢给 AI 导演</div>
    </div>
    <div class="u-actions">
      <input class="u-input" id="hKw" placeholder="赛道关键词，如 科技,AI" style="width:180px;height:32px">
      <button class="u-btn" id="hRefresh"><svg class="ic"><use href="#i-refresh"/></svg>刷新</button>
      <button class="u-btn gold" id="hIdeasBtn"><svg class="ic"><use href="#i-bulb"/></svg>出选题</button>
    </div>
  </div>

  <div class="h-bar" id="hPlats"></div>

  <div class="h-body">
    <div class="u-card h-list">
      <div class="h-list-head">
        <svg class="ic" style="width:15px;height:15px"><use href="#i-list"/></svg>
        <span id="hTitle">实时热搜</span>
        <span class="u-tag gray" id="hCount">—</span>
      </div>
      <div class="h-rows" id="hRows">
        <div class="u-empty"><svg class="ic"><use href="#i-chart"/></svg>
          <div>读取热点…</div></div>
      </div>
    </div>

    <div class="h-side">
      <div class="h-note">
        <b>这些数据是真的，抓不到就空着。</b>主源 xxapi（实测四个平台全通），
        备源 60s（六端点现挂五个，只在主源失败时兜一下）。抓不到会明确告诉你，
        不会编一条热搜糊过去。
      </div>
      <div class="u-card h-ideas">
        <div class="h-ideas-head"><svg class="ic"><use href="#i-spark"/></svg>选题建议
          <span class="u-tag gold" style="margin-left:auto" id="hIdeaCount">0 条</span></div>
        <div class="h-ideas-body" id="hIdeaBox">
          <div class="u-empty"><svg class="ic"><use href="#i-bulb"/></svg>
            <div>点右上「出选题」，从当前榜单里挑几条给你切入角度。</div></div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var $$=function(s){return [].slice.call(document.querySelectorAll(s))};
  var A=function(p,d){return window.api(p,d)};
  var say=function(m){if(window.say)window.say(m)};
  var PLATS=[],CUR='weibo',ITEMS=[],inited=false;

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function human(n){n=+n||0;
    if(n>=1e8)return (n/1e8).toFixed(1)+'亿';
    if(n>=1e4)return (n/1e4).toFixed(1)+'万';
    return String(n)}

  /* 启动：原来只靠 riffcut-ready + 一次 1400ms 兜底，任一环节没来就整页停在
     「读取热点…」的空态（实测 init 从没执行，点刷新却能出数据 —— 因为刷新
     按钮自己绑了 loadBoard）。这里改成 DOM 就绪就跑 + 多次重试，不再赌事件。 */
  function init(){
    if(inited)return; inited=true;
    bind(); loadPlats();
  }
  function boot(){
    init();
    /* 侧栏/搜索的 data 可能晚于脚本，补两次重试；已加载就不再打接口 */
    if(!document.querySelectorAll('.h-plat').length) loadPlats();
  }
  document.addEventListener('riffcut-ready',function(){init()});
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
  setTimeout(boot,500);
  setTimeout(boot,1800);
  /* 切到热点页时如果还是空的，再拉一次 */
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('[data-page="hotspot"],#sideSet'):null;
    if(a)setTimeout(boot,320);
  },true);

  function bind(){
    var r=$('#hRefresh'); if(r)r.addEventListener('click',function(){loadBoard(true)});
    var g=$('#hIdeasBtn'); if(g)g.addEventListener('click',makeIdeas);
    var k=$('#hKw'); if(k)k.addEventListener('keydown',function(e){
      if(e.key==='Enter'){loadBoard(true)}});
  }

  /* 接口真实形状是 {ok, boards:{weibo:{ok,label,items[]},...}}，
     不是数组、也没有顶层 items —— 早前前端按 d.items / d.length 取，
     全都拿到 undefined，于是永远停在「读取热点…」的空态。
     这里统一用 boardsOf() 把两种形状（数组 / boards 对象）都收成平台清单。 */
  function boardsOf(d){
    var b=(d&&d.boards)||{};
    return Object.keys(b).map(function(k){
      var it=b[k]||{};
      return {key:k, label:it.label||k, ok:it.ok!==false, n:(it.items||[]).length};
    });
  }
  /* 注意：同一个 action 用 GET 和 POST 打，返回形状不一样 ——
       GET  ?action=fetch  → {ok, boards:{weibo:{items:[]}}}
       POST {action:'fetch'}→ {ok, platform, label, items[], source, at}
     前端走 window.api（POST），所以先读扁平形状，再回落到 boards。 */
  function itemsOf(d,plat){
    if(!d) return [];
    if(Array.isArray(d.items)) return d.items.slice();
    var b=d.boards||{}, one=b[plat]||{};
    return (one.items||[]).slice();
  }
  function metaOf(d,plat){
    if(!d) return {};
    if(Array.isArray(d.items)) return d;
    var b=d.boards||{};
    return b[plat]||{};
  }

  function loadPlats(){
    A('/api/hotspot',{action:'platforms'}).then(function(d){
      var arr=Array.isArray(d)?d:boardsOf(d);
      PLATS=arr.length?arr:[];
      renderPlats();
      loadBoard(false);
    }).catch(function(){ renderPlats(); loadBoard(false); });
  }

  var FALLBACK=[{key:'weibo',label:'微博'},{key:'douyin',label:'抖音'},
                {key:'zhihu',label:'知乎'},{key:'baidu',label:'百度'}];
  function renderPlats(){
    var box=$('#hPlats'); if(!box)return;
    if(!PLATS.length) PLATS=FALLBACK.slice();
    if(!PLATS.length){
      // 拿不到清单也要能用：先把已知的列出来
      PLATS=[{key:'weibo',label:'微博'},{key:'douyin',label:'抖音'},
             {key:'bilibili',label:'B站'},{key:'baidu',label:'百度'}];
    }
    box.innerHTML=PLATS.map(function(p){
      var dead=(p.ok===false)||(p.n===0);
      return '<button class="h-plat'+(p.key===CUR?' on':'')+(dead?' dead':'')+'" data-p="'+esc(p.key)+'">'
        +'<span class="dot'+(dead?' off':'')+'"></span>'+esc(p.label)
        +(p.n?'<i class="n">'+p.n+'</i>':'')+'</button>';
    }).join('');
    [].slice.call(box.querySelectorAll('.h-plat')).forEach(function(b){
      b.addEventListener('click',function(){
        CUR=b.getAttribute('data-p');
        renderPlats(); loadBoard(false);
      });
    });
  }

  function loadBoard(fresh){
    var box=$('#hRows'); if(!box)return;
    box.innerHTML='<div class="u-empty"><svg class="ic"><use href="#i-refresh"/></svg><div>正在抓「'+
      esc(labelOf(CUR))+'」…</div></div>';
    A('/api/hotspot',{action:'fetch',platform:CUR,limit:30,fresh:fresh?1:0}).then(function(d){
      var arr=itemsOf(d,CUR);
      var one=metaOf(d,CUR);
      if(!arr.length){
        ITEMS=[];
        box.innerHTML='<div class="u-empty"><svg class="ic"><use href="#i-chart"/></svg>'
          +'<div>「'+esc(labelOf(CUR))+'」这个源现在抓不到：'
          +esc(one.error||(d&&d.error)||'没有返回数据')
          +'<br>换个平台看看，或者点刷新重试。</div></div>';
        setCount(0); return;
      }
      ITEMS=arr;
      renderRows();
      setCount(ITEMS.length, one.source, one.at);
    }).catch(function(e){
      box.innerHTML='<div class="u-empty"><div>抓取失败：'+esc(e&&e.message||e)+'</div></div>';
    });
  }

  function labelOf(k){
    for(var i=0;i<PLATS.length;i++){if(PLATS[i].key===k)return PLATS[i].label}
    return k;
  }

  function setCount(n,src,at){
    var c=$('#hCount'); if(c)c.textContent=n?n+' 条':'0 条';
    var t=$('#hTitle'); if(t)t.textContent='实时热搜 · '+labelOf(CUR)+(src?'（'+src+'）':'');
  }

  function renderRows(){
    var box=$('#hRows');
    if(!ITEMS.length){box.innerHTML='<div class="u-empty"><div>这个榜单是空的。</div></div>';return}
    box.innerHTML=ITEMS.map(function(it,i){
      var rk=it.rank||i+1;
      var cls=rk===1?' top1':(rk===2?' top2':(rk===3?' top3':''));
      return '<div class="h-row'+cls+'" data-i="'+i+'">'
        +'<span class="rk">'+rk+'</span>'
        +'<span class="tt" title="'+esc(it.title)+'">'+esc(it.title)+'</span>'
        +(it.hot?'<span class="hot">'+human(it.hot)+'</span>':'')
        +'<button class="mini" data-act="use" data-i="'+i+'">用它做一条</button>'
        +'</div>';
    }).join('');
    [].slice.call(box.querySelectorAll('[data-act="use"]')).forEach(function(b){
      b.addEventListener('click',function(e){
        e.stopPropagation();
        var it=ITEMS[+b.getAttribute('data-i')];
        if(it)toDirector(it.title);
      });
    });
  }

  /* 「出选题」：后端 hotspot.topic_ideas 是纯规则（不调模型），
     拿当前榜单 + 赛道关键词，给出「怎么切」的角度。
     早前这里只有 bind() 里的一句 addEventListener(makeIdeas)，
     函数体从来没写 —— 点一下就 ReferenceError，按钮形同虚设。 */
  function makeIdeas(){
    var box=$('#hIdeaBox'), cnt=$('#hIdeaCount');
    var kw=($('#hKw')&&$('#hKw').value||'').trim();
    if(!ITEMS.length){
      if(box)box.innerHTML='<div class="u-empty"><div>榜单还是空的，先点「刷新」。</div></div>';
      return;
    }
    if(box)box.innerHTML='<div class="u-empty"><div>正在挑角度…</div></div>';
    if(typeof window.api!=='function'){setTimeout(makeIdeas,400);return}
    window.api('/api/hotspot',{action:'ideas',platform:CUR,items:ITEMS,keywords:kw,n:3})
      .then(function(d){
        var arr=(d&&d.ideas)||[];
        if(!arr.length){
          if(box)box.innerHTML='<div class="u-empty"><div>这几条都不好切，换个关键词再试。</div></div>';
          if(cnt)cnt.textContent='0 条';
          return;
        }
        if(cnt)cnt.textContent=arr.length+' 条';
        if(box){
          box.innerHTML=arr.map(function(it,i){
            return '<div class="h-idea" data-i="'+i+'">'
              +'<div class="t">'+esc(it.title)+'</div>'
              +'<div class="a">'+esc(it.angle||'')+'</div>'
              +'<div class="m"><span class="u-tag gray">'+esc(it.format||'')+'</span>'
              +'<button class="mini" data-act="idea" data-i="'+i+'">用它做一条</button></div>'
              +'</div>';
          }).join('');
          [].slice.call(box.querySelectorAll('[data-act="idea"]')).forEach(function(b){
            b.addEventListener('click',function(e){
              e.stopPropagation();
              var it=arr[+b.getAttribute('data-i')];
              if(it)toDirector(it.title);
            });
          });
        }
      }).catch(function(){
        if(box)box.innerHTML='<div class="u-empty"><div>没取到选题，稍后再试。</div></div>';
      });
  }

  /* AI 导演页已删（它的功能并进首页对话框）。热点还是照样能「去做一条」，
     只是目标换成首页那个输入框 —— 两个页面本来就是同一个东西。 */
  function toDirector(title){
    if(window.goPage)window.goPage('home');
    setTimeout(function(){
      var inp=document.querySelector('#hChatInput');
      if(inp){
        inp.value='围绕这个热点做一条竖屏短视频：'+title;
        inp.dispatchEvent(new Event('input',{bubbles:true}));
        inp.focus();
        say('已把热点填进首页输入框，补一句要求就能开工');
      }else{
        say('没找到输入框，请到首页手动输入');
      }
    },120);
  }

})();
</script>
